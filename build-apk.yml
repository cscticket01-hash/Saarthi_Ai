name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project files
        run: |
          flutter config --enable-android
          flutter create --platforms=android .
          ls -la android/app/
      - name: Force SDK 34 & Disable AAR Check
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          fi
          
          mkdir -p android
          cat << 'EOF' >> android/build.gradle

          allprojects {
              subprojects {
                  afterEvaluate { project ->
                      if (project.hasProperty("android")) {
                          android {
                              compileSdkVersion 34
                          }
                      }
                  }
                  tasks.matching { it.name.contains("checkReleaseAarMetadata") }.configureEach {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Add Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
