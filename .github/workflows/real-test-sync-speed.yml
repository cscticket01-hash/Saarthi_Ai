name: REAL TEST Sync V2 Google Script and Drive latency
# Initial TEST-only 3-run benchmark passed 2026-11-02; keep reproducible
# workflow for manual rechecks, but do not compete with current photo benchmark.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archival-real-test-speed-manual
  cancel-in-progress: false
jobs:
  isolated-real-cloud-benchmark:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/live-sync-authority-v1-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local test harness JavaScript syntax
        run: node --check .github/scripts/real_test_sync_speed.cjs
      - name: Measure three genuine TEST-only write/Drive-read/delete cycles
        env:
          VS_REAL_LATENCY_RUN: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/real_test_sync_speed.cjs
      - name: Preserve sanitized real network timing and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-test-sync-speed
          path: build/cloud-prerequisites/real-test-sync-speed.json
          if-no-files-found: warn
          retention-days: 7
