name: Sync4 joined independent notice/person Cloudflare admission
on:
  pull_request:
    paths:
      - 'lib/windows_sync_parallel_admission.dart'
      - 'lib/windows_pending_school_sync.dart'
      - 'lib/windows_sync_engine.dart'
      - 'test/windows_sync_parallel_admission_test.dart'
      - '.github/workflows/sync4-joined-notice-person-review.yml'
permissions:
  contents: read
jobs:
  safe-parallel-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Verify safe independent notice selection, school barriers and joined admission
        run: flutter test test/windows_sync_parallel_admission_test.dart
      - name: Analyze existing Windows transport and new selection helper
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/windows_sync_parallel_admission.dart lib/windows_pending_school_sync.dart lib/windows_sync_engine.dart
