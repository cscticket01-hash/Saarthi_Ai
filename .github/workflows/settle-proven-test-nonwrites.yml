name: Audit and reclassify proven isolated TEST nonwrites
on:
  push:
    branches: [test/settle-proven-nonwrites-20261111]
    paths:
      - '.github/scripts/settle_proven_test_nonwrites.cjs'
      - '.github/scripts/settle_proven_test_nonwrites.test.cjs'
      - '.github/scripts/proven_test_nonwrites.json'
      - '.github/workflows/settle-proven-test-nonwrites.yml'
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    if: github.repository == 'cscticket01-hash/Saarthi_Ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/settle_proven_test_nonwrites.test.cjs
      - run: npm --prefix functions install --ignore-scripts --no-package-lock
      - name: Verify original source reports and preview only the exact metadata repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.SCHOOL_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/settle_proven_test_nonwrites.cjs --plan
  reclassify:
    needs: evidence
    concurrency:
      group: sync3-verified-test-school-mutations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix functions install --ignore-scripts --no-package-lock
      - name: Archive original metadata atomically and reclassify only proven nonwrites
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.SCHOOL_SERVICE_ACCOUNT_JSON }}
          VS_RECLASSIFY_PROVEN_NONWRITES: vs-db8afb01a3be46a983c8284714d06e5d
        run: node .github/scripts/settle_proven_test_nonwrites.cjs --apply
