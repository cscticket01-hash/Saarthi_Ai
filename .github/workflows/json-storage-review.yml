name: JSON school storage review
on:
  push:
    branches: [feature/school-json-storage]
  pull_request:
    branches: [main]
    paths: ['school-backend/**', 'functions/**', '.github/workflows/json-storage-review.yml']
permissions:
  contents: read
jobs:
  json-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
        working-directory: functions
      - run: npm test
        working-directory: functions
      - name: Verify generated Apps Script matches reviewed source
        run: |
          python .github/scripts/build_managed_script.py
          git diff --exit-code -- school-backend/managed/SaarthiManagedAll.gs
  offline-owner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Offline pending work, revisions and durable restart regressions
        env:
          APPDATA: ${{ runner.temp }}/json-storage-review
        run: flutter test --concurrency=1 --timeout 90s test/windows_local_restore_sync_test.dart test/windows_sync_revision_test.dart test/windows_sync_durable_admission_test.dart test/mobile_smart_sync_test.dart
