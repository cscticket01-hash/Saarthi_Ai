name: Isolated TEST Atomic Person cloud acceptance
on:
  push:
    branches: [test/atomic-person-live-20261113]
    paths:
      - '.github/workflows/atomic-person-live-acceptance.yml'
      - '.github/scripts/test_atomic_person_live.cjs'
      - '.github/scripts/await_test_gate.cjs'
permissions:
  actions: read
  contents: read
env:
  VS_EXPECTED_TEST_RUNTIME: 9b0faf19b81f2d2258adb2a1b6d3b69209f56fe0
jobs:
  prerequisites:
    if: github.repository == 'cscticket01-hash/Saarthi_Ai'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing gate regressions and disaster support
        run: |
          node --test .github/scripts/await_test_gate.test.cjs
          node -e "require('./.github/scripts/await_test_gate.cjs').selectGate([], 'disaster', process.env.VS_EXPECTED_TEST_RUNTIME)"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '14059942279'
          run-id: '43470463029'
          repository: cscticket01-hash/Saarthi_Ai
          github-token: ${{ github.token }}
          path: verified-original-delete
      - name: Require pinned cloud, readiness, recovery and exact resumed original-delete evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const repo='cscticket01-hash/Saarthi_Ai';
          const gates=[
            [43433698894,'9b0faf19b81f2d2258adb2a1b6d3b69209f56fe0','feature/smart-sync-3','Isolated TEST cloud prerequisites'],
            [43433698858,'9b0faf19b81f2d2258adb2a1b6d3b69209f56fe0','feature/smart-sync-3','Sync 3 isolated TEST readiness'],
            [43433699020,'9b0faf19b81f2d2258adb2a1b6d3b69209f56fe0','feature/smart-sync-3','Isolated TEST disaster recovery acceptance'],
            [43470463029,'9ca2e06be2f499a17711a13efd198f7a88fe8a5b','test/resume-failed-delete-20261113','Complete only the exact failed TEST delete from verified evidence'],
          ];
          async function main(){
            for(const [id,sha,branch,name] of gates){
              const r=await fetch('https://api.github.com/repos/'+repo+'/actions/runs/'+id,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
              assert.equal(r.status,200);const run=await r.json();
              assert.equal(run.head_sha,sha);assert.equal(run.head_branch,branch);assert.equal(run.name,name);
              assert.equal(run.event,'push');assert.equal(run.head_repository.full_name,repo);assert.equal(run.conclusion,'success');
            }
            const proof=JSON.parse(fs.readFileSync('verified-original-delete/original-delete-completion.json','utf8'));
            assert.equal(proof.status,'PASS');
            for(const key of ['originalOperationRetained','deletionReceiptVerified','originalRecordsVerified','pdfInaccessible','websiteReadback','deletedPersonLoginRejected'])assert.equal(proof[key],true);
            console.log('Exact original-delete completion and pinned TEST prerequisites verified; this does not waive production gates.');
          }
          main().catch(()=>{console.error('Exact TEST prerequisite proof unavailable');process.exitCode=1});
          JS

  atomic-person:
    needs: prerequisites
    concurrency:
      group: sync3-verified-test-school-mutations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the deployed broker and Worker tree
        run: git diff --exit-code "$VS_EXPECTED_TEST_RUNTIME" HEAD -- functions oauth-broker staging-school-cloud cloudflare-sync school-backend package.json package-lock.json
      - name: Publish synthetic TEST bundles and verify Drive before restoring legacy authority
        env:
          VS_TEST_CONNECT_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/test_atomic_person_live.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-atomic-person-live-evidence
          path: build/cloud-prerequisites/atomic-person-live.json
