name: Owner-authorized disposable TEST original archive
on:
  push:
    branches: [test/abandon-originals-20261115]
    paths:
      - '.github/scripts/disposable_test_abandonment.cjs'
      - '.github/workflows/test-disposable-originals.yml'
permissions:
  contents: read
concurrency:
  group: sync3-20261114-safe-real-provider-gates
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.repository == 'cscticket01-hash/Saarthi_Ai' && github.ref == 'refs/heads/test/abandon-originals-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VS_EXPECTED_TEST_RUNTIME: 5da8ae1e8571fd0f47cd1f304458434a5218bd7d
      VS_CLEANUP_PHASE: verified_reconcile
      VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
      VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin reviewed deployed TEST business source and cleanup regressions
        run: |
          git diff --exit-code "$VS_EXPECTED_TEST_RUNTIME" HEAD -- functions oauth-broker staging-school-cloud cloudflare-sync school-backend package.json package-lock.json
          npm --prefix functions install --ignore-scripts --no-package-lock
          node --test functions/test/test-original-abandonment.test.js
      - name: Reconcile originals only with matching verified proof
        run: node .github/scripts/disposable_test_abandonment.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-test-abandonment-evidence
          path: build/cloud-prerequisites/test-abandonment.json
          retention-days: 14
