name: Platform review builds
permissions:
  contents: read
concurrency:
  group: platform-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      requires_secret: ${{ steps.google-oauth.outputs.requires_secret }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Check platform backend
      working-directory: functions
      run: |
        npm install
        node --check platform.js
        node --check domain.js
        npm test
    - name: Verify OAuth exchange service security
      run: |
        npm --prefix oauth-broker install --ignore-scripts
        node --test oauth-broker/test/*.test.cjs
    - name: Build unpublished OAuth service container
      run: docker build -t saarthi-oauth-broker-review oauth-broker
    - name: Diagnose configured Google Desktop token exchange safely
      id: google-oauth
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        SAARTHI_GOOGLE_DESKTOP_CLIENT_ID: ${{ inputs.google_oauth_client_id || vars.SAARTHI_GOOGLE_DESKTOP_CLIENT_ID }}
        SAARTHI_GOOGLE_OAUTH_BROKER_URL: ${{ vars.SAARTHI_GOOGLE_OAUTH_BROKER_URL || 'https://saarthi-oauth-staging.onrender.com/oauth/token' }}
        SAARTHI_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.SAARTHI_GOOGLE_DESKTOP_CLIENT_SECRET }}
      run: node oauth-broker/probe.cjs
    - uses: actions/upload-artifact@v4
      with:
        name: oauth-broker-review-source
        path: oauth-broker
  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - run: flutter create --platforms=web --project-name saarthi_ai .
    - run: flutter pub get
    - name: Format platform source for review
      run: dart format lib/main.dart lib/main_android.dart lib/main_windows.dart lib/developer_portal.dart lib/school_document_renderer.dart
        lib/windows_platform_client.dart lib/windows_license_gate.dart lib/windows_school_operations.dart lib/windows_document_templates.dart
        lib/mobile/school_session.dart lib/platform/platform_config.dart test/document_renderer_test.dart lib/windows_school_identity.dart
        lib/mobile/school_notifications.dart test/mobile_boundary_test.dart
        lib/school_text_data.dart lib/school_backend_transport.dart test/school_text_data_test.dart lib/platform/developer_service.dart lib/platform/spark_client.dart
        lib/platform/github_updates.dart lib/platform/monitor_summary.dart lib/mobile/school_messaging.dart
        lib/managed_developer_panel.dart lib/developer_account_widgets.dart lib/firebase_monitor_panel.dart lib/school_password_panel.dart
        test/monitor_summary_test.dart test/account_ui_test.dart test/spark_license_test.dart test/github_update_test.dart
    - name: Analyze developer portal
      run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/developer_portal.dart lib/school_document_renderer.dart lib/platform
    - name: Analyze Windows school source
      run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main_windows.dart lib/main_dashboard_screen_windows.dart
        lib/windows_school_operations.dart lib/windows_school_identity.dart lib/windows_platform_client.dart lib/windows_document_templates.dart
        lib/windows_backend_bridge.dart lib/windows_admin_sidebar.dart lib/windows_ui_localization.dart lib/windows_ui_translations.dart lib/windows_preferences_reset.dart lib/windows_exam_service.dart lib/windows_notice_delivery.dart lib/windows_monthly_attendance.dart
        lib/windows_sync_engine.dart lib/windows_firebase_sync.dart lib/school_text_data.dart lib/school_backend_transport.dart
        lib/managed_developer_panel.dart lib/developer_account_widgets.dart lib/firebase_monitor_panel.dart lib/school_password_panel.dart lib/windows_settings_panel.dart lib/windows_managed_school_gate.dart
        lib/windows_staff_payroll.dart lib/windows_app_reset.dart lib/windows_license_gate.dart lib/windows_admin_setup.dart lib/windows_connect
    - name: Verify documents and mobile school boundaries
      run: flutter test test/document_renderer_test.dart test/mobile_boundary_test.dart test/school_text_data_test.dart test/monitor_summary_test.dart test/account_ui_test.dart test/spark_license_test.dart test/github_update_test.dart
    - name: Verify Windows portal regressions
      env:
        APPDATA: ${{ runner.temp }}/windows-portal-tests
      run: flutter test test/windows_portal_test.dart
    - name: Verify payroll, reset and licence activation regressions
      env:
        APPDATA: ${{ runner.temp }}/windows-operations-tests
      run: flutter test test/windows_operations_test.dart
    - name: Verify Windows startup and skip regression
      env:
        APPDATA: ${{ runner.temp }}/windows-startup-tests
      run: flutter test test/windows_startup_test.dart test/windows_managed_school_gate_test.dart test/windows_save_pdf_test.dart test/windows_script_storage_test.dart test/windows_school_profile_restore_test.dart
    - name: Verify central school cloud and paths
      run: flutter test test/central_school_cloud_test.dart
    - name: Verify school connection automation
      run: |
        python tool/build_school_setup_bundle.py --check
        flutter test test/windows_easy_connect_test.dart --dart-define=SAARTHI_LEGACY_PROVISIONING_TEST_ONLY=true
    - name: Build developer website
      env:
        SAARTHI_SCHOOL_CLOUD_URL: ${{ vars.SAARTHI_SCHOOL_CLOUD_URL || 'https://saarthi-oauth-staging.onrender.com/school-cloud' }}
      run: flutter build web --release --dart-define=SAARTHI_SCHOOL_CLOUD_URL=$SAARTHI_SCHOOL_CLOUD_URL
    - uses: actions/upload-artifact@v4
      with:
        name: developer-website-preview
        path: |
          build/web
          build/document-previews
          build/reference-document-previews
    - name: Bundle school copy-paste backend
      run: python .github/scripts/bundle_school_backend.py
    - uses: actions/upload-artifact@v4
      with:
        name: school-backend-copy-paste
        path: build/school-backend
    - uses: actions/upload-artifact@v4
      with:
        name: formatted-platform-source
        path: |
          lib/main.dart
          lib/main_android.dart
          lib/main_windows.dart
          lib/developer_portal.dart
          lib/managed_developer_panel.dart
          lib/developer_account_widgets.dart
          lib/firebase_monitor_panel.dart
          lib/school_password_panel.dart
          lib/school_document_renderer.dart
          lib/windows_platform_client.dart
          lib/windows_license_gate.dart
          lib/windows_school_operations.dart
          lib/windows_document_templates.dart
          lib/mobile/school_session.dart
          lib/platform
          lib/mobile/school_messaging.dart
          test/monitor_summary_test.dart
          test/spark_license_test.dart
          test/github_update_test.dart
          test/document_renderer_test.dart

          lib/windows_school_identity.dart
          lib/mobile/school_notifications.dart
          test/mobile_boundary_test.dart
          lib/school_text_data.dart
          lib/school_backend_transport.dart
          test/school_text_data_test.dart
  school-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Install isolated school rules test dependencies
      working-directory: security-tests
      run: npm ci
    - name: Verify school Firestore rules in an emulator
      working-directory: security-tests
      run: npm test
  windows:
    needs: backend
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - run: flutter create --platforms=windows --project-name saarthi_ai .
    - name: Keep Windows local dependencies
      shell: bash
      run: |
        python - <<'PY'
        import re
        p='pubspec.yaml'
        s=open(p).read()
        for name in ['firebase_core','firebase_auth','firebase_messaging','flutter_local_notifications','cloud_firestore','agora_rtc_engine','mobile_scanner','geolocator']:
          s=re.sub(r'^  '+name+r':[^\n]*\n','',s,flags=re.M)
        open(p,'w').write(s)
        PY
    - run: flutter pub get
    - name: Verify configured public OAuth client in compiled Dart
      env:
        SAARTHI_GOOGLE_DESKTOP_CLIENT_ID: ${{ inputs.google_oauth_client_id || vars.SAARTHI_GOOGLE_DESKTOP_CLIENT_ID }}
        SAARTHI_GOOGLE_OAUTH_BROKER_URL: ${{ vars.SAARTHI_GOOGLE_OAUTH_BROKER_URL || 'https://saarthi-oauth-staging.onrender.com/oauth/token' }}
        SAARTHI_GOOGLE_REQUIRES_BROKER: ${{ needs.backend.outputs.requires_secret }}
        OAUTH_SECRET_PRESENT: ${{ secrets.SAARTHI_GOOGLE_DESKTOP_CLIENT_SECRET != '' }}
        SAARTHI_SCHOOL_CLOUD_URL: ${{ vars.SAARTHI_SCHOOL_CLOUD_URL || 'https://saarthi-oauth-staging.onrender.com/school-cloud' }}
      run: |
        if ($env:SAARTHI_GOOGLE_DESKTOP_CLIENT_ID -notmatch '^[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$') { throw 'Valid repository Desktop OAuth Client ID is required for this preview.' }
        Write-Host 'Public OAuth Client ID configured; compiling verification test with the build definition.'
        Write-Host "OAuth secret present in GitHub: $env:OAUTH_SECRET_PRESENT. Secret is never supplied to the client build."
        flutter test test/windows_oauth_build_configuration_test.dart --dart-define=SAARTHI_VERIFY_OAUTH_BUILD=true --dart-define=SAARTHI_SCHOOL_CLOUD_URL=$env:SAARTHI_SCHOOL_CLOUD_URL --dart-define=SAARTHI_GOOGLE_DESKTOP_CLIENT_ID=$env:SAARTHI_GOOGLE_DESKTOP_CLIENT_ID --dart-define=SAARTHI_GOOGLE_OAUTH_BROKER_URL=$env:SAARTHI_GOOGLE_OAUTH_BROKER_URL --dart-define=SAARTHI_GOOGLE_REQUIRES_BROKER=$env:SAARTHI_GOOGLE_REQUIRES_BROKER
        if ($LASTEXITCODE -ne 0) { throw 'Compiled OAuth configuration verification failed.' }
        if ($env:SAARTHI_GOOGLE_REQUIRES_BROKER -eq 'true' -and !$env:SAARTHI_GOOGLE_OAUTH_BROKER_URL) { Write-Host 'Live school connection blocked until the secure OAuth broker is hosted and its URL is configured.' }
    - name: Format Windows reference document source
      run: dart format lib/windows_reference_documents.dart test/windows_reference_documents_test.dart lib/windows_managed_school_gate.dart lib/windows_connect/managed_school_session.dart lib/managed_developer_panel.dart lib/platform/managed_developer_service.dart
    - name: Verify Windows ID cards, licence date and startup
      run: flutter test test/windows_student_id_cards_test.dart test/windows_banner_date_test.dart test/windows_startup_test.dart test/windows_managed_school_gate_test.dart test/windows_save_pdf_test.dart test/windows_script_storage_test.dart test/windows_school_profile_restore_test.dart test/windows_school_map_test.dart test/windows_reference_documents_test.dart
    - name: Verify reference PDF contents and continuation pages
      run: |
        python -m pip install "pypdf>=6,<7"
        python .github/scripts/check_reference_document_previews.py
    - name: Analyze Windows ID card changes
      run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/windows_student_id_cards.dart lib/windows_document_templates.dart lib/windows_license_gate.dart lib/main_dashboard_screen_windows.dart lib/windows_school_map.dart lib/windows_school_map_dialog.dart lib/windows_managed_school_gate.dart lib/windows_connect/managed_school_session.dart lib/windows_reference_documents.dart
    - uses: actions/upload-artifact@v4
      with:
        name: windows-id-card-previews
        path: |
          build/windows-id-previews
          build/reference-document-previews
          lib/windows_reference_documents.dart
          test/windows_reference_documents_test.dart
    - name: Compile Windows school app
      env:
        SAARTHI_GOOGLE_OAUTH_BROKER_URL: ${{ vars.SAARTHI_GOOGLE_OAUTH_BROKER_URL || 'https://saarthi-oauth-staging.onrender.com/oauth/token' }}
        SAARTHI_GOOGLE_REQUIRES_BROKER: ${{ needs.backend.outputs.requires_secret }}
        SAARTHI_GOOGLE_DESKTOP_CLIENT_ID: ${{ inputs.google_oauth_client_id || vars.SAARTHI_GOOGLE_DESKTOP_CLIENT_ID }}
        SAARTHI_SCHOOL_CLOUD_URL: ${{ vars.SAARTHI_SCHOOL_CLOUD_URL || 'https://saarthi-oauth-staging.onrender.com/school-cloud' }}
      run: flutter build windows --release -t lib/main_windows.dart --build-name=2.1.91 --build-number=91 --dart-define=APP_VERSION=2.1.91-review --dart-define=SAARTHI_MANAGED_ACCOUNTS=true --dart-define=SAARTHI_SCHOOL_CLOUD_URL=$env:SAARTHI_SCHOOL_CLOUD_URL --dart-define=SAARTHI_GOOGLE_DESKTOP_CLIENT_ID=$env:SAARTHI_GOOGLE_DESKTOP_CLIENT_ID --dart-define=SAARTHI_GOOGLE_OAUTH_BROKER_URL=$env:SAARTHI_GOOGLE_OAUTH_BROKER_URL --dart-define=SAARTHI_GOOGLE_REQUIRES_BROKER=$env:SAARTHI_GOOGLE_REQUIRES_BROKER
    - uses: actions/upload-artifact@v4
      with:
        name: windows-review-build
        path: build/windows/x64/runner/Release
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - run: flutter create --platforms=android --project-name saarthi_ai --org com.saarthi .
    - name: Configure public Firebase app and permissions
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        python - <<'PY'
        import os,json,base64,re,pathlib
        raw=os.environ.get('GOOGLE_SERVICES_JSON_BASE64','')
        if not raw: raise SystemExit('Public Firebase Android configuration is missing')
        data=json.loads(base64.b64decode(raw))
        pathlib.Path('android/app/google-services.json').write_text(json.dumps(data))
        package=data['client'][0]['client_info']['android_client_info']['package_name']
        p=pathlib.Path('android/app/build.gradle.kts')
        s=p.read_text()
        s=s.replace('plugins {','plugins {\n    id("com.google.gms.google-services")',1)
        s=re.sub(r'applicationId = "[^"]+"','applicationId = "'+package+'"',s)
        s=re.sub(r'compileSdk = [^\n]+','compileSdk = 36',s)
        p.write_text(s)
        p=pathlib.Path('android/settings.gradle.kts')
        s=p.read_text().replace('plugins {','plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',1)
        p.write_text(s)
        p=pathlib.Path('android/app/src/main/AndroidManifest.xml')
        s=p.read_text()
        for permission in ['INTERNET','CAMERA','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','POST_NOTIFICATIONS','REQUEST_INSTALL_PACKAGES']:
          s=s.replace('<application','<uses-permission android:name="android.permission.'+permission+'" />\n    <application',1)
        p.write_text(s)
        PY
    - name: Configure notification desugaring
      run: python .github/scripts/configure_android_notifications.py
    - name: Configure school-owned Firebase messaging
      run: |
        python .github/scripts/test_school_messaging.py
        python .github/scripts/configure_school_messaging.py
    - name: Use dedicated Android dependencies
      run: |
        python - <<'PY'
        import re
        p='pubspec.yaml'
        s=open(p).read()
        for name in ['agora_rtc_engine','flutter_contacts','google_sign_in','googleapis','google_generative_ai','image_picker','permission_handler','firebase_auth','cloud_firestore','font_awesome_flutter']:
          s=re.sub(r'^  '+name+r':[^\n]*\n','',s,flags=re.M)
        open(p,'w').write(s)
        PY
    - run: flutter pub add mobile_scanner:7.3.0
    - name: Align resolved Android plugin SDKs
      run: python .github/scripts/configure_android_plugins.py
    - name: Analyze universal mobile app
      run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main_android.dart lib/mobile/school_session.dart lib/mobile/school_notifications.dart lib/mobile/school_messaging.dart lib/platform/github_updates.dart
    - name: Build unsigned Android preview
      run: flutter build apk --debug -t lib/main_android.dart --dart-define=APP_VERSION=review --dart-define=APP_BUILD=0
    - uses: actions/upload-artifact@v4
      with:
        name: android-review-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
'on':
  push:
    branches:
    - feature/managed-school-accounts
    - fix/existing-school-restore-20261005
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      google_oauth_client_id:
        description: 'Optional public Desktop OAuth client ID for a school test preview'
        required: false
        type: string
