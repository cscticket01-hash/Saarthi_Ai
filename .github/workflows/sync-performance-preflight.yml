name: Safe sync real TEST prerequisites
on:
  push:
    branches: [perf/verified-sheet-lookups-20261029]
    paths: ['lib/**', 'functions/**', 'school-backend/**', '.github/workflows/sync-performance-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync3-verified-test-school-mutations
  cancel-in-progress: false
jobs:
  installed-test-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only installed TEST identity, access and storage compatibility
        env:
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/test_cloud_readiness.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-test-runtime-prerequisites
          path: build/cloud-prerequisites
          retention-days: 14
  real-candidate-person-card:
    if: github.ref == 'refs/heads/perf/verified-sheet-lookups-20261029'
    needs: installed-test-runtime
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf
      - run: flutter pub get
      - name: Pin the observed installed TEST runtime without changing it
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const response=await fetch('https://saarthi-sync-v2-test.onrender.com/school-cloud/healthz',{signal:AbortSignal.timeout(90000)});
          const health=await response.json();
          if(!response.ok||health.ready!==true||health.projectId!=='saarthi-ai-df12b'||!/^[a-f0-9]{40}$/.test(health.runtimeCommit||''))throw Error('Installed TEST runtime is unverified');
          fs.appendFileSync(process.env.GITHUB_ENV,'VS_EXPECTED_TEST_RUNTIME='+health.runtimeCommit+'\n');
          JS
      - name: Measure one synthetic teacher and one student with actual PDFs and permanent TEST Drive proof
        env:
          APPDATA: ${{ runner.temp }}/safe-performance-real-client
          VS_PERSON_CARD_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
          VS_PERSON_CARD_MODE: after
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: flutter test .github/tests/person_card_live_test.dart --concurrency=1 --dart-define=SAARTHI_WINDOWS_SQLITE=true --dart-define=SAARTHI_MANAGED_ACCOUNTS=true --dart-define=SAARTHI_SCHOOL_CLOUD_URL=https://saarthi-sync-v2-test.onrender.com/school-cloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-client-installed-test-person-card
          path: build/cloud-prerequisites/person-card-after.json
          retention-days: 14
