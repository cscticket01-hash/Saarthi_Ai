name: Release trust review
on:
  pull_request:
    paths:
      - '.github/scripts/*release*'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/release-trust-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/scripts -p test_verify_android_release.py -v
  windows-signing-guard:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse signer and verify missing credentials block release
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.github/scripts/sign_windows_release.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          try {
            & .github/scripts/sign_windows_release.ps1 -Path .
            throw 'Guard failed: unsigned release allowed.'
          } catch {
            if ($_.Exception.Message -notlike 'Trusted Windows signing credentials missing.*') { throw }
          }
      - name: Verify free-build and strict signing readiness decisions
        shell: powershell
        run: |
          python -m pip install pyyaml
          if ($LASTEXITCODE -ne 0) { throw 'YAML parser setup failed.' }
          python -c "import pathlib,yaml; w=yaml.safe_load(pathlib.Path('.github/workflows/build-windows.yml').read_text()); s=next(s for s in w['jobs']['build-windows']['steps'] if s.get('id')=='publisher_signing'); pathlib.Path('publisher-readiness-test.ps1').write_text(s['run'])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract actual release readiness step.' }
          $env:GITHUB_STEP_SUMMARY = Join-Path $env:RUNNER_TEMP 'readiness-test-summary.txt'
          $cases = @(
            @{ values=@('', '', ''); strict=''; pass=$true; result='available=false' },
            @{ values=@('', '', ''); strict='true'; pass=$false; result='' },
            @{ values=@('test-only', '', ''); strict=''; pass=$false; result='' },
            @{ values=@('test-only', 'test-only', 'test-only'); strict='true'; pass=$true; result='available=true' }
          )
          foreach ($case in $cases) {
            $env:WINDOWS_SIGNING_PFX_BASE64, $env:WINDOWS_SIGNING_PASSWORD, $env:WINDOWS_SIGNING_THUMBPRINT = $case.values
            $env:REQUIRE_SIGNING = $case.strict
            $env:GITHUB_OUTPUT = Join-Path $env:RUNNER_TEMP ('readiness-' + [guid]::NewGuid() + '.txt')
            & powershell.exe -NoProfile -NonInteractive -File publisher-readiness-test.ps1
            if (($LASTEXITCODE -eq 0) -ne $case.pass) { throw 'Unexpected signing readiness decision.' }
            if ($case.pass -and !(Get-Content $env:GITHUB_OUTPUT | Where-Object { $_ -eq $case.result })) { throw 'Incorrect available output.' }
          }
          exit 0
