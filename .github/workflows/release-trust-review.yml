name: Release trust review
on:
  pull_request:
    paths:
      - '.github/scripts/*release*'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/release-trust-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/scripts -p test_verify_android_release.py -v
  windows-signing-guard:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse signer and verify missing credentials block release
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.github/scripts/sign_windows_release.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          try {
            & .github/scripts/sign_windows_release.ps1 -Path .
            throw 'Guard failed: unsigned release allowed.'
          } catch {
            if ($_.Exception.Message -notlike 'Trusted Windows signing credentials missing.*') { throw }
          }
