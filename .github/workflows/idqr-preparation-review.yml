name: ID QR isolated preparation review

on:
  push:
    branches:
      - feature/idqr-acceptance-preparation
    paths:
      - tool/idqr_acceptance/**
      - docs/idqr-final-output-acceptance-preparation.md
      - .github/workflows/idqr-preparation-review.yml

permissions:
  contents: read

concurrency:
  group: idqr-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-final-pdf-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PDF and decoder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zbar-tools
          python -m pip install PyMuPDF==1.26.5 reportlab==4.4.4
      - name: Test fail-closed verifier contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tool/idqr_acceptance -p 'test_*.py' -v
      - name: Decode actual synthetic final PDF QR at three resolutions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tool/idqr_acceptance/smoke_real_decoder.py
