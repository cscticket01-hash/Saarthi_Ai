name: Cloudflare school sync review
on:
  pull_request:
    paths:
      - 'cloudflare-sync/**'
      - 'functions/cloudflare-sync.js'
      - 'functions/cloudflare-delivery.js'
      - 'functions/live-sync.js'
      - 'functions/live-sync-canonical.js'
      - 'lib/live_sync_protocol.dart'
      - 'lib/windows_live_sync_store.dart'
      - 'test/windows_live_sync_store_test.dart'
      - 'test/live_sync_receipt_test.dart'
      - 'test/windows_sheet_recovery_test.dart'
      - 'lib/windows_sheet_recovery.dart'
      - 'lib/windows_connect/central_school_cloud.dart'
      - 'functions/live-sync-gateway.js'
      - 'functions/live-sync-migration.js'
      - '.github/tests/live_sync_protocol.dart'
      - 'test/central_school_cloud_test.dart'
      - 'test/windows_sync_intelligent_repair_test.dart'
      - 'lib/windows_backend_bridge.dart'
      - 'lib/windows_connect/easy_connect_screen.dart'
      - 'functions/provider-pressure.js'
      - 'functions/provider-pressure-journal.js'
      - 'functions/test/provider-pressure-journal.test.js'
      - 'lib/cloud_transfer_status.dart'
      - 'lib/sync_pending_diagnostics.dart'
      - 'lib/windows_firebase_sync.dart'
      - '.github/tests/sync3_diagnostics_adaptive.dart'
      - '.github/tests/sync3_pressure_policy.dart'
      - 'functions/attendance-queue.js'
      - 'functions/test/provider-pressure.test.js'
      - 'lib/sync_recovery_policy.dart'
      - 'lib/school_backend_transport.dart'
      - 'lib/windows_sync_engine.dart'
      - 'lib/windows_person_card_sync.dart'
      - 'lib/windows_school_identity.dart'
      - 'test/windows_person_card_sync_test.dart'
      - 'lib/windows_sync_recovery.dart'
      - 'lib/windows_sync_control_center.dart'
      - 'lib/windows_connect/central_school_cloud.dart'
      - 'staging-school-cloud/server.cjs'
      - 'functions/managed-schools.js'
      - 'lib/mobile/cloudflare_lane.dart'
      - 'lib/mobile/school_session.dart'
      - 'lib/windows_settings_panel.dart'
      - '.github/workflows/cloudflare-sync-review.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-sync-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: cloudflare-sync
      - run: cp .dev.vars.example .dev.vars && npm run types && npm run check && npm run build && npm test
        working-directory: cloudflare-sync
      - run: npm install --ignore-scripts --no-package-lock && npm test
        working-directory: functions
      - name: Verify separate attendance/provider budget scenarios
        run: node --test .github/scripts/sync3_capacity_budget.test.cjs
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart --disable-dart-dev .github/tests/sync3_pressure_policy.dart
      - run: dart --disable-dart-dev .github/tests/sync3_diagnostics_adaptive.dart
      - run: dart --disable-dart-dev .github/tests/live_sync_protocol.dart
      - run: flutter pub get
      - run: flutter test --concurrency=1 test/windows_live_sync_store_test.dart test/live_sync_receipt_test.dart test/windows_sheet_recovery_test.dart
      - name: Verify existing offline duplicate self-repair on independent SQLite devices
        env:
          APPDATA: ${{ runner.temp }}/live-duplicate-recovery
        run: flutter test --dart-define=SAARTHI_WINDOWS_SQLITE=true --concurrency=1 --timeout 120s --plain-name 'offline identical entry adopts cloud original' test/windows_multi_pc_sync_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/mobile/cloudflare_lane.dart lib/mobile/school_session.dart lib/windows_settings_panel.dart lib/windows_sync_control_center.dart lib/windows_sync_engine.dart lib/sync_recovery_policy.dart lib/school_backend_transport.dart lib/windows_sync_recovery.dart lib/windows_connect/central_school_cloud.dart lib/windows_person_card_sync.dart lib/windows_school_identity.dart
      - env:
          APPDATA: ${{ runner.temp }}/cloudflare-apps
        run: flutter test --concurrency=1 --timeout 90s test/windows_person_card_sync_test.dart test/windows_sync_comparison_test.dart test/central_school_cloud_test.dart test/windows_sync_intelligent_repair_test.dart test/windows_local_first_save_test.dart test/windows_school_profile_restore_test.dart test/cloudflare_lane_test.dart test/mobile_attendance_outbox_test.dart test/mobile_attendance_permit_cache_test.dart test/mobile_attendance_history_test.dart test/windows_theme_presets_test.dart test/sync_recovery_policy_test.dart test/windows_sync_control_cleanup_test.dart
