name: PR 354 isolated Windows regression validation
on:
  push:
    branches: [test/windows-smartscan-staff-pr354-20261121]
    paths:
      - '.github/workflows/pr354-isolated-windows-validation.yml'
permissions:
  contents: read
concurrency:
  group: pr354-isolated-windows-validation
  cancel-in-progress: true
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8a5178a8b285d2aafab11275a13c7cd9aacd57c
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed code and staff payroll integration
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/document_processing_engine.dart lib/document_pipeline.dart lib/document_upload_dialog.dart lib/windows_other_staff.dart lib/windows_staff_payroll.dart lib/student_inventory_policy.dart lib/main_dashboard_screen_windows.dart test/windows_staff_category_policy_test.dart
      - name: Smart Scan engine and uploads
        if: always()
        run: flutter test --concurrency=1 --timeout=120s test/document_processing_engine_test.dart test/document_image_worker_test.dart test/document_upload_flow_test.dart test/smart_media_compression_test.dart test/school_media_budgets_test.dart
      - name: Staff category and person regressions
        if: always()
        run: flutter test --concurrency=1 --timeout=120s test/windows_staff_category_policy_test.dart test/windows_person_payment_fields_test.dart test/windows_startup_test.dart
      - name: Inventory integration and queue regressions
        if: always()
        env:
          APPDATA: ${{ runner.temp }}/pr354-synthetic-documents
          LOCALAPPDATA: ${{ runner.temp }}/pr354-synthetic-documents
        run: flutter test --concurrency=1 --timeout=120s test/windows_document_screen_test.dart test/windows_document_queue_test.dart test/windows_document_review_owner_test.dart test/student_inventory_policy_test.dart
  native-windows-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8a5178a8b285d2aafab11275a13c7cd9aacd57c
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform in the disposable checkout
        run: flutter create --platforms=windows --no-pub .
      - name: Prepare Windows-only Dependencies
        shell: powershell
        run: |
          $pubspec = Get-Content 'pubspec.yaml' -Raw

          # Windows Admin uses dedicated local shims + REST connection code.
          # Native FlutterFire plugins are NOT used by the Windows source.
          # Remove them only from this temporary GitHub Actions runner copy.
          # Repository pubspec.yaml, Android and Website stay unchanged.
          $removePackages = @(
            'agora_rtc_engine',
            'geolocator',
            'mobile_scanner',
            'firebase_core',
            'firebase_auth',
            'firebase_messaging',
            'flutter_local_notifications',
            'firebase_storage',
            'firebase_analytics',
            'firebase_database',
            'firebase_crashlytics',
            'firebase_app_check',
            'firebase_remote_config',
            'firebase_functions',
            'firebase_performance',
            'cloud_firestore'
          )

          foreach ($package in $removePackages) {
            $pattern = "(?m)^\s*" + [regex]::Escape($package) + ":\s*[^\r\n]+\r?\n"
            $pubspec = [regex]::Replace($pubspec, $pattern, '')
          }

          Set-Content -Path 'pubspec.yaml' -Value $pubspec -Encoding UTF8

          Write-Host '===== WINDOWS CI REMOVED NATIVE FIREBASE/MOBILE PLUGINS ====='
          Select-String -Path 'pubspec.yaml' -Pattern `
            'firebase_|cloud_firestore:|agora_rtc_engine:|mobile_scanner:' `
            -ErrorAction SilentlyContinue

      - name: Verify Windows Source Does Not Import Native FlutterFire
        shell: powershell
        run: |
          $windowsSources = @(
            'lib\main_windows.dart',
            'lib\main_dashboard_screen_windows.dart',
            'lib\windows_settings_panel.dart',
            'lib\windows_firebase_sync.dart',
            'lib\windows_local_firestore.dart',
            'lib\windows_local_auth.dart',
            'lib\windows_backend_bridge.dart',
            'lib\windows_sync_engine.dart',
            'lib\windows_update_manager.dart'
          )

          $bad = @()

          foreach ($file in $windowsSources) {
            if (!(Test-Path $file)) {
              throw "Missing Windows source: $file"
            }

            $matches = Select-String `
              -Path $file `
              -Pattern "package:firebase_|package:cloud_firestore" `
              -ErrorAction SilentlyContinue

            if ($matches) {
              $bad += $matches
            }
          }

          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host $_ }
            throw 'Windows source still imports native FlutterFire. Use Windows local/REST shims instead.'
          }

          Write-Host 'Windows source native FlutterFire imports: NONE'

      - name: Clean Flutter
        shell: powershell
        run: flutter clean

      - name: Get Dependencies
        shell: powershell
        run: |
          flutter pub get

          Write-Host '===== CHECK WINDOWS PLUGIN GRAPH ====='
          $deps = flutter pub deps

          $nativeFirebase = $deps | Select-String `
            'firebase_auth |cloud_firestore |firebase_core |firebase_messaging |firebase_storage '

          if ($nativeFirebase) {
            $nativeFirebase | ForEach-Object { Write-Host $_ }
            throw 'Native FlutterFire dependency still present in Windows CI dependency graph.'
          }

          Write-Host 'Native FlutterFire dependency graph: CLEAN'

      - name: Compile without signing, publishing or deployment
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: flutter build windows --release -t lib/main_windows.dart --dart-define=SAARTHI_WINDOWS_SQLITE=true --dart-define=SAARTHI_MANAGED_ACCOUNTS=true

      - name: Verify native Windows executable
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          if (!(Test-Path $release)) { throw 'Windows Release folder missing' }
          $exe = Get-ChildItem -Path $release -Filter *.exe | Select-Object -First 1
          if (-not $exe -or $exe.Length -le 0) { throw 'Windows EXE missing or empty' }
          Write-Host "Verified native executable: $($exe.Name), $($exe.Length) bytes"
