name: Sync4 Android ID preview without PDF
on:
  pull_request:
    paths:
      - 'lib/main_android.dart'
      - 'lib/mobile/record_id_card.dart'
      - 'test/mobile_record_id_card_test.dart'
      - '.github/workflows/sync4-android-id-without-pdf-review.yml'
permissions:
  contents: read
jobs:
  native-record-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Verify Flutter-only school ID preview, isolation and historical PDF action
        run: flutter test test/mobile_record_id_card_test.dart test/published_id_card_test.dart
      - name: Analyze exact changed Android entrypoint and digital card
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main_android.dart lib/mobile/record_id_card.dart
