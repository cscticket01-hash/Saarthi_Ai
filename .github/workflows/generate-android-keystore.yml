name: Generate Saarthi Android Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-signing-key:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check keystore password secret
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing."
            echo "Create it in: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

      - name: Generate permanent Android release keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore saarthi-release.jks \
            -alias saarthi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Saarthi AI, O=Saarthi AI, C=IN"

      - name: Show SHA fingerprints
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list -v \
            -keystore saarthi-release.jks \
            -alias saarthi \
            -storepass "$KEYSTORE_PASSWORD" \
            > signing-info.txt

          SHA1="$(grep 'SHA1:' signing-info.txt | sed 's/^[[:space:]]*//')"
          SHA256="$(grep 'SHA256:' signing-info.txt | sed 's/^[[:space:]]*//')"

          echo "======================================"
          echo "$SHA1"
          echo "$SHA256"
          echo "======================================"

          {
            echo "## Saarthi Android Signing Certificate"
            echo ""
            echo "- Package name: \`com.example.saarthi_ai\`"
            echo "- Alias: \`saarthi\`"
            echo "- $SHA1"
            echo "- $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt keystore for safe storage
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          openssl enc \
            -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 200000 \
            -in saarthi-release.jks \
            -out saarthi-release.jks.enc \
            -pass env:KEYSTORE_PASSWORD

          rm -f saarthi-release.jks

      - name: Upload encrypted signing-key artifact
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-android-signing-encrypted
          path: |
            saarthi-release.jks.enc
            signing-info.txt
          retention-days: 1
          if-no-files-found: error
