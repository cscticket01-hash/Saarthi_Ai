name: Repair isolated TEST Firebase Admin credential

on:
  workflow_dispatch:
  push:
    branches: [feature/smart-sync-3]
    paths:
      - '.github/workflows/repair-test-firebase-admin-credential.yml'

permissions:
  contents: read

jobs:
  repair-test-render-credential:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate TEST credential and compare isolated Render identity
        env:
          SCHOOL_SERVICE_ACCOUNT_JSON: ${{ secrets.SCHOOL_SERVICE_ACCOUNT_JSON }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          (async () => {
            const raw = process.env.SCHOOL_SERVICE_ACCOUNT_JSON || '';
            if (!raw) throw new Error('SCHOOL_SERVICE_ACCOUNT_JSON secret is unavailable');
            let key;
            try { key = JSON.parse(raw); } catch { throw new Error('TEST service-account JSON is invalid'); }
            const project = 'saarthi-ai-df12b';
            if (key.project_id !== project || key.type !== 'service_account' ||
                !key.client_email?.endsWith('@' + project + '.iam.gserviceaccount.com') ||
                !key.private_key) throw new Error('TEST credential is not scoped to the expected Firebase project');
            const fingerprint = crypto.createHash('sha256').update(key.client_email).digest('hex');
            const healthResponse = await fetch('https://saarthi-sync-v2-test.onrender.com/school-cloud/healthz');
            if (!healthResponse.ok) throw new Error('TEST Render health check failed: HTTP ' + healthResponse.status);
            const health = await healthResponse.json();
            if (health.ready !== true || health.projectId !== project)
              throw new Error('TEST Render health/project identity mismatch; refusing credential update');
            if (health.adminCredentialFingerprint === fingerprint) {
              console.log('TEST Render Firebase Admin identity already matches verified CI credential; no update needed.');
              return;
            }
            const token = process.env.RENDER_API_KEY || process.env.RENDER_API_TOKEN || process.env.RENDER_TOKEN;
            if (!token) {
              console.log('RENDER_API_KEY/RENDER_API_TOKEN/RENDER_TOKEN is not configured; no credential was changed.');
              console.log('Required manual action: set TEST Render SAARTHI_FIREBASE_ADMIN_JSON to the GitHub Actions SCHOOL_SERVICE_ACCOUNT_JSON secret.');
              return;
            }
            const url = 'https://api.render.com/v1/services/srv-db3tgfu7bikc73abm7a0/env-vars/SAARTHI_FIREBASE_ADMIN_JSON';
            const update = await fetch(url, {
              method: 'PUT',
              headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify({ value: raw })
            });
            if (!update.ok) throw new Error('Render TEST environment update failed: HTTP ' + update.status);
            console.log('TEST Render SAARTHI_FIREBASE_ADMIN_JSON updated from the verified project-scoped CI credential. Secret value was not printed.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
