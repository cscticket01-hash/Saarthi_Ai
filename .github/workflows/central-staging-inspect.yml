name: Inspect central staging deployment access
on:
  push:
    branches: [windows/easy-connect-draft]
    paths: [.github/workflows/central-staging-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm --prefix functions install --ignore-scripts
    - name: Check existing developer credentials without exposing them
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        node <<'NODE'
        const {cert} = require('node:module').createRequire(process.cwd()+'/functions/package.json')('firebase-admin/app');
        let stage='credential_presence';
        (async () => {
          if (!process.env.FIREBASE_SERVICE_ACCOUNT) throw new Error('Existing FIREBASE_SERVICE_ACCOUNT secret is unavailable');
          stage='credential_json';
          const key = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          console.log(JSON.stringify({credentialPresent:true,project:key.project_id || null,hasPrivateKey:typeof key.private_key==='string',hasClientEmail:typeof key.client_email==='string'}));
          stage='credential_project';
          if (key.project_id !== 'saarthi-ai-df12b') throw new Error('Existing credential belongs to a different project');
          console.log(JSON.stringify({keyHasPemHeader:key.private_key?.startsWith('-----BEGIN PRIVATE KEY-----'),keyHasNewlines:key.private_key?.includes('\n'),keyHasEscapedNewlines:key.private_key?.includes('\\n')}));
          stage='credential_cert';
          const credential=cert(key);
          stage='google_token';
          const {access_token:token} = await credential.getAccessToken();
          console.log('::add-mask::' + token);
          stage='iam_permission_inspection';
          const response = await fetch('https://cloudresourcemanager.googleapis.com/v1/projects/saarthi-ai-df12b:testIamPermissions', {
            method:'POST', headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({permissions:['iam.serviceAccounts.create','iam.serviceAccountKeys.create','resourcemanager.projects.getIamPolicy','resourcemanager.projects.setIamPolicy','firebaserules.releases.create','firebaserules.rulesets.create','datastore.entities.get']})
          });
          if (!response.ok) throw new Error('Developer permission inspection HTTP '+response.status);
          const result = await response.json();
          console.log(JSON.stringify({project:key.project_id, permissions:result.permissions || []}));
          const rule = await fetch('https://firebaserules.googleapis.com/v1/projects/saarthi-ai-df12b/releases/cloud.firestore',{headers:{Authorization:'Bearer '+token}});
          console.log('Existing Firestore release inspection HTTP '+rule.status);
          if(rule.ok){const release=await rule.json(); const rs=await fetch('https://firebaserules.googleapis.com/v1/'+release.rulesetName,{headers:{Authorization:'Bearer '+token}}); if(rs.ok){const data=await rs.json();require('node:fs').mkdirSync('staging-inspect',{recursive:true});require('node:fs').writeFileSync('staging-inspect/deployed-firestore.rules',data.source.files.map(f=>f.content).join('\n'));console.log('Read-only rule snapshot saved; no data or rules modified');}}
        })().catch(e=>{const code=String(e.code || e.errorInfo?.code || 'unknown');console.error('Staging inspection failed at '+stage+'; code='+(/^[a-z0-9/._-]{1,80}$/i.test(code)?code:'redacted'));const message=String(e.message || '');console.error(JSON.stringify({invalidGrant:/invalid_grant/i.test(message),invalidSignature:/Invalid JWT Signature/i.test(message),disabledAccount:/disabled|deleted/i.test(message),pemFailure:/PEM|parse private key/i.test(message),networkFailure:/ENOTFOUND|ECONNRESET|ETIMEDOUT/i.test(message)}));process.exit(1)});
        NODE
    - uses: actions/upload-artifact@v4
      with:
        name: central-staging-rules-before
        path: staging-inspect
        retention-days: 7
