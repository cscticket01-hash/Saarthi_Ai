name: Developer school credentials and Windows theme preview
on:
  pull_request:
    paths:
      - 'lib/developer_windows_theme.dart'
      - 'lib/managed_developer_panel.dart'
      - 'lib/windows_theme*'
      - 'lib/windows_appearance.dart'
      - 'lib/main_windows.dart'
      - 'lib/windows_connect/managed_school_session.dart'
      - 'functions/windows-theme.js'
      - 'assets/theme_*'
      - 'assets/app_screenshot_*'
      - 'test/windows_theme_presets_test.dart'
      - 'functions/managed-schools.js'
      - '.github/preview/**'
      - '.github/scripts/*windows_theme_preview*'
      - '.github/workflows/developer-appearance-review.yml'
      - 'test/developer_windows_theme_test.dart'
      - 'firebase.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: developer-appearance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter create --platforms=web --project-name=saarthi_ai .
      - run: flutter pub get
      - name: Verify RGB editor, image presets, persistence and App Lock gate
        run: flutter test test/developer_windows_theme_test.dart test/windows_theme_presets_test.dart test/windows_startup_test.dart
      - name: Verify backend preset validation and multi-PC activation barrier
        run: node --test functions/test/windows-theme.test.js
