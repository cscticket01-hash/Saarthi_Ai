name: Developer school credentials and Windows theme preview
on:
  pull_request:
    paths:
      - 'lib/developer_windows_theme.dart'
      - 'lib/developer_portal.dart'
      - '.github/scripts/capture_theme_carousel.cjs'
      - 'lib/managed_developer_panel.dart'
      - 'lib/windows_theme*'
      - 'lib/windows_appearance.dart'
      - 'lib/main_windows.dart'
      - 'lib/windows_connect/managed_school_session.dart'
      - 'functions/windows-theme.js'
      - 'assets/theme_*'
      - 'assets/app_screenshot_*'
      - 'test/windows_theme_presets_test.dart'
      - 'functions/managed-schools.js'
      - '.github/preview/**'
      - '.github/scripts/*windows_theme_preview*'
      - '.github/workflows/developer-appearance-review.yml'
      - 'test/developer_windows_theme_test.dart'
      - 'firebase.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: developer-appearance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter create --platforms=web --project-name=saarthi_ai .
      - run: flutter pub get
      - name: Build isolated native-widget screenshot source
        if: ${{ hashFiles('assets/theme_preview_*.webp') == '' }}
        run: python3 .github/scripts/build_windows_theme_preview.py
      - name: Install local screenshot verifier
        if: ${{ hashFiles('assets/theme_preview_*.webp') == '' }}
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          python -m pip install pillow
      - name: Capture four actual app screenshots for every preset
        if: ${{ hashFiles('assets/theme_preview_*.webp') == '' }}
        run: |
          node .github/scripts/capture_theme_carousel.cjs
          python - <<'PYTHON'
          from pathlib import Path
          from PIL import Image
          for p in Path('assets').glob('theme_preview_*.png'):
              Image.open(p).save(p.with_suffix('.webp'),quality=90)
              p.unlink()
          PYTHON
      - name: Verify compact layout, explicit Save and screenshot arrows
        run: flutter test test/developer_windows_theme_test.dart test/windows_theme_presets_test.dart test/windows_startup_test.dart
      - name: Verify authenticated per-PC theme unlock
        run: node --test functions/test/windows-theme.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-theme-carousel-review
          path: |
            assets/theme_preview_*.webp
            build/theme-layout-review
            build/theme-carousel-report.json
