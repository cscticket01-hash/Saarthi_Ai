name: Isolated TEST cloud prerequisites
on:
  workflow_dispatch:
  push:
    branches: [windows/easy-connect-draft, feature/smart-sync-3]
    paths:
      - '.github/scripts/safe_test_read_retry.cjs'
      - '.github/scripts/safe_test_read_retry.test.cjs'
      - '.github/scripts/native_person_receipt.test.cjs'
      - '.github/scripts/retained_delete_fixture.test.cjs'
      - .github/scripts/test_cloud_readiness.cjs
      - .github/scripts/reviewed_script_version.cjs
      - .github/scripts/reviewed_script_version.test.cjs
      - .github/scripts/review_response_match.cjs
      - .github/scripts/review_response_match.test.cjs
      - .github/scripts/review_response_body.cjs
      - .github/scripts/review_response_body.test.cjs
      - .github/scripts/review_fetch_evidence.cjs
      - .github/scripts/review_fetch_evidence.test.cjs
      - .github/scripts/connect_isolated_test_storage.cjs
      - .github/scripts/test_runtime_identity.cjs
      - .github/scripts/settle_test_delta.cjs
      - .github/scripts/settle_test_delta.test.cjs
      - .github/scripts/isolated_live_sync.cjs
      - .github/scripts/sync3_production_r2_standby.test.cjs
      - .github/scripts/build_managed_script.py
      - school-backend/managed/SaarthiManagedAll.gs
      # Disaster evidence logic changes require a fresh exact-head prerequisite.
      - .github/scripts/test_disaster_live.cjs
      - .github/scripts/disaster_resume.cjs
      - .github/scripts/await_test_gate.test.cjs
      - .github/scripts/await_test_gate.cjs
      - .github/scripts/disaster_fixture_resume.test.cjs
      - .github/scripts/disaster_fixture_resume.cjs
      - .github/scripts/disaster_resume.test.cjs
      - staging-school-cloud/**
      - functions/**
      - .github/scripts/run_android_live_test.sh
      - .github/scripts/test_run_android_live_test.py
      - .github/tests/isolated_engine_live_test.dart
      - .github/tests/native_android_windows_readback_test.dart
      - integration_test/sync_v2_android_live_test.dart
      - lib/testing/isolated_admin_fixture.dart
      - .github/tests/isolated_admin_fixture_test.dart
      - lib/school_qr_link.dart
      - .github/workflows/test-cloud-prerequisites.yml
      - .github/workflows/delete-everywhere-live-acceptance.yml
      - .github/scripts/delete_everywhere_live_acceptance.cjs
      - .github/scripts/delete_plan_progress.cjs
      - .github/scripts/delete_plan_progress.test.cjs
      - .github/scripts/native_person_receipt.cjs
      - .github/scripts/retained_delete_fixture.cjs
      - .github/scripts/resume_retained_delete_acceptance.cjs
      - .github/workflows/disaster-test.yml
      - .github/workflows/sync3-isolated-readiness.yml
      - school-backend/managed/**
      - lib/mobile/school_session.dart
      - lib/mobile/attendance_store.dart
      - lib/mobile/attendance_confirmation_schedule.dart
      - lib/mobile/school_request_deadlines.dart
      - lib/windows_connect/managed_record_media.dart
      - lib/cloudflare_record_handoff.dart
      - lib/windows_backend_bridge.dart
      - cloudflare-sync/src/spool.ts
      - cloudflare-sync/test/photo-record-finalization.test.mjs
      - test/managed_photo_record_stage_test.dart
      - test/cloudflare_record_handoff_test.dart
      - lib/windows_school_image_cache.dart
      - lib/windows_binary_downloads.dart
      - test/windows_binary_downloads_test.dart
      - lib/document_processing_engine.dart
      - lib/windows_connect/managed_school_session.dart
      - lib/windows_connect/central_school_cloud.dart
      - lib/school_timestamp.dart
      - test/windows_sqlite_storage_test.dart
      - oauth-broker/test/central-staging.test.cjs
      - lib/windows_sync_engine.dart
      - lib/windows_sync_recovery.dart
      - lib/sync_recovery_policy.dart
      - lib/windows_pending_school_sync.dart
      - lib/windows_local_firestore.dart
      - .github/tests/sqlite_benchmark.dart
      - .github/workflows/platform-review.yml
      - lib/storage/**
      - lib/main_sync_review_web.dart
      - lib/sync_review_school_console.dart
      - .github/scripts/test_sync_review_web.cjs
      - pubspec.yaml
permissions:
  contents: read
concurrency:
  # Share the same school-writer gate as hosted/latency acceptance. Concurrent
  # fixtures contend on its Script lock and distort confirmation measurements.
  group: sync3-verified-test-school-mutations
  cancel-in-progress: false
jobs:
  windows-live-prerequisites:
    if: github.ref == 'refs/heads/windows/easy-connect-draft' || github.ref == 'refs/heads/feature/smart-sync-3'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VS_EXPECTED_TEST_RUNTIME: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact TEST business source, runtime identity and Script version
        shell: bash
        run: |
          git diff --exit-code "$VS_EXPECTED_TEST_RUNTIME" HEAD -- functions oauth-broker staging-school-cloud cloudflare-sync school-backend package.json package-lock.json ':(exclude)oauth-broker/test/**'
          node --test .github/scripts/*.test.cjs
          node -e 'require("./.github/scripts/test_runtime_identity.cjs").waitForRuntime(process.env.VS_EXPECTED_TEST_RUNTIME).catch(error=>{console.error(error.message);process.exitCode=1})'
      - name: Pair owner-approved isolated TEST storage and verify signed readback
        env:
          VS_TEST_CONNECT_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_REAL_SYNC: 'true'
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/connect_isolated_test_storage.cjs
      - name: Check real TEST cloud without changing school records
        env:
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/test_cloud_readiness.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-windows-live-cloud-prerequisites
          path: build/cloud-prerequisites
  actual-engines-live:
    needs: windows-live-prerequisites
    if: github.ref == 'refs/heads/windows/easy-connect-draft' || github.ref == 'refs/heads/feature/smart-sync-3'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare the checksum-verified Windows SQLite DLL
        shell: bash
        run: bash .github/scripts/seed_windows_test_sqlite.sh
      - name: Run existing Windows outbox and mobile session classes against real TEST cloud
        env:
          VS_TEST_CONNECT_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: flutter test test/sync_review_notice_id_test.dart .github/tests/isolated_admin_fixture_test.dart .github/tests/isolated_engine_live_test.dart --dart-define=SAARTHI_WINDOWS_SQLITE=true --dart-define=SAARTHI_MANAGED_ACCOUNTS=true --dart-define=SAARTHI_SCHOOL_CLOUD_URL=https://saarthi-sync-v2-test.onrender.com/school-cloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-production-engines-real-cloud
          path: build/cloud-prerequisites/actual-engines.json

  website-ui-live:
    needs: actual-engines-live
    if: github.ref == 'refs/heads/windows/easy-connect-draft' || github.ref == 'refs/heads/feature/smart-sync-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      evidence_run: ${{ steps.website-evidence.outputs.run }}
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: flutter create --platforms=web --project-name saarthi_ai .
    - run: flutter pub get
    - name: Build isolated TEST school website, no production hosting
      run: flutter build web --release --no-web-resources-cdn -t lib/main_sync_review_web.dart --dart-define=SAARTHI_SYNC_REVIEW_WEB=true --dart-define=SAARTHI_SCHOOL_CLOUD_URL=https://saarthi-sync-v2-test.onrender.com/school-cloud
    - run: mv build/web build/sync-review-web
    - run: npm install --no-save playwright@1.58.2
    - run: npx playwright install --with-deps chromium
    - name: Real browser login, Windows notice visibility, website CAS ACK/readback
      env:
        VS_TEST_CONNECT_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
        VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
        VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
      run: node .github/scripts/test_sync_review_web.cjs
    - name: Record the exact Website fixture attempt
      id: website-evidence
      run: printf 'run=%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: isolated-test-website-ui-and-preview-${{ github.run_attempt }}
        path: |
          build/cloud-prerequisites/website-ui.*
          build/sync-review-web
  android-os-live:
    needs: website-ui-live
    if: github.ref == 'refs/heads/windows/easy-connect-draft' || github.ref == 'refs/heads/feature/smart-sync-3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      evidence_run: ${{ steps.android-evidence.outputs.run }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - run: flutter create --platforms=android --project-name saarthi_ai --org com.saarthi .
    - name: Configure public Firebase app and permissions
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        python - <<'PY'
        import os,json,base64,re,pathlib
        raw=os.environ.get('GOOGLE_SERVICES_JSON_BASE64','')
        if not raw: raise SystemExit('Public Firebase Android configuration is missing')
        data=json.loads(base64.b64decode(raw))
        pathlib.Path('android/app/google-services.json').write_text(json.dumps(data))
        package=data['client'][0]['client_info']['android_client_info']['package_name']+'.syncreview'
        data['client'][0]['client_info']['android_client_info']['package_name']=package
        pathlib.Path('android/app/google-services.json').write_text(json.dumps(data))
        p=pathlib.Path('android/app/build.gradle.kts')
        s=p.read_text()
        s=s.replace('plugins {','plugins {\n    id("com.google.gms.google-services")',1)
        s=re.sub(r'applicationId = "[^"]+"','applicationId = "'+package+'"',s)
        s=re.sub(r'compileSdk = [^\n]+','compileSdk = 36',s)
        p.write_text(s)
        p=pathlib.Path('android/settings.gradle.kts')
        s=p.read_text().replace('plugins {','plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',1)
        p.write_text(s)
        p=pathlib.Path('android/app/src/main/AndroidManifest.xml')
        s=p.read_text()
        for permission in ['INTERNET','CAMERA','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','POST_NOTIFICATIONS','REQUEST_INSTALL_PACKAGES']:
          s=s.replace('<application','<uses-permission android:name="android.permission.'+permission+'" />\n    <application',1)
        p.write_text(s)
        PY
    - name: Configure notification desugaring
      run: python .github/scripts/configure_android_notifications.py
    - name: Configure school-owned Firebase messaging
      run: |
        python .github/scripts/test_school_messaging.py