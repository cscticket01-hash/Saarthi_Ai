name: Correct approved Android release source tag
on:
  push:
    branches:
      - windows/easy-connect-draft
    paths:
      - '.github/workflows/repair-android-release-tag.yml'
permissions:
  contents: write
  actions: read
jobs:
  correct-release-source:
    if: contains(github.event.head_commit.message, '[release-metadata-fix]')
    runs-on: ubuntu-latest
    steps:
      - name: Verify and correct source reference without rebuilding APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh api repos/$GH_REPO/git/ref/tags/android-v1.0.487 --jq '.object.sha')
          if [ "$current" != "2998788daec5a1304c1751f889f9f1ca044469fd" ] && [ "$current" != "8b98c7f58c3309faf6f4455c160605d7ba4496f9" ]; then
            echo "::error::Unexpected release tag target; refusing modification."
            exit 1
          fi
          verified=$(gh api repos/$GH_REPO/actions/runs/37323885410 --jq '.head_sha + " " + .conclusion')
          test "$verified" = "8b98c7f58c3309faf6f4455c160605d7ba4496f9 success"
          gh api --method PATCH repos/$GH_REPO/git/refs/tags/android-v1.0.487 -f sha=8b98c7f58c3309faf6f4455c160605d7ba4496f9 -F force=true --jq '.object.sha'
          gh api --method PATCH repos/$GH_REPO/releases/403808258 -f target_commitish=8b98c7f58c3309faf6f4455c160605d7ba4496f9 --jq '.tag_name'
