name: School Admin Password backend review
on:
  pull_request:
    paths:
      - 'functions/school-admin-security.js'
      - 'functions/test/school-admin-security.test.js'
      - 'functions/live-sync-canonical.js'
      - 'firestore.platform.rules'
      - '.github/workflows/school-admin-security-review.yml'
permissions:
  contents: read
concurrency:
  group: school-admin-security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check functions/school-admin-security.js
      - name: Verify credential and durable mutation approval contracts
        run: node --test functions/test/school-admin-security.test.js
