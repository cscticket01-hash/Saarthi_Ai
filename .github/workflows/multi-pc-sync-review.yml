name: Multi-PC sync and measured SQLite propagation
on:
  pull_request:
    branches: [main]
    paths: ['lib/**', 'test/**', 'functions/**', 'school-backend/**', '.github/workflows/multi-pc-sync-review.yml']
permissions:
  contents: read
concurrency:
  group: multi-pc-sync-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  two-pc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze modified sync owners and two-PC harness
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/windows_sync_engine.dart lib/windows_sync_schedule.dart lib/windows_firebase_sync.dart lib/windows_pending_school_sync.dart test/windows_multi_pc_sync_test.dart test/windows_sync_activity_test.dart lib/windows_remote_change_feed.dart test/windows_remote_change_feed_test.dart
      - name: Two-PC correctness, payment ACKs and deletion generations
        env:
          APPDATA: ${{ runner.temp }}/multi-pc-synthetic-scenarios
        run: flutter test --dart-define=SAARTHI_WINDOWS_SQLITE=true --concurrency=1 --timeout 120s --exclude-tags=load test/windows_multi_pc_sync_test.dart
      - name: Measure 1000/5000 queued students across independent SQLite PCs
        env:
          APPDATA: ${{ runner.temp }}/multi-pc-synthetic-load
        run: flutter test --dart-define=SAARTHI_WINDOWS_SQLITE=true --concurrency=1 --timeout 15m --tags=load test/windows_multi_pc_sync_test.dart
      - name: Retained scheduler, ACK and independent queue regressions
        env:
          APPDATA: ${{ runner.temp }}/multi-pc-regressions
        run: flutter test --concurrency=1 --timeout 120s test/windows_sync_activity_test.dart test/windows_sync_durable_admission_test.dart test/windows_sync_revision_test.dart test/windows_student_lifecycle_test.dart test/windows_sheet_recovery_test.dart test/windows_sync_pause_test.dart test/windows_remote_change_feed_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-two-PC-measurements-${{ matrix.os }}
          path: build/multi-pc
