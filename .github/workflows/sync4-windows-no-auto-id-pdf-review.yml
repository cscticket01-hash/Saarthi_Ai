name: Sync4 Windows no automatic ID PDFs
on:
  pull_request:
    paths:
      - 'lib/windows_pdf_generation_policy.dart'
      - 'lib/windows_sync_engine.dart'
      - 'test/windows_pdf_generation_policy_test.dart'
      - '.github/workflows/sync4-windows-no-auto-id-pdf-review.yml'
permissions:
  contents: read
jobs:
  no-automatic-id-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Verify explicit-download-only PDF policy and durable sync behavior
        run: flutter test --concurrency=1 test/windows_pdf_generation_policy_test.dart test/windows_sync_revision_test.dart test/windows_person_card_sync_test.dart
      - name: Analyze Windows PDF policy and sync owner
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/windows_pdf_generation_policy.dart lib/windows_sync_engine.dart
