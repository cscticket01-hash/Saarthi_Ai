name: Deploy Vidya Saarthi to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # FLUTTER
      # =========================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      # =========================================================
      # NODE FOR FIREBASE CLI
      # =========================================================
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # =========================================================
      # CHECK SOURCE ASSETS
      # =========================================================
      - name: Verify Source Assets
        run: |
          echo "===== SOURCE ASSETS FOLDER ====="
          find assets -maxdepth 2 -type f -print | sort

          test -f assets/school_logo.png
          test -f assets/principal_sign.png
          test -f assets/whatsapp.png

      # =========================================================
      # CONFIGURE WEB
      # =========================================================
      - name: Configure Flutter Web
        run: flutter create --platforms=web --no-pub .

      # =========================================================
      # CLEAN + DEPENDENCIES
      # =========================================================
      - name: Clean Flutter
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      # =========================================================
      # BUILD WEB
      # IMPORTANT: Firebase site runs from /
      # =========================================================
      - name: Build Web
        run: |
          flutter build web \
            --release \
            --base-href "/" \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # =========================================================
      # BLOCK COMMON INSPECT / VIEW SOURCE SHORTCUTS
      # =========================================================
      - name: Add Browser Inspect Protection
        run: |
          python3 <<'PY'
          from pathlib import Path

          index_file = Path("build/web/index.html")

          if not index_file.exists():
              raise SystemExit("build/web/index.html not found")

          html = index_file.read_text(encoding="utf-8")

          marker = "<!-- VIDYA_SAARTHI_INSPECT_PROTECTION -->"

          protection = r'''
          <!-- VIDYA_SAARTHI_INSPECT_PROTECTION -->
          <script>
          (() => {
            // Disable right-click context menu.
            document.addEventListener('contextmenu', function(event) {
              event.preventDefault();
            }, true);

            // Disable common browser developer-tool shortcuts.
            document.addEventListener('keydown', function(event) {
              const key = (event.key || '').toLowerCase();

              // F12
              if (event.key === 'F12') {
                event.preventDefault();
                event.stopPropagation();
                return false;
              }

              // Ctrl + Shift + I / J / C / K
              if (
                event.ctrlKey &&
                event.shiftKey &&
                ['i', 'j', 'c', 'k'].includes(key)
              ) {
                event.preventDefault();
                event.stopPropagation();
                return false;
              }

              // Ctrl + U = View Source
              if (event.ctrlKey && key === 'u') {
                event.preventDefault();
                event.stopPropagation();
                return false;
              }

              // Mac equivalents
              if (
                event.metaKey &&
                event.altKey &&
                ['i', 'j', 'c'].includes(key)
              ) {
                event.preventDefault();
                event.stopPropagation();
                return false;
              }

              if (event.metaKey && key === 'u') {
                event.preventDefault();
                event.stopPropagation();
                return false;
              }
            }, true);
          })();
          </script>
          '''

          if marker not in html:
              if "</body>" in html:
                  html = html.replace(
                      "</body>",
                      protection + "\n</body>"
                  )
              else:
                  html += protection

              index_file.write_text(
                  html,
                  encoding="utf-8"
              )

              print("Inspect protection added successfully.")
          else:
              print("Inspect protection already exists.")
          PY

      # =========================================================
      # VERIFY BUILD
      # =========================================================
      - name: Verify Built Assets
        run: |
          test -f build/web/index.html
          test -f build/web/assets/assets/school_logo.png
          test -f build/web/assets/assets/principal_sign.png
          test -f build/web/assets/assets/whatsapp.png

          grep -q "VIDYA_SAARTHI_INSPECT_PROTECTION" build/web/index.html

          echo "===== BUILD READY ====="
          echo "===== INSPECT PROTECTION FOUND ====="

      # =========================================================
      # CREATE FIREBASE SERVICE ACCOUNT FILE
      # =========================================================
      - name: Configure Firebase Credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # =========================================================
      # INSTALL FIREBASE CLI
      # =========================================================
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # =========================================================
      # DEPLOY ONLY VIDYASAARTHI HOSTING SITE
      # =========================================================
      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy \
            --project saarthi-ai-df12b \
            --only hosting:vidyasaarthi
