name: Deploy Vidya Saarthi to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # FLUTTER
      # =========================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      # =========================================================
      # NODE FOR FIREBASE CLI
      # =========================================================
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # =========================================================
      # CHECK SOURCE ASSETS
      # =========================================================
      - name: Verify Source Assets
        run: |
          echo "===== SOURCE ASSETS FOLDER ====="
          find assets -maxdepth 2 -type f -print | sort

          test -f assets/school_logo.png
          test -f assets/principal_sign.png
          test -f assets/whatsapp.png

      # =========================================================
      # CONFIGURE WEB
      # =========================================================
      - name: Configure Flutter Web
        run: flutter create --platforms=web --no-pub .

      # =========================================================
      # CLEAN + DEPENDENCIES
      # =========================================================
      - name: Clean Flutter
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      # =========================================================
      # BUILD WEB
      # IMPORTANT: Firebase site runs from /
      # =========================================================
      - name: Build Web
        run: |
          flutter build web \
            --release \
            --base-href "/" \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # =========================================================
      # VERIFY BUILD
      # =========================================================
      - name: Verify Built Assets
        run: |
          test -f build/web/index.html
          test -f build/web/assets/assets/school_logo.png
          test -f build/web/assets/assets/principal_sign.png
          test -f build/web/assets/assets/whatsapp.png

          echo "===== BUILD READY ====="

      # =========================================================
      # CREATE FIREBASE SERVICE ACCOUNT FILE
      # =========================================================
      - name: Configure Firebase Credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # =========================================================
      # INSTALL FIREBASE CLI
      # =========================================================
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # =========================================================
      # DEPLOY ONLY VIDYASAARTHI HOSTING SITE
      # =========================================================
      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy \
            --project saarthi-ai-df12b \
            --only hosting:vidyasaarthi
