name: Deploy Saarthi Web Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Verify Source Assets
        run: |
          echo "===== ASSETS FOLDER ====="
          ls -lah assets || true

          echo "===== SCHOOL LOGO ====="
          test -f assets/school_logo.png
          ls -lh assets/school_logo.png

          echo "===== PRINCIPAL SIGNATURE ====="
          test -f assets/principal_sign.png
          ls -lh assets/principal_sign.png

          echo "===== PUBSPEC ASSET SECTION ====="
          grep -A10 "^flutter:" pubspec.yaml || true

      - name: Configure Flutter Web
        run: flutter create --platforms=web .

      - name: Clean Flutter
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web \
            --release \
            --base-href "/Saarthi_Ai/" \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Verify Built Assets
        run: |
          echo "===== BUILD ASSETS ====="
          find build/web/assets -type f | sort

          echo "===== CHECK SCHOOL LOGO ====="
          test -f build/web/assets/assets/school_logo.png
          ls -lh build/web/assets/assets/school_logo.png

          echo "===== CHECK PRINCIPAL SIGNATURE ====="
          test -f build/web/assets/assets/principal_sign.png
          ls -lh build/web/assets/assets/principal_sign.png

          echo "===== CHECK WHATSAPP ====="
          test -f build/web/assets/assets/whatsapp.png
          ls -lh build/web/assets/assets/whatsapp.png

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
