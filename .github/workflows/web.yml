name: Deploy Saarthi Web Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Configure Flutter Web
        run: flutter create --platforms=web .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web \
            --release \
            --base-href "/Saarthi_Ai/" \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Check WhatsApp Asset
        run: |
          echo "Checking whatsapp.png..."
          find build/web -type f | grep -i "whatsapp" || true

      - name: Show Build Assets
        run: |
          echo "Flutter build assets:"
          find build/web/assets -maxdepth 3 -type f | head -100

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
