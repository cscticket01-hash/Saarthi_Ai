name: Isolated TEST exact original Cloudflare receipt reconciliation
on:
  push:
    branches: [test/original-edge-proof-audit-20261114]
    paths:
      - '.github/workflows/test-exact-original-edge-reconciliation.yml'
      - '.github/scripts/test_exact_original_edge_reconciliation.cjs'
permissions:
  contents: read
concurrency:
  group: sync3-verified-test-school-mutations
  cancel-in-progress: false
env:
  VS_EXPECTED_TEST_RUNTIME: fe53cd5a8f68f930774a7e92520e9525ca15c9f4
jobs:
  original-proofs:
    if: github.repository == 'cscticket01-hash/Saarthi_Ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backend sources EXACTLY match deployed isolated TEST broker
        run: |
          git diff --exit-code "$VS_EXPECTED_TEST_RUNTIME" HEAD -- functions oauth-broker staging-school-cloud cloudflare-sync school-backend package.json package-lock.json
          node --check .github/scripts/test_exact_original_edge_reconciliation.cjs
      - name: Reconcile only authenticated exact original operation receipts
        env:
          VS_TEST_CONNECT_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/test_exact_original_edge_reconciliation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-exact-original-edge-reconciliation
          path: build/cloud-prerequisites/edge-original-reconciliation.json
