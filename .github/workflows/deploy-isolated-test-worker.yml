name: Deploy isolated TEST Cloudflare Worker
on:
  push:
    branches: [feature/smart-sync-3]
    paths:
      - '.github/workflows/deploy-isolated-test-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler and verify TEST Worker source
        working-directory: cloudflare-sync
        run: |
          npm install --ignore-scripts --no-package-lock
          cp .dev.vars.example .dev.vars
          npm run types
          npm run check
          npm run build
          npm test
      - name: Validate exact isolated TEST Worker deployment target
        working-directory: cloudflare-sync
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.test.jsonc')); if(c.name!=='vidya-saarthi-sync-test'||c.vars?.BROKER_URL!=='https://saarthi-sync-v2-test.onrender.com/school-cloud'||c.r2_buckets?.[0]?.bucket_name!=='saarthi-sync-r2-test') process.exit(1)"
      - name: Check Cloudflare CI credentials without revealing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::TEST Worker deployment needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi
      - name: Deploy only vidya-saarthi-sync-test and preserve dashboard vars
        working-directory: cloudflare-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.test.jsonc --keep-vars
