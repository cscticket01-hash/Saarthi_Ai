name: Sheet lifecycle live broker review
on:
  pull_request:
    branches: [windows/easy-connect-draft]
    paths: ['functions/**', '.github/workflows/sheet-lifecycle-broker-review.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
        working-directory: functions
      - run: npm test
        working-directory: functions
