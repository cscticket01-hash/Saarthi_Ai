name: WIN-005-007 consolidated unpublished review
on:
  push:
    branches: [review/win005-007-universal-uid-20261122]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'cloudflare-sync/**'
      - 'functions/**'
      - 'school-backend/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/windows-universal-uid-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-universal-uid-review
  cancel-in-progress: true
jobs:
  uid-registry:
    if: github.ref == 'refs/heads/review/win005-007-universal-uid-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify permanent UID registry with real SQLite
        working-directory: cloudflare-sync
        run: node --test test/universal-uid.test.mjs
      - name: Type-check Cloudflare source without deployment
        working-directory: cloudflare-sync
        run: |
          npm ci
          npm run types
          npm run check
      - name: Run isolated Cloudflare Worker regressions
        working-directory: cloudflare-sync
        run: |
          npm run build
          npm test
      - name: Run backend lifecycle, migration, reconciliation and QR regressions
        working-directory: functions
        run: >-
          node --test
          test/live-person-lifecycle.test.js
          test/live-sync-migration.test.js
          test/live-sync-reconciliation.test.js
          test/managed-card-issue-authority.test.js
          test/teacher-staff-retirement.test.js
  windows-regressions:
    if: github.ref == 'refs/heads/review/win005-007-universal-uid-20261122'
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed Windows source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/windows_person_fields.dart lib/main_dashboard_screen_windows.dart lib/id_card_native_preview.dart lib/windows_id_card_designer_entry.dart lib/id_card_designer_screen.dart
      - name: Consolidated teacher, payroll, student and ID-card regression suite
        env:
          APPDATA: ${{ runner.temp }}/win005-007-appdata
          LOCALAPPDATA: ${{ runner.temp }}/win005-007-localappdata
        run: >-
          flutter test --concurrency=1
          test/windows_teacher_validation_test.dart
          test/windows_person_payment_fields_test.dart
          test/windows_operations_test.dart
          test/windows_id_card_preview_test.dart
          test/student_inventory_policy_test.dart
          test/windows_staff_category_policy_test.dart
          test/id_card_native_preview_test.dart
          test/windows_student_id_cards_test.dart
          test/id_card_engine_test.dart
          test/id_card_layout_test.dart
          test/windows_fee_collection_flow_test.dart
          test/windows_atomic_exam_local_save_test.dart
          test/document_processing_engine_test.dart
          test/qr_card_authorization_test.dart
          test/school_qr_login_test.dart
      - name: Prepare the Windows runner
        shell: bash
        run: |
          flutter create --platforms=windows --project-name saarthi_ai .
          python .github/scripts/configure_windows_single_instance.py
          python - <<'PYTHON'
          import re
          from pathlib import Path
          pubspec = Path('pubspec.yaml')
          source = pubspec.read_text()
          for name in ('firebase_core', 'firebase_auth', 'firebase_messaging',
                       'flutter_local_notifications', 'cloud_firestore',
                       'agora_rtc_engine', 'mobile_scanner', 'geolocator'):
              source = re.sub(r'^  ' + name + r':[^\n]*\n', '', source, flags=re.M)
          pubspec.write_text(source)
          PYTHON
          flutter pub get
      - name: Compile the Windows application
        run: >-
          flutter build windows --release -t lib/main_windows.dart
          --dart-define=SAARTHI_WINDOWS_SQLITE=true
          --dart-define=SAARTHI_MANAGED_ACCOUNTS=true
  android-web-regressions:
    if: github.ref == 'refs/heads/review/win005-007-universal-uid-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Exercise Android and Web compatibility
        run: >-
          flutter test --concurrency=1
          test/android_startup_test.dart
          test/mobile_attendance_history_test.dart
          test/mobile_attendance_outbox_test.dart
          test/published_id_card_test.dart
          test/web_atomic_bundle_review_test.dart
      - name: Compile the Web application
        run: |
          flutter create --platforms=web --project-name saarthi_ai .
          flutter build web --release
      - name: Compile the Android application
        run: |
          flutter create --platforms=android --project-name saarthi_ai --org com.saarthi .
          flutter build apk --debug -t lib/main_android.dart
