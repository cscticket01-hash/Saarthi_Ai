name: Sync4 record-only fee and exam saves
on:
  pull_request:
    paths:
      - 'lib/main_dashboard_screen_windows.dart'
      - 'lib/windows_backend_bridge.dart'
      - 'lib/windows_exam_service.dart'
      - 'lib/windows_fee_receipt_preview.dart'
      - 'school-backend/SaarthiSchool.gs'
      - 'school-backend/managed/SaarthiManagedAll.gs'
      - '.github/scripts/test_record_only_gs.cjs'
      - 'test/windows_fee_collection_flow_test.dart'
      - '.github/workflows/sync4-record-only-fee-exam-review.yml'
permissions:
  contents: read
jobs:
  script-record-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No PDF or Drive upload during fee and exam Save
        run: node .github/scripts/test_record_only_gs.cjs
  windows-record-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Fee atomic record-only and retained historical-PDF regressions
        run: flutter test --concurrency=1 test/windows_fee_collection_flow_test.dart --dart-define=SAARTHI_WINDOWS_SQLITE=true
      - name: Fee/exam document compile check
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/windows_backend_bridge.dart lib/windows_fee_receipt_preview.dart lib/windows_exam_service.dart
