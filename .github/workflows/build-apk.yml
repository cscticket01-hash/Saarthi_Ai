              new_handler = '''void _handleLoginBack(bool didPop) {
            if (didPop) return;

            final now = DateTime.now();
            final previous = _lastRapidBackAt;

            if (previous == null ||
                now.difference(previous).inMilliseconds > 650) {
              _loginBackPressCount = 0;
            }

            _lastRapidBackAt = now;
            _loginBackPressCount++;

            if (_loginBackPressCount >= 3) {
              _loginBackPressCount = 0;
              _loginBackResetToken++;
              _lastRapidBackAt = null;

              ScaffoldMessenger.of(context).hideCurrentSnackBar();
              SystemNavigator.pop();
              return;
            }

            final remaining = 3 - _loginBackPressCount;

            ScaffoldMessenger.of(context)
              ..hideCurrentSnackBar()
              ..showSnackBar(
                SnackBar(
                  duration: const Duration(milliseconds: 430),
                  behavior: SnackBarBehavior.floating,
                  margin: const EdgeInsets.fromLTRB(92, 0, 92, 16),
