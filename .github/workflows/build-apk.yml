                          onPressed: apkUrl.isEmpty || _adminAndroidUpdateDownloading ? null : () => _downloadAdminAndroidUpdate(apkUrl: apkUrl, latestName: latestName),
                          icon: const Icon(Icons.download_rounded, size: 18),
                          label: Text(_adminAndroidUpdateDownloading ? 'DOWNLOADING...' : (mandatory ? 'UPDATE REQUIRED' : 'DOWNLOAD UPDATE'), style: const TextStyle(fontWeight: FontWeight.w800)),
                        )),
                      ],
                    ]),
                  );
                },
              );
            }

          """)
