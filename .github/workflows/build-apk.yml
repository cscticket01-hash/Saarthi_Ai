
    
  
name: Build Vidya Saarthi Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 5. INSTALL ANDROID SDK 36
      # ============================================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ============================================================
      # 6. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show Build Environment
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # ============================================================
      # 7. CONFIGURE ANDROID PROJECT
      # Existing project ko overwrite nahi karega
      # ============================================================
      - name: Configure Android Project
        shell: bash
        run: |
          flutter config --enable-android

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android project missing. Creating..."
            flutter create \
              --platforms=android \
              --android-language=java \
              --no-pub \
              .
          else
            echo "Existing Android project found."
            echo "Existing Android configuration preserve kiya jayega."
          fi

