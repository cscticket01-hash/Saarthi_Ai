            Future<void> _cleanupAdminAndroidUpdateCache({String? keepPath}) async {
              try {
                final tempDir = await getTemporaryDirectory();
                if (!await tempDir.exists()) return;
                await for (final entity in tempDir.list()) {
                  if (entity is! File) continue;
                  final path = entity.path;
                  final name = path.split(Platform.pathSeparator).last;
                  if (!name.startsWith('Vidya-Saarthi-') || !name.endsWith('.apk')) continue;
                  if (keepPath != null && path == keepPath) continue;
                  try { await entity.delete(); } catch (_) {}
                }
              } catch (_) {}
            }

            Future<void> _downloadAdminAndroidUpdate({
              required String apkUrl,
              required String latestName,
            }) async {
              if (_adminAndroidUpdateDownloading) return;
              final uri = Uri.tryParse(apkUrl);
              if (uri == null) return;
              setState(() {
                _adminAndroidUpdateDownloading = true;
                _adminAndroidUpdateProgress = 0.0;
                _adminAndroidUpdateStatus = 'Preparing update...';
              });
              http.Client? client;
              IOSink? sink;
              File? apkFile;
              try {
                await _cleanupAdminAndroidUpdateCache();
                final tempDir = await getTemporaryDirectory();
                final safeVersion = latestName.isEmpty ? 'latest' : latestName.replaceAll(RegExp(r'[^0-9A-Za-z._-]'), '_');
                apkFile = File('${tempDir.path}/Vidya-Saarthi-$safeVersion.apk');
                if (await apkFile.exists()) await apkFile.delete();
                client = http.Client();
                final response = await client.send(http.Request('GET', uri));
                if (response.statusCode < 200 || response.statusCode >= 300) throw Exception('Download HTTP ${response.statusCode}');
                final total = response.contentLength ?? 0;
                var received = 0;
                sink = apkFile.openWrite();
                await for (final chunk in response.stream) {
                  sink.add(chunk);
                  received += chunk.length;
                  if (!mounted) continue;
                  setState(() {
                    _adminAndroidUpdateProgress = total > 0 ? (received / total).clamp(0.0, 1.0) : 0.0;
                    _adminAndroidUpdateStatus = total > 0 ? '${(_adminAndroidUpdateProgress * 100).toStringAsFixed(0)}% downloaded' : 'Downloading update...';
                  });
                }
                await sink.flush();
                await sink.close();
                sink = null;
                if (!mounted) return;
                setState(() {
                  _adminAndroidUpdateProgress = 1.0;
                  _adminAndroidUpdateStatus = 'Download complete. Opening Android installer...';
                });
                await _cleanupAdminAndroidUpdateCache(keepPath: apkFile.path);
                final result = await OpenFilex.open(apkFile.path, type: 'application/vnd.android.package-archive');
                if (!mounted) return;
                if (result.type != ResultType.done) throw Exception(result.message);
                setState(() {
                  _adminAndroidUpdateStatus = 'Installer opened. Android par Update/Install confirm karein.';
                });
              } catch (e) {
                try { await sink?.close(); } catch (_) {}
                try { if (apkFile != null && await apkFile.exists()) await apkFile.delete(); } catch (_) {}
                if (!mounted) return;
                setState(() {
                  _adminAndroidUpdateDownloading = false;
                  _adminAndroidUpdateProgress = 0.0;
                  _adminAndroidUpdateStatus = '';
                });
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(backgroundColor: Colors.redAccent, content: Text('Update download failed: $e')));
              } finally {
                client?.close();
              }
            }

            Widget _buildAndroidAdminUpdateCard() {
              const currentVersionCode = int.fromEnvironment('APP_VERSION_CODE', defaultValue: 1);
              const currentVersionName = String.fromEnvironment('APP_VERSION_NAME', defaultValue: '1.0.0');
              return StreamBuilder<DocumentSnapshot<Map<String, dynamic>>>(
                stream: FirebaseFirestore.instance.collection('app_config').doc('android_update').snapshots(),
                builder: (context, snapshot) {
                  final data = snapshot.data?.data() ?? <String, dynamic>{};
                  final latestCode = (data['versionCode'] as num?)?.toInt() ?? 0;
                  final latestName = data['versionName']?.toString().trim() ?? '';
                  final apkUrl = data['apkUrl']?.toString().trim() ?? '';
                  final mandatory = data['mandatory'] == true;
                  final updateAvailable = latestCode > currentVersionCode;
                  return Container(
                    width: double.infinity,
                    padding: const EdgeInsets.all(13),
                    decoration: BoxDecoration(
                      color: updateAvailable ? const Color(0xFF15322F) : const Color(0xFF172229),
                      borderRadius: BorderRadius.circular(13),
                      border: Border.all(color: updateAvailable ? const Color(0xFF00A884).withOpacity(0.38) : Colors.white10),
                    ),
                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Row(children: [
                        Icon(updateAvailable ? Icons.system_update_alt_rounded : Icons.verified_rounded, color: const Color(0xFF00D9A5), size: 20),
                        const SizedBox(width: 9),
                        Expanded(child: Text(updateAvailable ? 'Update Available' : 'Vidya Saarthi is up to date', style: const TextStyle(color: Colors.white, fontSize: 12.5, fontWeight: FontWeight.w800))),
                      ]),
                      const SizedBox(height: 6),
                      Text(updateAvailable ? 'Installed $currentVersionName  •  Latest $latestName' : 'Installed version $currentVersionName', style: const TextStyle(color: Colors.white54, fontSize: 10.5)),
                      if (_adminAndroidUpdateDownloading) ...[
