                      r'(?m)^(\s*)compileSdkVersion\s+.*$',
                      rf'\1compileSdkVersion {APP_SDK}',
                      text,
                  )
                  text = re.sub(
                      r'(?m)^(\s*)compileSdk\s*(?:=\s*)?.*$',
                      rf'\1compileSdkVersion {APP_SDK}',
                      text,
                  )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  return True

              return False

          # Main Android app must compile against 36 too.
          app_candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          app_patched = False
          for app_file in app_candidates:
              if app_file.exists():
                  changed = patch_gradle_file(app_file)
                  app_patched = app_patched or changed
                  print("APP:", app_file, "patched=", changed)

          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          # These are the Android plugins used by this project or pulled in
          # by the Android-only helper packages. file_picker is the module
          # that triggered the current AAR metadata failure.
