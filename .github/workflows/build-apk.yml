          echo "========================================="
          echo "       VIDYA SAARTHI APK READY"
          echo "========================================="
          echo ""

          ls -lh release/

          echo ""
          echo "APK SHA256:"
          sha256sum \
            release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk

      # ============================================================
      # 19. PUBLISH GITHUB RELEASE
      # Same package id + same signing key + higher build number =
      # existing installed Vidya Saarthi app updates in place.
      # ============================================================
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Vidya Saarthi v1.0.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk

      # ============================================================
      # 20. UPDATE FIRESTORE APP UPDATE CONTROL
      # Profile > Settings > App Update isi document ko read karta hai.
      # Requires existing GitHub secret: FIREBASE_SERVICE_ACCOUNT
      # ============================================================
      - name: Publish App Update Metadata
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          RELEASE_TAG: android-v1.0.${{ github.run_number }}
          APK_FILE: Vidya-Saarthi-v1.0.${{ github.run_number }}.apk
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/vidya-update-admin"
          cd "$RUNNER_TEMP/vidya-update-admin"
          npm init -y >/dev/null 2>&1
          npm install firebase-admin@14.4.0 >/dev/null

          cat > publish-update.cjs <<'NODE'
          const { initializeApp, cert } =
            require('firebase-admin/app');
          const { getFirestore, FieldValue } =
            require('firebase-admin/firestore');
          const { execSync } = require('child_process');

          const serviceAccount = JSON.parse(
            process.env.FIREBASE_SERVICE_ACCOUNT
          );

          initializeApp({
            credential: cert(serviceAccount),
          });

          const db = getFirestore();

          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          const apkFile = process.env.APK_FILE;
          const versionCode = Number(process.env.VERSION_CODE);
          const versionName = process.env.VERSION_NAME;
          const apkUrl =
            `https://github.com/${repo}/releases/download/${tag}/${apkFile}`;

          let commitMessage =
            'Latest Vidya Saarthi improvements and fixes.';

          try {
            commitMessage = execSync(
              'git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s',
              {
                env: process.env,
                encoding: 'utf8',
                shell: '/bin/bash',
              },
            ).trim() || commitMessage;
          } catch (_) {}

          async function main() {
            await db
              .collection('app_config')
              .doc('android_update')
              .set({
                versionCode,
                versionName,
                apkUrl,
                whatsNew: [commitMessage],
                mandatory: false,
                releaseTag: tag,
                githubRepository: repo,
                publishedAt:
                  FieldValue.serverTimestamp(),
              }, { merge: true });

            console.log(
              'Firestore Android update metadata published.'
            );
            console.log(
              'Version:',
              versionName,
              '(' + versionCode + ')',
            );
            console.log('APK:', apkUrl);
          }

          main()
            .then(() => process.exit(0))
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE

          node publish-update.cjs

      # ============================================================
      # 19. BUILD SUMMARY
      # ============================================================
      - name: Create Build Summary
        shell: bash
        run: |
          APK_SIZE=$(du -h \
            release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk \
            | cut -f1)

          echo "# 📱 Vidya Saarthi Android" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **#${{ github.run_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: **${{ github.ref_name }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK Size: **$APK_SIZE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: **36**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: **17**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Camera Scanner: **Enabled**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build Type: **Release**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase Android: **Configured**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: **Permanent release key**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "APK Artifact + GitHub Release dono me publish hoga." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 20. UPLOAD APK
      # ============================================================
      - name: Upload Vidya Saarthi APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidya-Saarthi-APK-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # CLEANUP SENSITIVE RUNNER FILES
      # ============================================================
      - name: Cleanup Signing Files
        if: always()
        shell: bash
        run: |
          rm -f \
            android/app/saarthi-release.jks \
            android/app/saarthi-release.jks.enc \
            android/app/google-services.json
