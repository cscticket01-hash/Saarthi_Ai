              "file_picker-*",
              "flutter_plugin_android_lifecycle-*",
              "mobile_scanner-*",
              "flutter_contacts-*",
              "permission_handler_android-*",
              "url_launcher_android-*",
              "agora_rtc_engine-*",
              "iris_method_channel-*",
              "printing-*",
          ]

          seen = set()
          patched = []

          for pattern in patterns:
              for package in pub_cache.glob(pattern):
                  if package in seen:
                      continue
                  seen.add(package)

                  android_dir = package / "android"
                  if not android_dir.exists():
                      continue

                  for gradle_file in list(android_dir.rglob("*.gradle")) + \
                          list(android_dir.rglob("*.gradle.kts")):
                      if patch_gradle_file(gradle_file):
                          patched.append(str(gradle_file))

          print("Patched plugin Gradle files:", len(patched))
          for item in patched:
              print("PATCHED:", item)

          # file_picker must exist because Android source uses it.
          file_picker_dirs = list(pub_cache.glob("file_picker-8.0.7"))
          if not file_picker_dirs:
              raise SystemExit("ERROR: file_picker 8.0.7 package not found")
          PY

          # Keep Gradle VFS watcher off in CI to avoid the intermittent
          # "Already watching path" exception seen in the previous run.
          touch android/gradle.properties
          if grep -q '^org\.gradle\.vfs\.watch=' android/gradle.properties; then
            sed -i \
              's/^org\.gradle\.vfs\.watch=.*/org.gradle.vfs.watch=false/' \
              android/gradle.properties
          else
            echo 'org.gradle.vfs.watch=false' >> android/gradle.properties
          fi

          echo ""
          echo "===== FINAL APP COMPILE SDK ====="
          grep -R -n "compileSdk" android/app 2>/dev/null || true

          echo ""
          echo "===== FINAL FILE_PICKER COMPILE SDK ====="
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "file_picker-8.0.7" \
            -exec grep -R -n "compileSdk" {}/android \; \
            2>/dev/null || true

          echo ""
          echo "===== GRADLE CI PROPERTIES ====="
          grep -E \
            'org.gradle.vfs.watch|dev.steenbakker.mobile_scanner.useUnbundled' \
            android/gradle.properties || true

      # ============================================================
      # 16B. ANDROID-ONLY STUDENT MOBILE UI
      # IMPORTANT: This patches only the GitHub runner copy.
      # Repository/web main_dashboard_screen.dart remains unchanged.
