      - name: Apply Android-only Student Mobile UI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scripts
          cat > scripts/android_mobile_ui_patch.py <<'PYMOBILEPATCH'
          from pathlib import Path
          import textwrap
          import re

          DASHBOARD = Path('lib/main_dashboard_screen.dart')

          if not DASHBOARD.exists():
              raise SystemExit('ERROR: lib/main_dashboard_screen.dart nahi mila')

          text = DASHBOARD.read_text(encoding='utf-8', errors='ignore')

          launcher_import = "import 'package:url_launcher/url_launcher.dart';"
          if launcher_import not in text:
              import_matches = list(re.finditer(r"(?m)^import\s+[^;]+;\s*$", text))
              if not import_matches:
                  raise SystemExit('ERROR: Dart import insert point nahi mila')
              insert_at = import_matches[-1].end()
              text = text[:insert_at] + '\n' + launcher_import + text[insert_at:]

          android_update_imports = [
              "import 'dart:io';",
              "import 'package:http/http.dart' as http;",
              "import 'package:path_provider/path_provider.dart';",
              "import 'package:open_filex/open_filex.dart';",
          ]
          for import_line in android_update_imports:
              if import_line in text:
                  continue
              if launcher_import in text:
                  text = text.replace(launcher_import, launcher_import + '\n' + import_line, 1)
              else:
                  raise SystemExit('ERROR: Android update imports add point nahi mila')

          student_state_start = text.find('class _StudentPortalScreenState')
          if student_state_start == -1:
              raise SystemExit('ERROR: StudentPortal state class nahi mila')

          admin_state_start = text.find('class _AdminDashboardScreenState', student_state_start)
          if admin_state_start == -1:
              raise SystemExit('ERROR: AdminDashboard state class marker nahi mila')

          student_section = text[student_state_start:admin_state_start]

          update_state_anchor = """  String? profileError;
          """
          update_state_fields = """  String? profileError;

            bool _androidUpdateDownloading = false;
            double _androidUpdateProgress = 0.0;
            String _androidUpdateStatus = '';
          """

          if '_androidUpdateDownloading' not in student_section:
              if update_state_anchor not in student_section:
                  raise SystemExit('ERROR: Android updater state patch point nahi mila')
              student_section = student_section.replace(
                  update_state_anchor,
                  update_state_fields,
                  1,
              )

          if '_openAndroidStudentProfilePanel' not in student_section:
              build_marker = '  @override\n  Widget build(BuildContext context) {'
              build_index = student_section.find(build_marker)
              if build_index == -1:
                  raise SystemExit('ERROR: StudentPortal build method nahi mila')

              helpers = textwrap.dedent(r'''
                Future<void> _cleanupAndroidUpdateCache({
                  String? keepPath,
                }) async {
                  try {
                    final tempDir = await getTemporaryDirectory();
                    if (!await tempDir.exists()) return;

                    await for (final entity in tempDir.list()) {
                      if (entity is! File) continue;

                      final path = entity.path;
                      final name = path.split(Platform.pathSeparator).last;

                      if (!name.startsWith('Vidya-Saarthi-') ||
                          !name.endsWith('.apk')) {
                        continue;
                      }

                      if (keepPath != null && path == keepPath) {
                        continue;
                      }

                      try {
                        await entity.delete();
                      } catch (_) {}
                    }
                  } catch (_) {}
                }

                Future<void> _downloadAndInstallAndroidUpdate({
                  required String apkUrl,
                  required String latestName,
                }) async {
                  if (_androidUpdateDownloading) return;

                  final uri = Uri.tryParse(apkUrl);
                  if (uri == null) {
                    if (!mounted) return;
                    ScaffoldMessenger.of(context).showSnackBar(
                      const SnackBar(
                        backgroundColor: Colors.redAccent,
                        content: Text('Update download URL invalid hai.'),
                      ),
                    );
                    return;
                  }

                  setState(() {
                    _androidUpdateDownloading = true;
                    _androidUpdateProgress = 0.0;
                    _androidUpdateStatus = 'Preparing update...';
                  });

                  http.Client? client;
                  IOSink? sink;
                  File? apkFile;

                  try {
                    await _cleanupAndroidUpdateCache();

                    final tempDir = await getTemporaryDirectory();
                    final safeVersion = latestName.isEmpty
                        ? 'latest'
                        : latestName.replaceAll(
                            RegExp(r'[^0-9A-Za-z._-]'),
                            '_',
                          );

                    apkFile = File(
                      '${tempDir.path}/Vidya-Saarthi-$safeVersion.apk',
                    );

                    if (await apkFile.exists()) {
                      await apkFile.delete();
                    }

                    client = http.Client();
                    final request = http.Request('GET', uri);
                    final response = await client.send(request);

                    if (response.statusCode < 200 ||
                        response.statusCode >= 300) {
                      throw Exception(
                        'Download HTTP ${response.statusCode}',
                      );
                    }

                    final total = response.contentLength ?? 0;
                    var received = 0;
                    sink = apkFile.openWrite();

                    if (mounted) {
                      setState(() {
                        _androidUpdateStatus = 'Downloading update...';
                      });
                    }

                    await for (final chunk in response.stream) {
                      sink.add(chunk);
                      received += chunk.length;

                      if (!mounted) continue;

                      final nextProgress =
                          total > 0 ? received / total : 0.0;

                      setState(() {
                        _androidUpdateProgress =
                            nextProgress.clamp(0.0, 1.0);
                        _androidUpdateStatus = total > 0
                            ? '${(_androidUpdateProgress * 100).toStringAsFixed(0)}% downloaded'
                            : 'Downloading update...';
                      });
                    }

                    await sink.flush();
                    await sink.close();
                    sink = null;

                    if (!mounted) return;

                    setState(() {
                      _androidUpdateProgress = 1.0;
                      _androidUpdateStatus =
                          'Download complete. Opening Android installer...';
                    });

                    // Keep only the newest APK inside the app-private temp folder.
                    await _cleanupAndroidUpdateCache(
                      keepPath: apkFile.path,
                    );

                    final result = await OpenFilex.open(
                      apkFile.path,
                      type:
                          'application/vnd.android.package-archive',
                    );

                    if (!mounted) return;

                    if (result.type == ResultType.done) {
                      setState(() {
                        _androidUpdateStatus =
                            'Installer opened. Android par Update/Install confirm karein.';
                      });
                    } else {
                      throw Exception(result.message);
                    }
                  } catch (e) {
                    try {
                      await sink?.close();
                    } catch (_) {}

                    if (apkFile != null) {
                      try {
                        if (await apkFile.exists()) {
                          await apkFile.delete();
                        }
                      } catch (_) {}
                    }

                    if (!mounted) return;

                    setState(() {
                      _androidUpdateDownloading = false;
                      _androidUpdateProgress = 0.0;
                      _androidUpdateStatus = '';
                    });

                    ScaffoldMessenger.of(context).showSnackBar(
                      SnackBar(
                        backgroundColor: Colors.redAccent,
                        content: Text(
                          'Update download failed: $e',
                        ),
                      ),
                    );
                  } finally {
                    client?.close();
                  }
                }

                String _formatAndroidNoticeDateTime(dynamic value) {
                  DateTime? date;

                  if (value is Timestamp) {
                    date = value.toDate();
                  } else if (value is int) {
                    date = DateTime.fromMillisecondsSinceEpoch(value);
                  } else if (value is num) {
                    date = DateTime.fromMillisecondsSinceEpoch(value.toInt());
                  } else if (value is DateTime) {
                    date = value;
                  } else if (value != null) {
                    final raw = value.toString().trim();
                    final millis = int.tryParse(raw);
                    if (millis != null) {
                      date = DateTime.fromMillisecondsSinceEpoch(millis);
                    } else {
                      date = DateTime.tryParse(raw);
                    }
                  }

                  if (date == null) return '';

                  final local = date.toLocal();
                  final day = local.day.toString().padLeft(2, '0');
                  final month = local.month.toString().padLeft(2, '0');
                  final year = local.year.toString();

                  var hour = local.hour;
                  final suffix = hour >= 12 ? 'PM' : 'AM';
                  hour = hour % 12;
                  if (hour == 0) hour = 12;

                  final minute = local.minute.toString().padLeft(2, '0');

                  return '$day/$month/$year • $hour:$minute $suffix';
                }

