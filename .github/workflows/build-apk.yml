name: Build Saarthi AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 5. INSTALL ANDROID SDK 34
      # ============================================================
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ============================================================
      # 6. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show Build Environment
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # ============================================================
      # 7. CONFIGURE ANDROID PROJECT
      # Existing project ko overwrite nahi karega
      # ============================================================
      - name: Configure Android Project
        shell: bash
        run: |
          flutter config --enable-android

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android project missing. Creating..."
            flutter create \
              --platforms=android \
              --android-language=java \
              --no-pub \
              .
          else
            echo "Existing Android project found."
            echo "Existing Android configuration preserve kiya jayega."
          fi

      # ============================================================
      # 8. FIREBASE + PERMANENT RELEASE SIGNING
      # Runner-only: repository source unchanged rahega
      # ============================================================
      - name: Configure Firebase and Permanent Signing
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENCRYPTED_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret missing."
            exit 1
          fi

          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID secret missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_ENCRYPTED_BASE64 secret missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          echo "Restoring Firebase Android configuration..."
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > android/app/google-services.json

          echo "Restoring permanent encrypted signing key..."
          printf '%s' "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" \
            | base64 --decode \
            > android/app/saarthi-release.jks.enc

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -in android/app/saarthi-release.jks.enc \
            -out android/app/saarthi-release.jks \
            -pass env:ANDROID_KEYSTORE_PASSWORD

          rm -f android/app/saarthi-release.jks.enc
          chmod 600 android/app/saarthi-release.jks

          python3 <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          expected_package = "com.example.saarthi_ai"

          google_json = Path("android/app/google-services.json")
          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          for path in (google_json, settings, app_gradle):
              if not path.exists():
                  raise SystemExit(f"ERROR: Required file missing: {path}")

          data = json.loads(google_json.read_text(encoding="utf-8"))

          clients = data.get("client", [])
          matched = [
              client for client in clients
              if client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name") == expected_package
          ]

          if not matched:
              raise SystemExit(
                  "ERROR: google-services.json package name "
                  f"{expected_package} se match nahi karta"
              )

          android_client = matched[0]

          oauth_clients = android_client.get("oauth_client", [])
          expected_web_client = os.environ.get(
              "GOOGLE_WEB_CLIENT_ID",
              "",
          )

          has_web_client = any(
              client.get("client_type") == 3
              and client.get("client_id") == expected_web_client
              for client in oauth_clients
          )

          if not has_web_client:
              raise SystemExit(
                  "ERROR: GOOGLE_WEB_CLIENT_ID google-services.json "
                  "ke Web OAuth client se match nahi karta"
              )

          settings_text = settings.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          google_plugin_decl = (
              '    id("com.google.gms.google-services") '
              'version "4.5.0" apply false'
          )

          if 'id("com.google.gms.google-services")' not in settings_text:
              settings_text, count = re.subn(
                  r'(?m)^plugins\s*\{\s*$',
                  "plugins {\n" + google_plugin_decl,
                  settings_text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: settings.gradle.kts plugins block nahi mila"
                  )

              settings.write_text(
                  settings_text,
                  encoding="utf-8",
              )

          app_text = app_gradle.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          if 'id("com.google.gms.google-services")' not in app_text:
              android_plugin = '    id("com.android.application")'
              google_plugin = '    id("com.google.gms.google-services")'

              if android_plugin in app_text:
                  app_text = app_text.replace(
                      android_plugin,
                      android_plugin + "\n" + google_plugin,
                      1,
                  )
              else:
                  app_text, count = re.subn(
                      r'(?m)^plugins\s*\{\s*$',
                      'plugins {\n' + google_plugin,
                      app_text,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit(
                          "ERROR: app/build.gradle.kts plugins block nahi mila"
                      )

          if 'create("release")' not in app_text:
              signing_block = """    signingConfigs {
                  create("release") {
                      storeFile = file("saarthi-release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = "saarthi"
                      keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }

          """

              build_types_marker = "    buildTypes {\n"

              if build_types_marker not in app_text:
                  raise SystemExit(
                      "ERROR: app/build.gradle.kts buildTypes block nahi mila"
                  )

              app_text = app_text.replace(
                  build_types_marker,
                  signing_block + build_types_marker,
                  1,
              )

          release_signing = (
              'signingConfig = signingConfigs.getByName("release")'
          )

          if release_signing not in app_text:
              debug_signing = (
                  'signingConfig = signingConfigs.getByName("debug")'
              )

              if debug_signing in app_text:
                  app_text = app_text.replace(
                      debug_signing,
                      release_signing,
                      1,
                  )
              else:
                  app_text, count = re.subn(
                      r'(?m)^(\s*)release\s*\{\s*$',
                      lambda m: (
                          f'{m.group(1)}release {{\n'
                          f'{m.group(1)}    {release_signing}'
                      ),
                      app_text,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit(
                          "ERROR: release buildType patch nahi hua"
                      )

          app_gradle.write_text(
              app_text,
              encoding="utf-8",
          )

          print("Firebase package verified:", expected_package)
          print("Google Services Gradle plugin configured.")
          print("Permanent release signing configured.")
          PY

          EXPECTED_SHA1="76:24:14:31:E2:A8:21:D7:56:64:A6:12:24:46:EB:50:6F:CA:D0:1B"

          ACTUAL_SHA1="$(
            keytool -list -v \
              -keystore android/app/saarthi-release.jks \
              -alias saarthi \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              | sed -n 's/^[[:space:]]*SHA1: //p' \
              | head -n 1
          )"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing key SHA-1 mismatch."
            echo "Expected: $EXPECTED_SHA1"
            echo "Actual:   $ACTUAL_SHA1"
            exit 1
          fi

          echo "Permanent signing SHA-1 verified: $ACTUAL_SHA1"

          echo ""
          echo "===== FIREBASE / SIGNING CHECK ====="
          grep -n \
            'com.google.gms.google-services' \
            android/settings.gradle.kts \
            android/app/build.gradle.kts

          grep -n \
            'signingConfig = signingConfigs.getByName("release")' \
            android/app/build.gradle.kts

          test -s android/app/google-services.json
          test -s android/app/saarthi-release.jks

      # ============================================================
      # 8. ENSURE CAMERA + INTERNET PERMISSIONS
      # ============================================================
      - name: Ensure Android Permissions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml nahi mila")

          text = manifest.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          additions = []

          if 'android.permission.INTERNET' not in text:
              additions.append(
                  '    <uses-permission android:name="android.permission.INTERNET" />'
              )

          if 'android.permission.CAMERA' not in text:
              additions.append(
                  '    <uses-permission android:name="android.permission.CAMERA" />'
              )

          if 'android.hardware.camera.any' not in text:
              additions.append(
                  '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />'
              )

          if additions:
              manifest_end = text.find('>')

              if manifest_end == -1:
                  raise SystemExit("ERROR: Invalid AndroidManifest.xml")

              text = (
                  text[:manifest_end + 1]
                  + "\n"
                  + "\n".join(additions)
                  + "\n"
                  + text[manifest_end + 1:]
              )

          # mobile_scanner 5.1.1 + Android Impeller can show a
          # black/error camera preview on some Android devices.
          # Disable Impeller only for this Android APK build.
          impeller_meta = (
              '        <meta-data '
              'android:name="io.flutter.embedding.android.EnableImpeller" '
              'android:value="false" />'
          )

          if 'io.flutter.embedding.android.EnableImpeller' not in text:
              app_start = text.find('<application')

              if app_start == -1:
                  raise SystemExit(
                      "ERROR: AndroidManifest.xml me <application> tag nahi mila"
                  )

              app_tag_end = text.find('>', app_start)

              if app_tag_end == -1:
                  raise SystemExit(
                      "ERROR: AndroidManifest.xml ka <application> tag invalid hai"
                  )

              insert_at = app_tag_end + 1
              text = (
                  text[:insert_at]
                  + "\n"
                  + impeller_meta
                  + text[insert_at:]
              )

          manifest.write_text(
              text,
              encoding="utf-8",
          )

          print("===== ANDROID MANIFEST =====")
          final_manifest = manifest.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          print(final_manifest)

          if 'io.flutter.embedding.android.EnableImpeller' not in final_manifest:
              raise SystemExit("ERROR: Impeller disable flag missing")

          print("Android scanner fix: Impeller disabled.")
          PY

      # ============================================================
      # 9. CLEAN PROJECT
      # ============================================================
      - name: Clean Project
        run: flutter clean

      # ============================================================
      # 10. GET DEPENDENCIES
      # ============================================================
      - name: Install Flutter Dependencies
        run: flutter pub get

      # ============================================================
      # 11. ANDROID-ONLY MOBILE SCANNER UPGRADE
      # Repository/web pubspec unchanged rahega. Runner copy only.
      # mobile_scanner 5.1.1 me Android black-preview/init issues the.
      # 6.0.8+ fixes controller initialization black-screen issues.
      # ============================================================
      - name: Upgrade Android Mobile Scanner
        shell: bash
        run: |
          set -euo pipefail

          echo "Upgrading Android runner copy to mobile_scanner 7.2.1..."
          flutter pub add "mobile_scanner:7.2.1"
          flutter pub get

          echo ""
          echo "===== MOBILE SCANNER VERSION ====="

          flutter pub deps > /tmp/saarthi-pub-deps.txt
          grep "mobile_scanner" /tmp/saarthi-pub-deps.txt || true

          if ! grep -q "mobile_scanner 7.2.1" /tmp/saarthi-pub-deps.txt; then
            echo "::error::mobile_scanner 7.2.1 resolve nahi hua."
            exit 1
          fi

          echo "OK - Android mobile_scanner 7.2.1 active."

      # ============================================================
      # 12. FIX OLD PLUGIN COMPILE SDK
      # Agora + Iris + Printing runner-only patch
      # ============================================================
      - name: Fix Plugin Compile SDK
        shell: bash
        run: |
          echo "Fixing Android plugin compileSdk..."

          python3 <<'PY'
          from pathlib import Path
          import re

          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          package_patterns = [
              "agora_rtc_engine-*",
              "iris_method_channel-*",
              "printing-*",
          ]

          found_packages = 0
          patched_files = 0

          for package_pattern in package_patterns:
              packages = list(pub_cache.glob(package_pattern))

              if not packages:
                  print(f"WARNING: {package_pattern} nahi mila")
                  continue

              for package in packages:
                  found_packages += 1

                  print("")
                  print("====================================")
                  print("PACKAGE:", package)
                  print("====================================")

                  android_dir = package / "android"

                  if not android_dir.exists():
                      print("Android folder nahi hai - skip")
                      continue

                  gradle_files = list(android_dir.rglob("*.gradle"))
                  gradle_files += list(android_dir.rglob("*.gradle.kts"))

                  for file in gradle_files:
                      text = file.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      )

                      original = text

                      if file.name.endswith(".gradle.kts"):
                          text = re.sub(
                              r'(?m)^(\s*)compileSdk\s*=.*$',
                              r'\1compileSdk = 34',
                              text,
                          )
                          text = re.sub(
                              r'(?m)^(\s*)compileSdkVersion\s*=.*$',
                              r'\1compileSdk = 34',
                              text,
                          )
                      else:
                          text = re.sub(
                              r'(?m)^(\s*)compileSdkVersion\s+.*$',
                              r'\1compileSdkVersion 34',
                              text,
                          )
                          text = re.sub(
                              r'(?m)^(\s*)compileSdk\s*(?:=\s*)?.*$',
                              r'\1compileSdkVersion 34',
                              text,
                          )

                      if text != original:
                          file.write_text(
                              text,
                              encoding="utf-8",
                          )
                          patched_files += 1
                          print("PATCHED:", file)

          print("")
          print("Found packages:", found_packages)
          print("Patched Gradle files:", patched_files)

          if found_packages == 0:
              raise SystemExit(
                  "ERROR: Agora/Iris/Printing packages nahi mile"
              )
          PY

          echo ""
          echo "===== AGORA AFTER PATCH ====="
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "agora_rtc_engine-*" \
            -exec grep -R -n "compileSdk" {}/android \; \
            2>/dev/null || true

          echo ""
          echo "===== IRIS AFTER PATCH ====="
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "iris_method_channel-*" \
            -exec grep -R -n "compileSdk" {}/android \; \
            2>/dev/null || true

          echo ""
          echo "===== PRINTING AFTER PATCH ====="
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "printing-*" \
            -exec grep -R -n "compileSdk" {}/android \; \
            2>/dev/null || true

          echo ""
          echo "Plugin compileSdk patch completed."

      # ============================================================
      # 13. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android Configuration
        shell: bash
        run: |
          echo "===== APP COMPILE SDK ====="
          grep -R -n "compileSdk" android/app 2>/dev/null || true

          echo ""
          echo "===== CAMERA PERMISSION ====="
          grep -R -n "android.permission.CAMERA" \
            android/app/src/main/AndroidManifest.xml

          echo ""
          echo "===== INTERNET PERMISSION ====="
          grep -R -n "android.permission.INTERNET" \
            android/app/src/main/AndroidManifest.xml

      # ============================================================
      # 14. FLUTTER DOCTOR
      # ============================================================
      - name: Flutter Doctor
        run: flutter doctor -v

      # ============================================================
      # 15. ANDROID-ONLY TEMPORARY DART PATCH
      # Original GitHub Dart files unchanged rahenge
      # ============================================================
      - name: Prepare Android Safe Dart Source
        shell: bash
        run: |
          echo "Preparing Android-only temporary source..."

          # Android me external WhatsApp link open karne ke liye.
          # Runner-only pubspec change; repository me commit nahi hota.
          flutter pub add "url_launcher:^6.3.2"

          # Android native Google Sign-In ke liye.
          # Runner-only change; website/repository source unchanged.
          flutter pub add "google_sign_in:^6.2.1"

          python3 <<'PY'
          from pathlib import Path
          import re

          dashboard_path = Path(
              "lib/main_dashboard_screen.dart"
          )

          if not dashboard_path.exists():
              raise SystemExit(
                  "ERROR: lib/main_dashboard_screen.dart nahi mila"
              )

          text = dashboard_path.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          # ========================================================
          # 1. REMOVE dart:html IMPORT
          # ========================================================
          text = re.sub(
              r"(?m)^\s*import\s+'dart:html'\s+as\s+html;\s*\n?",
              "",
              text,
          )

          # ========================================================
          # 2. ADD url_launcher IMPORT
          # ========================================================
          launcher_import = (
              "import 'package:url_launcher/url_launcher.dart';\n"
          )

          if launcher_import not in text:
              mobile_import = (
                  "import 'package:mobile_scanner/mobile_scanner.dart';\n"
              )

              qr_import = (
                  "import 'package:qr_flutter/qr_flutter.dart';\n"
              )

              if mobile_import in text:
                  text = text.replace(
                      mobile_import,
                      mobile_import + launcher_import,
                      1,
                  )
              elif qr_import in text:
                  text = text.replace(
                      qr_import,
                      qr_import + launcher_import,
                      1,
                  )
              else:
                  raise SystemExit(
                      "ERROR: url_launcher import add karne ki jagah nahi mili"
                  )

          # ========================================================
          # 3. SCANNER MOBILE DETECTION
          # ========================================================
          old_user_agent = (
              "html.window.navigator.userAgent.toLowerCase()"
          )

          if old_user_agent in text:
              text = text.replace(
                  old_user_agent,
                  "'android'",
              )
              print(
                  "Scanner user-agent Android ke liye patched."
              )
          # ========================================================
          # 4. ANDROID SCANNER CONTROLLER FIX
          # Manual start + exact camera error reporting.
          # Runner copy only; website source unchanged.
          # ========================================================
          scanner_field_old = '  bool _showInlineScanner = false;\n  bool _scanHandled = false;\n  bool _isQrVerifying = false;\n  String? _scanError;\n'
          scanner_field_new = '  bool _showInlineScanner = false;\n  bool _scanHandled = false;\n  bool _isQrVerifying = false;\n\n  final MobileScannerController _qrScannerController =\n      MobileScannerController(\n    autoStart: false,\n    facing: CameraFacing.back,\n    formats: const [BarcodeFormat.qrCode],\n  );\n\n  String? _scanError;\n'
          if scanner_field_old not in text:
              raise SystemExit(
                  "ERROR: Scanner state fields patch point nahi mila"
              )
          text = text.replace(scanner_field_old, scanner_field_new, 1)
          scanner_dispose_old = '  @override\n  void dispose() {\n    _usernameController.dispose();\n    _passwordController.dispose();\n    super.dispose();\n  }\n'
          scanner_dispose_new = '  @override\n  void dispose() {\n    _qrScannerController.dispose();\n    _usernameController.dispose();\n    _passwordController.dispose();\n    super.dispose();\n  }\n'
          if scanner_dispose_old not in text:
              raise SystemExit(
                  "ERROR: Scanner dispose patch point nahi mila"
              )
          text = text.replace(scanner_dispose_old, scanner_dispose_new, 1)
          switch_role_old = '  void _switchRole(bool isAdmin) {\n    setState(() {\n'
          switch_role_new = '  void _switchRole(bool isAdmin) {\n    _qrScannerController.stop();\n\n    setState(() {\n'
          if switch_role_old not in text:
              raise SystemExit(
                  "ERROR: Scanner role switch patch point nahi mila"
              )
          text = text.replace(switch_role_old, switch_role_new, 1)
          scanner_start_regex = 'void _startInlineScanner\\(\\) \\{\n  if \\(_isAdminMode\\) return;\n\n  setState\\(\\(\\) \\{\n    _showInlineScanner = true;\n    _scanHandled = false;\n    _isQrVerifying = false;\n    _scanError = null;\n    _scannedStudentData = null;\n    _passwordController\\.clear\\(\\);\n  \\}\\);\n\\}'
          scanner_start_new = "Future<void> _startInlineScanner() async {\n  if (_isAdminMode) return;\n\n  setState(() {\n    _showInlineScanner = true;\n    _scanHandled = false;\n    _isQrVerifying = false;\n    _scanError = null;\n    _scannedStudentData = null;\n    _passwordController.clear();\n  });\n\n  await Future<void>.delayed(\n    const Duration(milliseconds: 300),\n  );\n\n  try {\n    await _qrScannerController.start();\n  } on MobileScannerException catch (e) {\n    if (!mounted) return;\n\n    final details = e.errorDetails?.message;\n    final code = e.errorCode.name;\n\n    setState(() {\n      _scanError = details == null || details.isEmpty\n          ? 'Scanner error: $code'\n          : 'Scanner error: $code - $details';\n    });\n  } catch (e) {\n    if (!mounted) return;\n\n    setState(() {\n      _scanError = 'Scanner start error: $e';\n    });\n  }\n}"
          scanner_start_pattern = re.compile(scanner_start_regex)
          text, scanner_start_count = scanner_start_pattern.subn(
              scanner_start_new,
              text,
              count=1,
          )
          if scanner_start_count != 1:
              raise SystemExit(
                  "ERROR: Scanner start method patch nahi hua"
              )
          scanner_close_old = '  void _closeInlineScanner() {\n    setState(() {\n      _showInlineScanner = false;\n      _scanHandled = false;\n      _isQrVerifying = false;\n      _scanError = null;\n    });\n  }\n'
          scanner_close_new = '  void _closeInlineScanner() {\n    _qrScannerController.stop();\n\n    setState(() {\n      _showInlineScanner = false;\n      _scanHandled = false;\n      _isQrVerifying = false;\n      _scanError = null;\n    });\n  }\n'
          if scanner_close_old not in text:
              raise SystemExit(
                  "ERROR: Scanner close patch point nahi mila"
              )
          text = text.replace(scanner_close_old, scanner_close_new, 1)
          scanner_clear_old = '  void _clearScannedStudent() {\n    setState(() {\n      _showInlineScanner = false;\n'
          scanner_clear_new = '  void _clearScannedStudent() {\n    _qrScannerController.stop();\n\n    setState(() {\n      _showInlineScanner = false;\n'
          if scanner_clear_old not in text:
              raise SystemExit(
                  "ERROR: Scanner clear patch point nahi mila"
              )
          text = text.replace(scanner_clear_old, scanner_clear_new, 1)
          scanner_success_old = '      if (!mounted) return;\n\n      setState(() {\n        _selectedClass = studentClass;\n        _usernameController.text = roll;\n'
          scanner_success_new = '      if (!mounted) return;\n\n      _qrScannerController.stop();\n\n      setState(() {\n        _selectedClass = studentClass;\n        _usernameController.text = roll;\n'
          if scanner_success_old not in text:
              raise SystemExit(
                  "ERROR: Scanner success patch point nahi mila"
              )
          text = text.replace(scanner_success_old, scanner_success_new, 1)
          scanner_widget_old = '                MobileScanner(\n                  fit: BoxFit.cover,\n                  onDetect: _onInlineQrDetected,\n                ),\n'
          scanner_widget_new = "                MobileScanner(\n                  controller: _qrScannerController,\n                  fit: BoxFit.cover,\n                  onDetect: _onInlineQrDetected,\n                  errorBuilder: (context, error) {\n                    final details = error.errorDetails?.message;\n                    final code = error.errorCode.name;\n\n                    return Container(\n                      color: Colors.black,\n                      alignment: Alignment.center,\n                      padding: const EdgeInsets.all(18),\n                      child: Text(\n                        details == null || details.isEmpty\n                            ? 'Scanner error: $code'\n                            : 'Scanner error: $code\\n$details',\n                        textAlign: TextAlign.center,\n                        style: const TextStyle(\n                          color: Colors.redAccent,\n                          fontSize: 13,\n                          fontWeight: FontWeight.w700,\n                        ),\n                      ),\n                    );\n                  },\n                ),\n"
          if scanner_widget_old not in text:
              raise SystemExit(
                  "ERROR: MobileScanner widget patch point nahi mila"
              )
          text = text.replace(scanner_widget_old, scanner_widget_new, 1)
          print("Android scanner controller + detailed error patch applied.")

          # ========================================================
          # 5. WEB PDF DOWNLOAD -> ANDROID PDF SHARE
          # ========================================================
          pdf_start_marker = "final blob = html.Blob("
          pdf_end_marker = "html.Url.revokeObjectUrl(url);"

          pdf_start = text.find(pdf_start_marker)

          if pdf_start != -1:
              pdf_end = text.find(
                  pdf_end_marker,
                  pdf_start,
              )

              if pdf_end == -1:
                  raise SystemExit(
                      "ERROR: PDF html block ka end nahi mila"
                  )

              pdf_end += len(pdf_end_marker)

              pdf_replacement = """await Printing.sharePdf(
              bytes: pdfBytes,
              filename:
                  'SVN_ID_Card_${safeName}_Roll_$roll.pdf',
            );"""

              text = (
                  text[:pdf_start]
                  + pdf_replacement
                  + text[pdf_end:]
              )

              print(
                  "PDF download Android share me patched."
              )
          else:
              print(
                  "HTML PDF download block present nahi hai - skip."
              )

          # ========================================================
          # 5. WHATSAPP WEB OPEN -> ANDROID EXTERNAL APP
          # ========================================================
          whatsapp_pattern = re.compile(
              r"html\.window\.open\(\s*"
              r"'https://wa\.me/\$waNum'\s*,\s*"
              r"'_blank'\s*\);"
          )

          whatsapp_replacement = """launchUrl(
                                        Uri.parse(
                                          'https://wa.me/$waNum',
                                        ),
                                        mode: LaunchMode.externalApplication,
                                      );"""

          text, whatsapp_count = whatsapp_pattern.subn(
              whatsapp_replacement,
              text,
              count=1,
          )

          if whatsapp_count == 1:
              print(
                  "WhatsApp Android launcher patched."
              )
          else:
              print(
                  "WhatsApp html.window.open present nahi hai - skip."
              )

          # ========================================================
          # 6. REMOVE WEB-ONLY FIREBASE AUTH PERSISTENCE ON ANDROID
          # Original main.dart GitHub me unchanged rahega
          # ========================================================
          main_path = Path("lib/main.dart")

          if not main_path.exists():
              raise SystemExit(
                  "ERROR: lib/main.dart nahi mila"
              )

          main_text = main_path.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          main_text, persistence_count = re.subn(
              r'(?m)^\s*await\s+FirebaseAuth\.instance'
              r'\.setPersistence\(Persistence\.LOCAL\);\s*$',
              '',
              main_text,
              count=1,
          )

          if persistence_count == 1:
              print(
                  "Android: Firebase web persistence removed."
              )
          else:
              print(
                  "Firebase setPersistence line nahi mili - skip."
              )

          # ========================================================
          # 7. USE NATIVE ANDROID FIREBASE CONFIG
          # Android APK must initialize Firebase from google-services.json.
          # Original website source remains unchanged; runner copy only.
          # ========================================================
          firebase_init_pattern = re.compile(
              r"await\s+Firebase\.initializeApp\(\s*"
              r"options:\s*const\s+FirebaseOptions\("
              r".*?"
              r"\),\s*"
              r"\);",
              re.S,
          )

          main_text, firebase_init_count = firebase_init_pattern.subn(
              "await Firebase.initializeApp();",
              main_text,
              count=1,
          )

          if firebase_init_count != 1:
              raise SystemExit(
                  "ERROR: Android Firebase.initializeApp native patch nahi hua"
              )

          print(
              "Android: Firebase now uses google-services.json native config."
          )

          # ========================================================
          # 8. WEB GOOGLE POPUP -> ANDROID NATIVE GOOGLE SIGN-IN
          # Website source unchanged rahega; sirf runner copy patch hoga.
          # ========================================================
          google_import = (
              "import 'package:google_sign_in/google_sign_in.dart';\n"
          )

          if google_import not in main_text:
              firebase_auth_import = (
                  "import 'package:firebase_auth/firebase_auth.dart';\n"
              )

              if firebase_auth_import in main_text:
                  main_text = main_text.replace(
                      firebase_auth_import,
                      firebase_auth_import + google_import,
                      1,
                  )
              else:
                  raise SystemExit(
                      "ERROR: main.dart me firebase_auth import nahi mila"
                  )

          google_method_pattern = re.compile(
              r"  Future<void> _signInWithGoogle\(\) async \{"
              r".*?"
              r"\n  \}"
              r"\n\n  Future<void> _submitAuth\(\) async \{",
              re.S,
          )

          google_method_replacement = r"""  Future<void> _signInWithGoogle() async {
              setState(() {
                _isLoading = true;
                _errorMessage = '';
              });

              try {
                const webClientId =
                    String.fromEnvironment('GOOGLE_WEB_CLIENT_ID');

                final googleSignIn = GoogleSignIn(
                  scopes: const ['email'],
                  serverClientId:
                      webClientId.isEmpty ? null : webClientId,
                );

                final GoogleSignInAccount? googleUser =
                    await googleSignIn.signIn();

                if (googleUser == null) {
                  return;
                }

                final GoogleSignInAuthentication googleAuth =
                    await googleUser.authentication;

                final credential =
                    GoogleAuthProvider.credential(
                  accessToken: googleAuth.accessToken,
                  idToken: googleAuth.idToken,
                );

                await FirebaseAuth.instance
                    .signInWithCredential(credential);
              } catch (e) {
                if (mounted) {
                  setState(
                    () => _errorMessage =
                        'Google Sign-In failed: $e',
                  );
                }
              } finally {
                if (mounted) {
                  setState(() => _isLoading = false);
                }
              }
            }

            Future<void> _submitAuth() async {"""

          main_text, google_method_count = (
              google_method_pattern.subn(
                  google_method_replacement,
                  main_text,
                  count=1,
              )
          )

          if google_method_count != 1:
              raise SystemExit(
                  "ERROR: Android Google Sign-In method patch nahi hua"
              )

          print(
              "Android: signInWithPopup native GoogleSignIn flow me patched."
          )

          # ========================================================
          # SAVE RUNNER-ONLY FILES
          # ========================================================
          dashboard_path.write_text(
              text,
              encoding="utf-8",
          )

          main_path.write_text(
              main_text,
              encoding="utf-8",
          )

          print("")
          print(
              "Android temporary Dart source created successfully."
          )
          PY

          echo ""
          echo "========================================="
          echo "CHECKING ANDROID TEMPORARY SOURCE"
          echo "========================================="

          echo ""
          echo "Checking Firebase web persistence..."

          if grep -n "setPersistence" lib/main.dart; then
            echo "::error::Android main.dart me setPersistence abhi bhi present hai!"
            exit 1
          else
            echo "OK - Android main.dart se web persistence removed."
          fi

          echo ""
          echo "Checking native Android Firebase initialization..."

          if grep -n "FirebaseOptions(" lib/main.dart; then
            echo "::error::Android main.dart me web FirebaseOptions abhi bhi present hai!"
            exit 1
          fi

          grep -n "Firebase.initializeApp();" lib/main.dart

          echo ""
          echo "Checking Android Google Sign-In..."

          if grep -n "signInWithPopup" lib/main.dart; then
            echo "::error::Android main.dart me signInWithPopup abhi bhi present hai!"
            exit 1
          else
            echo "OK - Android native Google Sign-In enabled."
          fi

          grep -n "google_sign_in" lib/main.dart || true
          grep -n "signInWithCredential" lib/main.dart || true

          echo ""
          echo "Checking dart:html / html.* ..."

          if grep -nE \
            "dart:html|html\." \
            lib/main_dashboard_screen.dart; then
            echo ""
            echo "::error::Android source me html code abhi bhi present hai!"
            exit 1
          else
            echo "OK - dart:html completely removed."
          fi

          echo ""
          echo "Checking mobile_scanner..."
          grep -n \
            "mobile_scanner" \
            lib/main_dashboard_screen.dart || true

          echo ""
          echo "Checking Android scanner controller patch..."
          grep -n "_qrScannerController" \
            lib/main_dashboard_screen.dart
          grep -n "errorBuilder:" \
            lib/main_dashboard_screen.dart

          echo ""
          echo "Checking url_launcher..."
          grep -n \
            "url_launcher" \
            lib/main_dashboard_screen.dart

          echo ""
          echo "Checking Printing.sharePdf..."
          grep -n \
            "Printing.sharePdf" \
            lib/main_dashboard_screen.dart || true

          echo ""
          echo "Android temporary source READY."

      # ============================================================
      # 17. BUILD RELEASE APK
      # ============================================================
      - name: Build Saarthi AI Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk \
            --release \
            --dart-define=GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      # ============================================================
      # 17. VERIFY APK EXISTS
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "::error::app-release.apk nahi mila!"
            exit 1
          fi

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ============================================================
      # 18. PREPARE FINAL APK
      # ============================================================
      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Saarthi-AI-v${{ github.run_number }}.apk

          echo ""
          echo "========================================="
          echo "       SAARTHI AI APK READY"
          echo "========================================="
          echo ""

          ls -lh release/

          echo ""
          echo "APK SHA256:"
          sha256sum \
            release/Saarthi-AI-v${{ github.run_number }}.apk

      # ============================================================
      # 19. BUILD SUMMARY
      # ============================================================
      - name: Create Build Summary
        shell: bash
        run: |
          APK_SIZE=$(du -h \
            release/Saarthi-AI-v${{ github.run_number }}.apk \
            | cut -f1)

          echo "# 📱 Saarthi AI Android" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **#${{ github.run_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: **${{ github.ref_name }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK Size: **$APK_SIZE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: **34+**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: **17**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Camera Scanner: **Enabled**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build Type: **Release**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase Android: **Configured**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Google Sign-In: **Native Android**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: **Permanent release key**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "APK ko Artifacts section se download karein." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 20. UPLOAD APK
      # ============================================================
      - name: Upload Saarthi AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Saarthi-AI-APK-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # CLEANUP SENSITIVE RUNNER FILES
      # ============================================================
      - name: Cleanup Signing Files
        if: always()
        shell: bash
        run: |
          rm -f \
            android/app/saarthi-release.jks \
            android/app/saarthi-release.jks.enc \
            android/app/google-services.json

