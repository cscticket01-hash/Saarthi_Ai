                  final remaining = _portalSessionRemainingSeconds();
                  _sessionSecondsRemaining.value = remaining;

                  if (remaining <= 0) {{
                    {auto_call};
                  }}
                }},
              );

              if (initialRemaining <= 0) {{
                WidgetsBinding.instance.addPostFrameCallback((_) {{
                  if (mounted) {auto_call};
                }});
              }}
            }}

