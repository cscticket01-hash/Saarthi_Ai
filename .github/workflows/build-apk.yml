name: Build Vidya Saarthi Android APK
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
    - name: Install Android SDK 36
      shell: bash
      run: "yes | sdkmanager --licenses >/dev/null || true\n\nsdkmanager \\\n  \"platform-tools\" \\\n  \"platforms;android-36\"\
        \ \\\n  \"build-tools;36.0.0\"\n"
    - name: Show Build Environment
      shell: bash
      run: 'flutter --version

        dart --version

        java -version

        echo "ANDROID_HOME=$ANDROID_HOME"

        '
    - name: Configure Android Project
      shell: bash
      run: "flutter config --enable-android\n\nif [ ! -f \"android/app/src/main/AndroidManifest.xml\" ]; then\n  echo \"Android\
        \ project missing. Creating...\"\n  flutter create \\\n    --platforms=android \\\n    --android-language=java \\\n\
        \    --no-pub \\\n    .\nelse\n  echo \"Existing Android project found.\"\n  echo \"Existing Android configuration\
        \ preserve kiya jayega.\"\nfi\n"
    - name: Configure Firebase and Permanent Signing
      shell: bash
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        ANDROID_KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENCRYPTED_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: "set -euo pipefail\n\nif [ -z \"$GOOGLE_SERVICES_JSON_BASE64\" ]; then\n  echo \"::error::GOOGLE_SERVICES_JSON_BASE64\
        \ secret missing.\"\n  exit 1\nfi\n\n\nif [ -z \"$ANDROID_KEYSTORE_ENCRYPTED_BASE64\" ]; then\n  echo \"::error::ANDROID_KEYSTORE_ENCRYPTED_BASE64\
        \ secret missing.\"\n  exit 1\nfi\n\nif [ -z \"$ANDROID_KEYSTORE_PASSWORD\" ]; then\n  echo \"::error::ANDROID_KEYSTORE_PASSWORD\
        \ secret missing.\"\n  exit 1\nfi\n\necho \"Restoring Firebase Android configuration...\"\nprintf '%s' \"$GOOGLE_SERVICES_JSON_BASE64\"\
        \ \\\n  | base64 --decode \\\n  > android/app/google-services.json\n\necho \"Restoring permanent encrypted signing\
        \ key...\"\nprintf '%s' \"$ANDROID_KEYSTORE_ENCRYPTED_BASE64\" \\\n  | base64 --decode \\\n  > android/app/saarthi-release.jks.enc\n\
        \nopenssl enc \\\n  -d \\\n  -aes-256-cbc \\\n  -pbkdf2 \\\n  -iter 200000 \\\n  -in android/app/saarthi-release.jks.enc\
        \ \\\n  -out android/app/saarthi-release.jks \\\n  -pass env:ANDROID_KEYSTORE_PASSWORD\n\nrm -f android/app/saarthi-release.jks.enc\n\
        chmod 600 android/app/saarthi-release.jks\n\npython3 <<'PY'\nfrom pathlib import Path\nimport json\nimport re\n\n\
        expected_package = \"com.example.saarthi_ai\"\n\ngoogle_json = Path(\"android/app/google-services.json\")\nsettings\
        \ = Path(\"android/settings.gradle.kts\")\napp_gradle = Path(\"android/app/build.gradle.kts\")\n\nfor path in (google_json,\
        \ settings, app_gradle):\n    if not path.exists():\n        raise SystemExit(f\"ERROR: Required file missing: {path}\"\
        )\n\ndata = json.loads(google_json.read_text(encoding=\"utf-8\"))\n\nclients = data.get(\"client\", [])\nmatched =\
        \ [\n    client for client in clients\n    if client.get(\"client_info\", {})\n        .get(\"android_client_info\"\
        , {})\n        .get(\"package_name\") == expected_package\n]\n\nif not matched:\n    raise SystemExit(\n        \"\
        ERROR: google-services.json package name \"\n        f\"{expected_package} se match nahi karta\"\n    )\n\nsettings_text\
        \ = settings.read_text(\n    encoding=\"utf-8\",\n    errors=\"ignore\",\n)\n\ngoogle_plugin_decl = (\n    '    id(\"\
        com.google.gms.google-services\") '\n    'version \"4.5.0\" apply false'\n)\n\nif 'id(\"com.google.gms.google-services\"\
        )' not in settings_text:\n    settings_text, count = re.subn(\n        r'(?m)^plugins\\s*\\{\\s*$',\n        \"plugins\
        \ {\\n\" + google_plugin_decl,\n        settings_text,\n        count=1,\n    )\n\n    if count != 1:\n        raise\
        \ SystemExit(\n            \"ERROR: settings.gradle.kts plugins block nahi mila\"\n        )\n\n    settings.write_text(\n\
        \        settings_text,\n        encoding=\"utf-8\",\n    )\n\napp_text = app_gradle.read_text(\n    encoding=\"utf-8\"\
        ,\n    errors=\"ignore\",\n)\n\nif 'id(\"com.google.gms.google-services\")' not in app_text:\n    android_plugin =\
        \ '    id(\"com.android.application\")'\n    google_plugin = '    id(\"com.google.gms.google-services\")'\n\n    if\
        \ android_plugin in app_text:\n        app_text = app_text.replace(\n            android_plugin,\n            android_plugin\
        \ + \"\\n\" + google_plugin,\n            1,\n        )\n    else:\n        app_text, count = re.subn(\n         \
        \   r'(?m)^plugins\\s*\\{\\s*$',\n            'plugins {\\n' + google_plugin,\n            app_text,\n           \
        \ count=1,\n        )\n\n        if count != 1:\n            raise SystemExit(\n                \"ERROR: app/build.gradle.kts\
        \ plugins block nahi mila\"\n            )\n\nif 'create(\"release\")' not in app_text:\n    signing_block = \"\"\"\
        \    signingConfigs {\n        create(\"release\") {\n            storeFile = file(\"saarthi-release.jks\")\n    \
        \        storePassword = System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n            keyAlias = \"saarthi\"\n      \
        \      keyPassword = System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n        }\n    }\n\n\"\"\"\n\n    build_types_marker\
        \ = \"    buildTypes {\\n\"\n\n    if build_types_marker not in app_text:\n        raise SystemExit(\n           \
        \ \"ERROR: app/build.gradle.kts buildTypes block nahi mila\"\n        )\n\n    app_text = app_text.replace(\n    \
        \    build_types_marker,\n        signing_block + build_types_marker,\n        1,\n    )\n\nrelease_signing = (\n\
        \    'signingConfig = signingConfigs.getByName(\"release\")'\n)\n\nif release_signing not in app_text:\n    debug_signing\
        \ = (\n        'signingConfig = signingConfigs.getByName(\"debug\")'\n    )\n\n    if debug_signing in app_text:\n\
        \        app_text = app_text.replace(\n            debug_signing,\n            release_signing,\n            1,\n\
        \        )\n    else:\n        app_text, count = re.subn(\n            r'(?m)^(\\s*)release\\s*\\{\\s*$',\n      \
        \      lambda m: (\n                f'{m.group(1)}release {{\\n'\n                f'{m.group(1)}    {release_signing}'\n\
        \            ),\n            app_text,\n            count=1,\n        )\n\n        if count != 1:\n            raise\
        \ SystemExit(\n                \"ERROR: release buildType patch nahi hua\"\n            )\n\napp_gradle.write_text(\n\
        \    app_text,\n    encoding=\"utf-8\",\n)\n\nprint(\"Firebase package verified:\", expected_package)\nprint(\"Google\
        \ Services Gradle plugin configured.\")\nprint(\"Permanent release signing configured.\")\nPY\n\nEXPECTED_SHA1=\"\
        76:24:14:31:E2:A8:21:D7:56:64:A6:12:24:46:EB:50:6F:CA:D0:1B\"\n\nACTUAL_SHA1=\"$(\n  keytool -list -v \\\n    -keystore\
        \ android/app/saarthi-release.jks \\\n    -alias saarthi \\\n    -storepass \"$ANDROID_KEYSTORE_PASSWORD\" \\\n  \
        \  | sed -n 's/^[[:space:]]*SHA1: //p' \\\n    | head -n 1\n)\"\n\nif [ \"$ACTUAL_SHA1\" != \"$EXPECTED_SHA1\" ];\
        \ then\n  echo \"::error::Signing key SHA-1 mismatch.\"\n  echo \"Expected: $EXPECTED_SHA1\"\n  echo \"Actual:   $ACTUAL_SHA1\"\
        \n  exit 1\nfi\n\necho \"Permanent signing SHA-1 verified: $ACTUAL_SHA1\"\n\necho \"\"\necho \"===== FIREBASE / SIGNING\
        \ CHECK =====\"\ngrep -n \\\n  'com.google.gms.google-services' \\\n  android/settings.gradle.kts \\\n  android/app/build.gradle.kts\n\
        \ngrep -n \\\n  'signingConfig = signingConfigs.getByName(\"release\")' \\\n  android/app/build.gradle.kts\n\ntest\
        \ -s android/app/google-services.json\ntest -s android/app/saarthi-release.jks\n"
    - name: Ensure Android Permissions
      shell: bash
      run: "python3 <<'PY'\nfrom pathlib import Path\n\nmanifest = Path(\"android/app/src/main/AndroidManifest.xml\")\n\n\
        if not manifest.exists():\n    raise SystemExit(\"ERROR: AndroidManifest.xml nahi mila\")\n\ntext = manifest.read_text(\n\
        \    encoding=\"utf-8\",\n    errors=\"ignore\",\n)\n\nadditions = []\n\nfor permission in [\"ACCESS_FINE_LOCATION\"\
        , \"ACCESS_COARSE_LOCATION\"]:\n    if \"android.permission.\" + permission not in text:\n        additions.append('<uses-permission\
        \ android:name=\"android.permission.' + permission + '\" />')\n\nif 'android.permission.INTERNET' not in text:\n \
        \   additions.append(\n        '    <uses-permission android:name=\"android.permission.INTERNET\" />'\n    )\n\nif\
        \ 'android.permission.CAMERA' not in text:\n    additions.append(\n        '    <uses-permission android:name=\"android.permission.CAMERA\"\
        \ />'\n    )\n\nif 'android.permission.POST_NOTIFICATIONS' not in text:\n    additions.append(\n        '    <uses-permission\
        \ android:name=\"android.permission.POST_NOTIFICATIONS\" />'\n    )\n\nif 'android.permission.REQUEST_INSTALL_PACKAGES'\
        \ not in text:\n    additions.append(\n        '    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\"\
        \ />'\n    )\n\nif 'android.hardware.camera.any' not in text:\n    additions.append(\n        '    <uses-feature android:name=\"\
        android.hardware.camera.any\" android:required=\"false\" />'\n    )\n\nif additions:\n    manifest_end = text.find('>')\n\
        \n    if manifest_end == -1:\n        raise SystemExit(\"ERROR: Invalid AndroidManifest.xml\")\n\n    text = (\n \
        \       text[:manifest_end + 1]\n        + \"\\n\"\n        + \"\\n\".join(additions)\n        + \"\\n\"\n       \
        \ + text[manifest_end + 1:]\n    )\n\n# mobile_scanner 5.1.1 + Android Impeller can show a\n# black/error camera preview\
        \ on some Android devices.\n# Disable Impeller only for this Android APK build.\nimpeller_meta = (\n    '        <meta-data\
        \ '\n    'android:name=\"io.flutter.embedding.android.EnableImpeller\" '\n    'android:value=\"false\" />'\n)\n\n\
        if 'io.flutter.embedding.android.EnableImpeller' not in text:\n    app_start = text.find('<application')\n\n    if\
        \ app_start == -1:\n        raise SystemExit(\n            \"ERROR: AndroidManifest.xml me <application> tag nahi\
        \ mila\"\n        )\n\n    app_tag_end = text.find('>', app_start)\n\n    if app_tag_end == -1:\n        raise SystemExit(\n\
        \            \"ERROR: AndroidManifest.xml ka <application> tag invalid hai\"\n        )\n\n    insert_at = app_tag_end\
        \ + 1\n    text = (\n        text[:insert_at]\n        + \"\\n\"\n        + impeller_meta\n        + text[insert_at:]\n\
        \    )\n\nmanifest.write_text(\n    text,\n    encoding=\"utf-8\",\n)\n\nprint(\"===== ANDROID MANIFEST =====\")\n\
        final_manifest = manifest.read_text(\n    encoding=\"utf-8\",\n    errors=\"ignore\",\n)\n\nprint(final_manifest)\n\
        \nif 'io.flutter.embedding.android.EnableImpeller' not in final_manifest:\n    raise SystemExit(\"ERROR: Impeller\
        \ disable flag missing\")\n\nprint(\"Android scanner fix: Impeller disabled.\")\nPY\n"
    - name: Clean Project
      run: flutter clean
    - name: Install Flutter Dependencies
      run: flutter pub get
    - name: Upgrade Android Mobile Scanner
      shell: bash
      run: "set -euo pipefail\n\necho \"Upgrading Android runner copy to mobile_scanner 7.3.0...\"\nflutter pub add \"mobile_scanner:7.3.0\"\
        \nflutter pub get\n\n# Use the Google Play Services ML Kit barcode model on Android.\n# This is an official mobile_scanner\
        \ Android option.\ntouch android/gradle.properties\nif grep -q '^dev\\.steenbakker\\.mobile_scanner\\.useUnbundled='\
        \ android/gradle.properties; then\n  sed -i \\\n    's/^dev\\.steenbakker\\.mobile_scanner\\.useUnbundled=.*/dev.steenbakker.mobile_scanner.useUnbundled=true/'\
        \ \\\n    android/gradle.properties\nelse\n  echo 'dev.steenbakker.mobile_scanner.useUnbundled=true' \\\n    >> android/gradle.properties\n\
        fi\n\n# GitHub Actions/Gradle file watcher can occasionally throw\n# \"Already watching path: .../android\". Disable\
        \ VFS watching\n# only for the CI runner; repository source is unchanged.\nif grep -q '^org\\.gradle\\.vfs\\.watch='\
        \ android/gradle.properties; then\n  sed -i \\\n    's/^org\\.gradle\\.vfs\\.watch=.*/org.gradle.vfs.watch=false/'\
        \ \\\n    android/gradle.properties\nelse\n  echo 'org.gradle.vfs.watch=false' >> android/gradle.properties\nfi\n\n\
        echo \"\"\necho \"===== MOBILE SCANNER VERSION =====\"\n\nflutter pub deps > /tmp/saarthi-pub-deps.txt\ngrep \"mobile_scanner\"\
        \ /tmp/saarthi-pub-deps.txt || true\n\nif ! grep -q \"mobile_scanner 7.3.0\" /tmp/saarthi-pub-deps.txt; then\n  echo\
        \ \"::error::mobile_scanner 7.3.0 resolve nahi hua.\"\n  exit 1\nfi\n\necho \"\"\necho \"===== MOBILE SCANNER ANDROID\
        \ MODE =====\"\ngrep \"dev.steenbakker.mobile_scanner.useUnbundled\" \\\n  android/gradle.properties\n\necho \"OK\
        \ - Android mobile_scanner 7.3.0 active.\"\n"
    - name: Fix Plugin Compile SDK
      shell: bash
      run: "echo \"Fixing existing Android plugin compileSdk to 36...\"\n\npython3 <<'PY'\nfrom pathlib import Path\nimport\
        \ re\n\npub_cache = Path.home() / \".pub-cache\" / \"hosted\" / \"pub.dev\"\n\npackage_patterns = [\n    \"agora_rtc_engine-*\"\
        ,\n    \"iris_method_channel-*\",\n    \"printing-*\",\n    \"mobile_scanner-*\",\n    \"flutter_contacts-*\",\n \
        \   \"permission_handler_android-*\",\n    \"url_launcher_android-*\",\n    \"flutter_plugin_android_lifecycle-*\"\
        ,\n]\n\nfound_packages = 0\npatched_files = 0\n\nfor package_pattern in package_patterns:\n    packages = list(pub_cache.glob(package_pattern))\n\
        \n    if not packages:\n        print(f\"WARNING: {package_pattern} nahi mila\")\n        continue\n\n    for package\
        \ in packages:\n        found_packages += 1\n\n        print(\"\")\n        print(\"====================================\"\
        )\n        print(\"PACKAGE:\", package)\n        print(\"====================================\")\n\n        android_dir\
        \ = package / \"android\"\n\n        if not android_dir.exists():\n            print(\"Android folder nahi hai - skip\"\
        )\n            continue\n\n        gradle_files = list(android_dir.rglob(\"*.gradle\"))\n        gradle_files += list(android_dir.rglob(\"\
        *.gradle.kts\"))\n\n        for file in gradle_files:\n            text = file.read_text(\n                encoding=\"\
        utf-8\",\n                errors=\"ignore\",\n            )\n\n            original = text\n\n            if file.name.endswith(\"\
        .gradle.kts\"):\n                text = re.sub(\n                    r'(?m)^(\\s*)compileSdk\\s*=.*$',\n         \
        \           r'\\1compileSdk = 36',\n                    text,\n                )\n                text = re.sub(\n\
        \                    r'(?m)^(\\s*)compileSdkVersion\\s*=.*$',\n                    r'\\1compileSdk = 36',\n      \
        \              text,\n                )\n            else:\n                text = re.sub(\n                    r'(?m)^(\\\
        s*)compileSdkVersion\\s+.*$',\n                    r'\\1compileSdkVersion 36',\n                    text,\n      \
        \          )\n                text = re.sub(\n                    r'(?m)^(\\s*)compileSdk\\s*(?:=\\s*)?.*$',\n   \
        \                 r'\\1compileSdkVersion 36',\n                    text,\n                )\n\n            if text\
        \ != original:\n                file.write_text(\n                    text,\n                    encoding=\"utf-8\"\
        ,\n                )\n                patched_files += 1\n                print(\"PATCHED:\", file)\n\nprint(\"\"\
        )\nprint(\"Found packages:\", found_packages)\nprint(\"Patched Gradle files:\", patched_files)\n\nif found_packages\
        \ == 0:\n    raise SystemExit(\n        \"ERROR: Android plugin packages nahi mile\"\n    )\nPY\n\necho \"\"\necho\
        \ \"===== AGORA AFTER PATCH =====\"\nfind \"$HOME/.pub-cache/hosted/pub.dev\" \\\n  -maxdepth 1 \\\n  -type d \\\n\
        \  -name \"agora_rtc_engine-*\" \\\n  -exec grep -R -n \"compileSdk\" {}/android \\; \\\n  2>/dev/null || true\n\n\
        echo \"\"\necho \"===== IRIS AFTER PATCH =====\"\nfind \"$HOME/.pub-cache/hosted/pub.dev\" \\\n  -maxdepth 1 \\\n\
        \  -type d \\\n  -name \"iris_method_channel-*\" \\\n  -exec grep -R -n \"compileSdk\" {}/android \\; \\\n  2>/dev/null\
        \ || true\n\necho \"\"\necho \"===== PRINTING AFTER PATCH =====\"\nfind \"$HOME/.pub-cache/hosted/pub.dev\" \\\n \
        \ -maxdepth 1 \\\n  -type d \\\n  -name \"printing-*\" \\\n  -exec grep -R -n \"compileSdk\" {}/android \\; \\\n \
        \ 2>/dev/null || true\n\necho \"\"\necho \"Existing plugin compileSdk 36 patch completed.\"\n"
    - name: Verify Android Configuration
      shell: bash
      run: "echo \"===== APP COMPILE SDK =====\"\ngrep -R -n \"compileSdk\" android/app 2>/dev/null || true\n\necho \"\"\n\
        echo \"===== CAMERA PERMISSION =====\"\ngrep -R -n \"android.permission.CAMERA\" \\\n  android/app/src/main/AndroidManifest.xml\n\
        \necho \"\"\necho \"===== INTERNET PERMISSION =====\"\ngrep -R -n \"android.permission.INTERNET\" \\\n  android/app/src/main/AndroidManifest.xml\n"
    - name: Flutter Doctor
      run: flutter doctor -v
    - name: Force Android Compile SDK 36
      shell: bash
      run: "set -euo pipefail\n\necho \"Patching app + Android plugin modules to compileSdk 36...\"\n\npython3 <<'PY'\nfrom\
        \ pathlib import Path\nimport re\n\nAPP_SDK = \"36\"\n\ndef patch_gradle_file(path: Path) -> bool:\n    text = path.read_text(encoding=\"\
        utf-8\", errors=\"ignore\")\n    original = text\n\n    if path.name.endswith(\".gradle.kts\"):\n        text = re.sub(\n\
        \            r'(?m)^(\\s*)compileSdk\\s*=.*$',\n            rf'\\1compileSdk = {APP_SDK}',\n            text,\n  \
        \      )\n        text = re.sub(\n            r'(?m)^(\\s*)compileSdkVersion\\s*=.*$',\n            rf'\\1compileSdk\
        \ = {APP_SDK}',\n            text,\n        )\n    else:\n        text = re.sub(\n            r'(?m)^(\\s*)compileSdkVersion\\\
        s+.*$',\n            rf'\\1compileSdkVersion {APP_SDK}',\n            text,\n        )\n        text = re.sub(\n \
        \           r'(?m)^(\\s*)compileSdk\\s*(?:=\\s*)?.*$',\n            rf'\\1compileSdkVersion {APP_SDK}',\n        \
        \    text,\n        )\n\n    if text != original:\n        path.write_text(text, encoding=\"utf-8\")\n        return\
        \ True\n\n    return False\n\n# Main Android app must compile against 36 too.\napp_candidates = [\n    Path(\"android/app/build.gradle.kts\"\
        ),\n    Path(\"android/app/build.gradle\"),\n]\n\napp_patched = False\nfor app_file in app_candidates:\n    if app_file.exists():\n\
        \        changed = patch_gradle_file(app_file)\n        app_patched = app_patched or changed\n        print(\"APP:\"\
        , app_file, \"patched=\", changed)\n\npub_cache = Path.home() / \".pub-cache\" / \"hosted\" / \"pub.dev\"\n\n# These\
        \ are the Android plugins used by this project or pulled in\n# by the Android-only helper packages. file_picker is\
        \ the module\n# that triggered the current AAR metadata failure.\npatterns = [\n    \"file_picker-*\",\n    \"flutter_plugin_android_lifecycle-*\"\
        ,\n    \"mobile_scanner-*\",\n    \"flutter_contacts-*\",\n    \"permission_handler_android-*\",\n    \"url_launcher_android-*\"\
        ,\n    \"agora_rtc_engine-*\",\n    \"iris_method_channel-*\",\n    \"printing-*\",\n]\n\nseen = set()\npatched =\
        \ []\n\nfor pattern in patterns:\n    for package in pub_cache.glob(pattern):\n        if package in seen:\n     \
        \       continue\n        seen.add(package)\n\n        android_dir = package / \"android\"\n        if not android_dir.exists():\n\
        \            continue\n\n        for gradle_file in list(android_dir.rglob(\"*.gradle\")) + \\\n                list(android_dir.rglob(\"\
        *.gradle.kts\")):\n            if patch_gradle_file(gradle_file):\n                patched.append(str(gradle_file))\n\
        \nprint(\"Patched plugin Gradle files:\", len(patched))\nfor item in patched:\n    print(\"PATCHED:\", item)\n\n#\
        \ file_picker must exist because Android source uses it.\nfile_picker_dirs = list(pub_cache.glob(\"file_picker-8.0.7\"\
        ))\nif not file_picker_dirs:\n    raise SystemExit(\"ERROR: file_picker 8.0.7 package not found\")\nPY\n\n# Keep Gradle\
        \ VFS watcher off in CI to avoid the intermittent\n# \"Already watching path\" exception seen in the previous run.\n\
        touch android/gradle.properties\nif grep -q '^org\\.gradle\\.vfs\\.watch=' android/gradle.properties; then\n  sed\
        \ -i \\\n    's/^org\\.gradle\\.vfs\\.watch=.*/org.gradle.vfs.watch=false/' \\\n    android/gradle.properties\nelse\n\
        \  echo 'org.gradle.vfs.watch=false' >> android/gradle.properties\nfi\n\necho \"\"\necho \"===== FINAL APP COMPILE\
        \ SDK =====\"\ngrep -R -n \"compileSdk\" android/app 2>/dev/null || true\n\necho \"\"\necho \"===== FINAL FILE_PICKER\
        \ COMPILE SDK =====\"\nfind \"$HOME/.pub-cache/hosted/pub.dev\" \\\n  -maxdepth 1 \\\n  -type d \\\n  -name \"file_picker-8.0.7\"\
        \ \\\n  -exec grep -R -n \"compileSdk\" {}/android \\; \\\n  2>/dev/null || true\n\necho \"\"\necho \"===== GRADLE\
        \ CI PROPERTIES =====\"\ngrep -E \\\n  'org.gradle.vfs.watch|dev.steenbakker.mobile_scanner.useUnbundled' \\\n  android/gradle.properties\
        \ || true\n"
    - name: Analyze dedicated Android source
      run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main_android.dart lib/mobile/school_session.dart
    - name: Build Vidya Saarthi Release APK
      shell: bash
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
      run: "flutter build apk -t lib/main_android.dart \\\n  --release \\\n    --dart-define=APP_VERSION=1.0.${{ github.run_number\
        \ }} \\\n    --dart-define=APP_BUILD=${{ github.run_number }} \\\n  --build-name=\"1.0.${{ github.run_number }}\"\
        \ \\\n  --build-number=\"${{ github.run_number }}\" \\\n  --dart-define=APP_PLATFORM=\"android\" \\\n  --dart-define=APP_VERSION_CODE=\"\
        ${{ github.run_number }}\" \\\n  --dart-define=APP_VERSION_NAME=\"1.0.${{ github.run_number }}\"\n"
    - name: Verify APK
      shell: bash
      run: "if [ ! -f \"build/app/outputs/flutter-apk/app-release.apk\" ]; then\n  echo \"::error::app-release.apk nahi mila!\"\
        \n  exit 1\nfi\n\nls -lh build/app/outputs/flutter-apk/app-release.apk\n"
    - name: Prepare Final APK
      shell: bash
      run: "mkdir -p release\n\ncp \\\n  build/app/outputs/flutter-apk/app-release.apk \\\n  release/Vidya-Saarthi-v1.0.${{\
        \ github.run_number }}.apk\n\necho \"\"\necho \"=========================================\"\necho \"       VIDYA SAARTHI\
        \ APK READY\"\necho \"=========================================\"\necho \"\"\n\nls -lh release/\n\necho \"\"\necho\
        \ \"APK SHA256:\"\nsha256sum \\\n  release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk\n"
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-v1.0.${{ github.run_number }}
        name: Vidya Saarthi v1.0.${{ github.run_number }}
        make_latest: true
        generate_release_notes: true
        files: release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk
    - name: Publish App Update Metadata
      shell: bash
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        VERSION_CODE: ${{ github.run_number }}
        VERSION_NAME: 1.0.${{ github.run_number }}
        RELEASE_TAG: android-v1.0.${{ github.run_number }}
        APK_FILE: Vidya-Saarthi-v1.0.${{ github.run_number }}.apk
      run: "set -euo pipefail\n\nif [ -z \"$FIREBASE_SERVICE_ACCOUNT\" ]; then\n  echo \"::error::FIREBASE_SERVICE_ACCOUNT\
        \ secret missing.\"\n  exit 1\nfi\n\nmkdir -p \"$RUNNER_TEMP/vidya-update-admin\"\ncd \"$RUNNER_TEMP/vidya-update-admin\"\
        \nnpm init -y >/dev/null 2>&1\nnpm install firebase-admin@14.4.0 >/dev/null\n\ncat > publish-update.cjs <<'NODE'\n\
        const { initializeApp, cert } =\n  require('firebase-admin/app');\nconst { getFirestore, FieldValue } =\n  require('firebase-admin/firestore');\n\
        const { execSync } = require('child_process');\n\nconst serviceAccount = JSON.parse(\n  process.env.FIREBASE_SERVICE_ACCOUNT\n\
        );\n\ninitializeApp({\n  credential: cert(serviceAccount),\n});\n\nconst db = getFirestore();\n\nconst repo = process.env.GITHUB_REPOSITORY;\n\
        const tag = process.env.RELEASE_TAG;\nconst apkFile = process.env.APK_FILE;\nconst versionCode = Number(process.env.VERSION_CODE);\n\
        const versionName = process.env.VERSION_NAME;\nconst apkUrl =\n  `https://github.com/${repo}/releases/download/${tag}/${apkFile}`;\n\
        \nlet commitMessage =\n  'Latest Vidya Saarthi improvements and fixes.';\n\ntry {\n  commitMessage = execSync(\n \
        \   'git -C \"$GITHUB_WORKSPACE\" log -1 --pretty=%s',\n    {\n      env: process.env,\n      encoding: 'utf8',\n\
        \      shell: '/bin/bash',\n    },\n  ).trim() || commitMessage;\n} catch (_) {}\n\nasync function main() {\n  await\
        \ db\n    .collection('app_config')\n    .doc('android_update')\n    .set({\n      versionCode,\n      versionName,\n\
        \      apkUrl,\n      whatsNew: [commitMessage],\n      mandatory: false,\n      releaseTag: tag,\n      githubRepository:\
        \ repo,\n      publishedAt:\n        FieldValue.serverTimestamp(),\n    }, { merge: true });\n\n  console.log(\n \
        \   'Firestore Android update metadata published.'\n  );\n  console.log(\n    'Version:',\n    versionName,\n    '('\
        \ + versionCode + ')',\n  );\n  console.log('APK:', apkUrl);\n}\n\nmain()\n  .then(() => process.exit(0))\n  .catch((error)\
        \ => {\n    console.error(error);\n    process.exit(1);\n  });\nNODE\n\nnode publish-update.cjs\n"
    - name: Create Build Summary
      shell: bash
      run: "APK_SIZE=$(du -h \\\n  release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk \\\n  | cut -f1)\n\necho \"# \U0001F4F1\
        \ Vidya Saarthi Android\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\u2705 APK Build\
        \ Successful\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\necho \"### Build Information\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Build: **#${{ github.run_number }}**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\
        - Branch: **${{ github.ref_name }}**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"- APK Size: **$APK_SIZE**\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"- Android SDK: **36**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Java: **17**\" >> \"$GITHUB_STEP_SUMMARY\"\n\
        echo \"- Camera Scanner: **Enabled**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Build Type: **Release**\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"- Firebase Android: **Configured**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Signing: **Permanent release key**\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\necho \"APK Artifact + GitHub Release dono\
        \ me publish hoga.\" \\\n  >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload Vidya Saarthi APK
      uses: actions/upload-artifact@v4
      with:
        name: Vidya-Saarthi-APK-${{ github.run_number }}
        path: release/*.apk
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Cleanup Signing Files
      if: always()
      shell: bash
      run: "rm -f \\\n  android/app/saarthi-release.jks \\\n  android/app/saarthi-release.jks.enc \\\n  android/app/google-services.json\n"
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
