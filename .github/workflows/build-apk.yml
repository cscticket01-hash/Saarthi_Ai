name: Build Vidya Saarthi Android APK
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
    - name: Install Android SDK 36
      shell: bash
      run: |
        yes | sdkmanager --licenses >/dev/null || true

        sdkmanager \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0"
    - name: Show Build Environment
      shell: bash
      run: |
        flutter --version
        dart --version
        java -version
        echo "ANDROID_HOME=$ANDROID_HOME"
    - name: Configure Android Project
      shell: bash
      run: |
        flutter config --enable-android

        if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
          echo "Android project missing. Creating..."
          flutter create \
            --platforms=android \
            --android-language=java \
            --no-pub \
            .
        else
          echo "Existing Android project found."
          echo "Existing Android configuration preserve kiya jayega."
        fi
    - name: Configure Firebase and Permanent Signing
      shell: bash
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        ANDROID_KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENCRYPTED_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail

        if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret missing."
          exit 1
        fi


        if [ -z "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" ]; then
          echo "::error::ANDROID_KEYSTORE_ENCRYPTED_BASE64 secret missing."
          exit 1
        fi

        if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
          echo "::error::ANDROID_KEYSTORE_PASSWORD secret missing."
          exit 1
        fi

        echo "Restoring Firebase Android configuration..."
        printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
          | base64 --decode \
          > android/app/google-services.json

        echo "Restoring permanent encrypted signing key..."
        printf '%s' "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" \
          | base64 --decode \
          > android/app/saarthi-release.jks.enc

        openssl enc \
          -d \
          -aes-256-cbc \
          -pbkdf2 \
          -iter 200000 \
          -in android/app/saarthi-release.jks.enc \
          -out android/app/saarthi-release.jks \
          -pass env:ANDROID_KEYSTORE_PASSWORD

        rm -f android/app/saarthi-release.jks.enc
        chmod 600 android/app/saarthi-release.jks

        python3 <<'PY'
        from pathlib import Path
        import json
        import re

        expected_package = "com.example.saarthi_ai"

        google_json = Path("android/app/google-services.json")
        settings = Path("android/settings.gradle.kts")
        app_gradle = Path("android/app/build.gradle.kts")

        for path in (google_json, settings, app_gradle):
            if not path.exists():
                raise SystemExit(f"ERROR: Required file missing: {path}")

        data = json.loads(google_json.read_text(encoding="utf-8"))

        clients = data.get("client", [])
        matched = [
            client for client in clients
            if client.get("client_info", {})
                .get("android_client_info", {})
                .get("package_name") == expected_package
        ]

        if not matched:
            raise SystemExit(
                "ERROR: google-services.json package name "
                f"{expected_package} se match nahi karta"
            )

        settings_text = settings.read_text(
            encoding="utf-8",
            errors="ignore",
        )

        google_plugin_decl = (
            '    id("com.google.gms.google-services") '
            'version "4.4.4" apply false'
        )

        if 'id("com.google.gms.google-services")' not in settings_text:
            settings_text, count = re.subn(
                r'(?m)^plugins\s*\{\s*$',
                "plugins {\n" + google_plugin_decl,
                settings_text,
                count=1,
            )

            if count != 1:
                raise SystemExit(
                    "ERROR: settings.gradle.kts plugins block nahi mila"
                )

            settings.write_text(
                settings_text,
                encoding="utf-8",
            )

        app_text = app_gradle.read_text(
            encoding="utf-8",
            errors="ignore",
        )

        if 'id("com.google.gms.google-services")' not in app_text:
            android_plugin = '    id("com.android.application")'
            google_plugin = '    id("com.google.gms.google-services")'

            if android_plugin in app_text:
                app_text = app_text.replace(
                    android_plugin,
                    android_plugin + "\n" + google_plugin,
                    1,
                )
            else:
                app_text, count = re.subn(
                    r'(?m)^plugins\s*\{\s*$',
                    'plugins {\n' + google_plugin,
                    app_text,
                    count=1,
                )

                if count != 1:
                    raise SystemExit(
                        "ERROR: app/build.gradle.kts plugins block nahi mila"
                    )

        if 'create("release")' not in app_text:
            signing_block = """    signingConfigs {
                create("release") {
                    storeFile = file("saarthi-release.jks")
                    storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                    keyAlias = "saarthi"
                    keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                }
            }

        """

            build_types_marker = "    buildTypes {\n"

            if build_types_marker not in app_text:
                raise SystemExit(
                    "ERROR: app/build.gradle.kts buildTypes block nahi mila"
                )

            app_text = app_text.replace(
                build_types_marker,
                signing_block + build_types_marker,
                1,
            )

        release_signing = (
            'signingConfig = signingConfigs.getByName("release")'
        )

        if release_signing not in app_text:
            debug_signing = (
                'signingConfig = signingConfigs.getByName("debug")'
            )

            if debug_signing in app_text:
                app_text = app_text.replace(
                    debug_signing,
                    release_signing,
                    1,
                )
            else:
                app_text, count = re.subn(
                    r'(?m)^(\s*)release\s*\{\s*$',
                    lambda m: (
                        f'{m.group(1)}release {{\n'
                        f'{m.group(1)}    {release_signing}'
                    ),
                    app_text,
                    count=1,
                )

                if count != 1:
                    raise SystemExit(
                        "ERROR: release buildType patch nahi hua"
                    )

        app_gradle.write_text(
            app_text,
            encoding="utf-8",
        )

        print("Firebase package verified:", expected_package)
        print("Google Services Gradle plugin configured.")
        print("Permanent release signing configured.")
        PY

        EXPECTED_SHA1="76:24:14:31:E2:A8:21:D7:56:64:A6:12:24:46:EB:50:6F:CA:D0:1B"

        ACTUAL_SHA1="$(
          keytool -list -v \
            -keystore android/app/saarthi-release.jks \
            -alias saarthi \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | sed -n 's/^[[:space:]]*SHA1: //p' \
            | head -n 1
        )"

        if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
          echo "::error::Signing key SHA-1 mismatch."
          echo "Expected: $EXPECTED_SHA1"
          echo "Actual:   $ACTUAL_SHA1"
          exit 1
        fi

        echo "Permanent signing SHA-1 verified: $ACTUAL_SHA1"

        echo ""
        echo "===== FIREBASE / SIGNING CHECK ====="
        grep -n \
          'com.google.gms.google-services' \
          android/settings.gradle.kts \
          android/app/build.gradle.kts

        grep -n \
          'signingConfig = signingConfigs.getByName("release")' \
          android/app/build.gradle.kts

        test -s android/app/google-services.json
        test -s android/app/saarthi-release.jks
    - name: Ensure Android Permissions
      shell: bash
      run: |
        python3 <<'PY'
        from pathlib import Path

        manifest = Path("android/app/src/main/AndroidManifest.xml")

        if not manifest.exists():
            raise SystemExit("ERROR: AndroidManifest.xml nahi mila")

        text = manifest.read_text(
            encoding="utf-8",
            errors="ignore",
        )

        additions = []

        for permission in ["ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION"]:
            if "android.permission." + permission not in text:
                additions.append('<uses-permission android:name="android.permission.' + permission + '" />')

        if 'android.permission.INTERNET' not in text:
            additions.append(
                '    <uses-permission android:name="android.permission.INTERNET" />'
            )

        if 'android.permission.CAMERA' not in text:
            additions.append(
                '    <uses-permission android:name="android.permission.CAMERA" />'
            )

        if 'android.permission.POST_NOTIFICATIONS' not in text:
            additions.append(
                '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
            )

        if 'android.permission.REQUEST_INSTALL_PACKAGES' not in text:
            additions.append(
                '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
            )

        if 'android.hardware.camera.any' not in text:
            additions.append(
                '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />'
            )

        if additions:
            manifest_end = text.find('>')

            if manifest_end == -1:
                raise SystemExit("ERROR: Invalid AndroidManifest.xml")

            text = (
                text[:manifest_end + 1]
                + "\n"
                + "\n".join(additions)
                + "\n"
                + text[manifest_end + 1:]
            )

        # mobile_scanner 5.1.1 + Android Impeller can show a
        # black/error camera preview on some Android devices.
        # Disable Impeller only for this Android APK build.
        impeller_meta = (
            '        <meta-data '
            'android:name="io.flutter.embedding.android.EnableImpeller" '
            'android:value="false" />'
        )

        if 'io.flutter.embedding.android.EnableImpeller' not in text:
            app_start = text.find('<application')

            if app_start == -1:
                raise SystemExit(
                    "ERROR: AndroidManifest.xml me <application> tag nahi mila"
                )

            app_tag_end = text.find('>', app_start)

            if app_tag_end == -1:
                raise SystemExit(
                    "ERROR: AndroidManifest.xml ka <application> tag invalid hai"
                )

            insert_at = app_tag_end + 1
            text = (
                text[:insert_at]
                + "\n"
                + impeller_meta
                + text[insert_at:]
            )

        manifest.write_text(
            text,
            encoding="utf-8",
        )

        print("===== ANDROID MANIFEST =====")
        final_manifest = manifest.read_text(
            encoding="utf-8",
            errors="ignore",
        )

        print(final_manifest)

        if 'io.flutter.embedding.android.EnableImpeller' not in final_manifest:
            raise SystemExit("ERROR: Impeller disable flag missing")

        print("Android scanner fix: Impeller disabled.")
        PY
    - name: Configure notification desugaring
      run: python .github/scripts/configure_android_notifications.py

    - name: Configure school-owned Firebase messaging
      run: python .github/scripts/configure_school_messaging.py
    - name: Use dedicated Android dependencies
      run: |
        python - <<'PY'
        import re
        p='pubspec.yaml'
        s=open(p).read()
        for name in ['agora_rtc_engine','flutter_contacts','google_sign_in','googleapis','google_generative_ai','image_picker','permission_handler','firebase_auth','cloud_firestore','font_awesome_flutter']:
          s=re.sub(r'^  '+name+r':[^\n]*\n','',s,flags=re.M)
        open(p,'w').write(s)
        PY
    - name: Clean Project
      run: flutter clean
    - name: Install Flutter Dependencies
      run: flutter pub get
    - name: Upgrade Android Mobile Scanner
      shell: bash
      run: |
        set -euo pipefail

        echo "Upgrading Android runner copy to mobile_scanner 7.3.0..."
        flutter pub add "mobile_scanner:7.3.0"
        flutter pub get

        # Use the Google Play Services ML Kit barcode model on Android.
        # This is an official mobile_scanner Android option.
        touch android/gradle.properties
        if grep -q '^dev\.steenbakker\.mobile_scanner\.useUnbundled=' android/gradle.properties; then
          sed -i \
            's/^dev\.steenbakker\.mobile_scanner\.useUnbundled=.*/dev.steenbakker.mobile_scanner.useUnbundled=true/' \
            android/gradle.properties
        else
          echo 'dev.steenbakker.mobile_scanner.useUnbundled=true' \
            >> android/gradle.properties
        fi

        # GitHub Actions/Gradle file watcher can occasionally throw
        # "Already watching path: .../android". Disable VFS watching
        # only for the CI runner; repository source is unchanged.
        if grep -q '^org\.gradle\.vfs\.watch=' android/gradle.properties; then
          sed -i \
            's/^org\.gradle\.vfs\.watch=.*/org.gradle.vfs.watch=false/' \
            android/gradle.properties
        else
          echo 'org.gradle.vfs.watch=false' >> android/gradle.properties
        fi

        echo ""
        echo "===== MOBILE SCANNER VERSION ====="

        flutter pub deps > /tmp/saarthi-pub-deps.txt
        grep "mobile_scanner" /tmp/saarthi-pub-deps.txt || true

        if ! grep -q "mobile_scanner 7.3.0" /tmp/saarthi-pub-deps.txt; then
          echo "::error::mobile_scanner 7.3.0 resolve nahi hua."
          exit 1
        fi

        echo ""
        echo "===== MOBILE SCANNER ANDROID MODE ====="
        grep "dev.steenbakker.mobile_scanner.useUnbundled" \
          android/gradle.properties

        echo "OK - Android mobile_scanner 7.3.0 active."
    - name: Fix Plugin Compile SDK
      shell: bash
      run: python .github/scripts/configure_android_plugins.py
    - name: Verify Android Configuration
      shell: bash
      run: |
        echo "===== APP COMPILE SDK ====="
        grep -R -n "compileSdk" android/app 2>/dev/null || true

        echo ""
        echo "===== CAMERA PERMISSION ====="
        grep -R -n "android.permission.CAMERA" \
          android/app/src/main/AndroidManifest.xml

        echo ""
        echo "===== INTERNET PERMISSION ====="
        grep -R -n "android.permission.INTERNET" \
          android/app/src/main/AndroidManifest.xml
    - name: Flutter Doctor
      run: flutter doctor -v
    - name: Force Android Compile SDK 36
      shell: bash
      run: |
        set -euo pipefail

        echo "Patching app + Android plugin modules to compileSdk 36..."

        python3 <<'PY'
        from pathlib import Path
        import re

        APP_SDK = "36"

        def patch_gradle_file(path: Path) -> bool:
            text = path.read_text(encoding="utf-8", errors="ignore")
            original = text

            if path.name.endswith(".gradle.kts"):
                text = re.sub(
                    r'(?m)^(\s*)compileSdk\s*=.*$',
                    rf'\1compileSdk = {APP_SDK}',
                    text,
                )
                text = re.sub(
                    r'(?m)^(\s*)compileSdkVersion\s*=.*$',
                    rf'\1compileSdk = {APP_SDK}',
                    text,
                )
            else:
                text = re.sub(
                    r'(?m)^(\s*)compileSdkVersion\s+.*$',
                    rf'\1compileSdkVersion {APP_SDK}',
                    text,
                )
                text = re.sub(
                    r'(?m)^(\s*)compileSdk\s*(?:=\s*)?.*$',
                    rf'\1compileSdkVersion {APP_SDK}',
                    text,
                )

            if text != original:
                path.write_text(text, encoding="utf-8")
                return True

            return False

        # Main Android app must compile against 36 too.
        app_candidates = [
            Path("android/app/build.gradle.kts"),
            Path("android/app/build.gradle"),
        ]

        app_patched = False
        for app_file in app_candidates:
            if app_file.exists():
                changed = patch_gradle_file(app_file)
                app_patched = app_patched or changed
                print("APP:", app_file, "patched=", changed)

        pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

        # These are the Android plugins used by this project or pulled in
        # by the Android-only helper packages. file_picker is the module
        # that triggered the current AAR metadata failure.
        patterns = [
            "file_picker-*",
            "flutter_plugin_android_lifecycle-*",
            "mobile_scanner-*",
            "flutter_contacts-*",
            "permission_handler_android-*",
            "url_launcher_android-*",
            "agora_rtc_engine-*",
            "iris_method_channel-*",
            "printing-*",
        ]

        seen = set()
        patched = []

        for pattern in patterns:
            for package in pub_cache.glob(pattern):
                if package in seen:
                    continue
                seen.add(package)

                android_dir = package / "android"
                if not android_dir.exists():
                    continue

                for gradle_file in list(android_dir.rglob("*.gradle")) + \
                        list(android_dir.rglob("*.gradle.kts")):
                    if patch_gradle_file(gradle_file):
                        patched.append(str(gradle_file))

        print("Patched plugin Gradle files:", len(patched))
        for item in patched:
            print("PATCHED:", item)

        # The universal Android entry point does not use file_picker.
        # Patch a cached legacy package if present, without requiring it.
        PY

        # Keep Gradle VFS watcher off in CI to avoid the intermittent
        # "Already watching path" exception seen in the previous run.
        touch android/gradle.properties
        if grep -q '^org\.gradle\.vfs\.watch=' android/gradle.properties; then
          sed -i \
            's/^org\.gradle\.vfs\.watch=.*/org.gradle.vfs.watch=false/' \
            android/gradle.properties
        else
          echo 'org.gradle.vfs.watch=false' >> android/gradle.properties
        fi

        echo ""
        echo "===== FINAL APP COMPILE SDK ====="
        grep -R -n "compileSdk" android/app 2>/dev/null || true

        echo ""
        echo "===== FINAL FILE_PICKER COMPILE SDK ====="
        find "$HOME/.pub-cache/hosted/pub.dev" \
          -maxdepth 1 \
          -type d \
          -name "file_picker-8.0.7" \
          -exec grep -R -n "compileSdk" {}/android \; \
          2>/dev/null || true

        echo ""
        echo "===== GRADLE CI PROPERTIES ====="
        grep -E \
          'org.gradle.vfs.watch|dev.steenbakker.mobile_scanner.useUnbundled' \
          android/gradle.properties || true
    - name: Analyze dedicated Android source
      run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main_android.dart lib/mobile/school_session.dart
    - name: Build Vidya Saarthi Release APK
      shell: bash
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
      run: |
        flutter build apk -t lib/main_android.dart \
          --release \
            --dart-define=APP_VERSION=1.0.${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }} \
          --build-name="1.0.${{ github.run_number }}" \
          --build-number="${{ github.run_number }}" \
          --dart-define=APP_PLATFORM="android" \
          --dart-define=APP_VERSION_CODE="${{ github.run_number }}" \
          --dart-define=APP_VERSION_NAME="1.0.${{ github.run_number }}"
    - name: Verify APK
      shell: bash
      run: |
        if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
          echo "::error::app-release.apk nahi mila!"
          exit 1
        fi

        ls -lh build/app/outputs/flutter-apk/app-release.apk
    - name: Prepare Final APK
      shell: bash
      run: |
        mkdir -p release

        cp \
          build/app/outputs/flutter-apk/app-release.apk \
          release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk

        echo ""
        echo "========================================="
        echo "       VIDYA SAARTHI APK READY"
        echo "========================================="
        echo ""

        ls -lh release/

        echo ""
        echo "APK SHA256:"
        sha256sum \
          release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk
    - name: Prepare static Android update manifest
      env:
        RELEASE_BUILD: ${{ github.run_number }}
      run: |
        python3 <<'PYBUILD'
        import hashlib,json,os,pathlib
        build=int(os.environ['RELEASE_BUILD'])
        version='1.0.'+str(build)
        name='Vidya-Saarthi-v'+version+'.apk'
        file=pathlib.Path('release')/name
        digest=hashlib.sha256(file.read_bytes()).hexdigest()
        data={'versionCode':build,'versionName':version,
              'apkUrl':'https://github.com/cscticket01-hash/Saarthi_Ai/releases/download/android-v'+version+'/'+name,
              'sha256':digest}
        pathlib.Path('release/android-update.json').write_text(json.dumps(data))
        PYBUILD
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-v1.0.${{ github.run_number }}
        name: Vidya Saarthi v1.0.${{ github.run_number }}
        make_latest: true
        generate_release_notes: true
        files: |
          release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk
          release/android-update.json
    - name: Publish App Update Metadata
      shell: bash
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        VERSION_CODE: ${{ github.run_number }}
        VERSION_NAME: 1.0.${{ github.run_number }}
        RELEASE_TAG: android-v1.0.${{ github.run_number }}
        APK_FILE: Vidya-Saarthi-v1.0.${{ github.run_number }}.apk
      run: |
        set -euo pipefail

        if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
          echo "::error::FIREBASE_SERVICE_ACCOUNT secret missing."
          exit 1
        fi

        mkdir -p "$RUNNER_TEMP/vidya-update-admin"
        cd "$RUNNER_TEMP/vidya-update-admin"
        npm init -y >/dev/null 2>&1
        npm install firebase-admin@14.4.0 >/dev/null

        cat > publish-update.cjs <<'NODE'
        const { initializeApp, cert } =
          require('firebase-admin/app');
        const { getFirestore, FieldValue } =
          require('firebase-admin/firestore');
        const { execSync } = require('child_process');

        const serviceAccount = JSON.parse(
          process.env.FIREBASE_SERVICE_ACCOUNT
        );

        initializeApp({
          credential: cert(serviceAccount),
        });

        const db = getFirestore();

        const repo = process.env.GITHUB_REPOSITORY;
        const tag = process.env.RELEASE_TAG;
        const apkFile = process.env.APK_FILE;
        const versionCode = Number(process.env.VERSION_CODE);
        const versionName = process.env.VERSION_NAME;
        const apkUrl =
          `https://github.com/${repo}/releases/download/${tag}/${apkFile}`;

        let commitMessage =
          'Latest Vidya Saarthi improvements and fixes.';

        try {
          commitMessage = execSync(
            'git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s',
            {
              env: process.env,
              encoding: 'utf8',
              shell: '/bin/bash',
            },
          ).trim() || commitMessage;
        } catch (_) {}

        async function main() {
          await db
            .collection('app_config')
            .doc('android_update')
            .set({
              versionCode,
              versionName,
              apkUrl,
              whatsNew: [commitMessage],
              mandatory: false,
              releaseTag: tag,
              githubRepository: repo,
              publishedAt:
                FieldValue.serverTimestamp(),
            }, { merge: true });

          console.log(
            'Firestore Android update metadata published.'
          );
          console.log(
            'Version:',
            versionName,
            '(' + versionCode + ')',
          );
          console.log('APK:', apkUrl);
        }

        main()
          .then(() => process.exit(0))
          .catch((error) => {
            console.error(error);
            process.exit(1);
          });
        NODE

        node publish-update.cjs
    - name: Create Build Summary
      shell: bash
      run: "APK_SIZE=$(du -h \\\n  release/Vidya-Saarthi-v1.0.${{ github.run_number }}.apk \\\n  | cut -f1)\n\necho \"# \U0001F4F1\
        \ Vidya Saarthi Android\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\u2705 APK Build\
        \ Successful\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\necho \"### Build Information\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Build: **#${{ github.run_number }}**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\
        - Branch: **${{ github.ref_name }}**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"- APK Size: **$APK_SIZE**\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"- Android SDK: **36**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Java: **17**\" >> \"$GITHUB_STEP_SUMMARY\"\n\
        echo \"- Camera Scanner: **Enabled**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Build Type: **Release**\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"- Firebase Android: **Configured**\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Signing: **Permanent release key**\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\necho \"APK Artifact + GitHub Release dono\
        \ me publish hoga.\" \\\n  >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload Vidya Saarthi APK
      uses: actions/upload-artifact@v4
      with:
        name: Vidya-Saarthi-APK-${{ github.run_number }}
        path: release/*.apk
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Cleanup Signing Files
      if: always()
      shell: bash
      run: |
        rm -f \
          android/app/saarthi-release.jks \
          android/app/saarthi-release.jks.enc \
          android/app/google-services.json
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
