name: Build Saarthi AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"


      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ============================================================
      # 4. SHOW VERSION
      # ============================================================
      - name: Show Build Environment
        run: |
          flutter --version
          dart --version
          java -version


      # ============================================================
      # 5. GENERATE ANDROID PROJECT
      # ============================================================
      - name: Configure Android Project
        run: |
          flutter config --enable-android
          flutter create \
            --platforms=android \
            --android-language=java \
            .


      # ============================================================
      # 6. CLEAN
      # ============================================================
      - name: Clean Project
        run: flutter clean


      # ============================================================
      # 7. GET DEPENDENCIES
      # ============================================================
      - name: Install Flutter Dependencies
        run: flutter pub get


      # ============================================================
      # ANDROID SDK TOOLS SETUP
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # INSTALL ANDROID SDK 34
      # ============================================================
      - name: Install Android SDK 34
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"


      # ============================================================
      # 9. FIX AGORA RTC ENGINE
      # Agora old package compileSdk 31 use karta hai.
      # AndroidX Fragment 1.7.1 ko SDK 34 minimum chahiye.
      # ============================================================
      - name: Fix Agora Compile SDK
        shell: bash
        run: |
          echo "Searching Agora RTC Engine..."

          AGORA_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "agora_rtc_engine-*" \
            | sort -V \
            | tail -n 1)

          if [ -z "$AGORA_DIR" ]; then
            echo "::error::Agora RTC Engine package nahi mila!"
            exit 1
          fi

          echo "Agora package found:"
          echo "$AGORA_DIR"

          GRADLE_FILE="$AGORA_DIR/android/build.gradle"
          GRADLE_KTS_FILE="$AGORA_DIR/android/build.gradle.kts"

          if [ -f "$GRADLE_FILE" ]; then
            echo "Patching build.gradle..."

            sed -i -E \
              's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 34/g' \
              "$GRADLE_FILE"

            sed -i -E \
              's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 34/g' \
              "$GRADLE_FILE"

            echo "Agora compileSdk after patch:"
            grep -n "compileSdk" "$GRADLE_FILE" || true
          fi

          if [ -f "$GRADLE_KTS_FILE" ]; then
            echo "Patching build.gradle.kts..."

            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 34/g' \
              "$GRADLE_KTS_FILE"

            echo "Agora compileSdk after patch:"
            grep -n "compileSdk" "$GRADLE_KTS_FILE" || true
          fi


      # ============================================================
      # 10. FORCE APP COMPILE SDK
      # ============================================================
      - name: Ensure App Uses SDK 34+
        shell: bash
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E \
              's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 34/g' \
              android/app/build.gradle
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 34/g' \
              android/app/build.gradle.kts
          fi

          echo "Android app SDK configuration:"
          grep -R -n "compileSdk" android/app 2>/dev/null || true


      # ============================================================
      # 11. FLUTTER DOCTOR
      # ============================================================
      - name: Flutter Doctor
        run: flutter doctor -v


      # ============================================================
      # 12. BUILD RELEASE APK
      # ============================================================
      - name: Build Saarthi AI Release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"


      # ============================================================
      # 13. PREPARE FINAL APK
      # ============================================================
      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Saarthi-AI-v${{ github.run_number }}.apk

          echo ""
          echo "========================================="
          echo "       SAARTHI AI APK READY"
          echo "========================================="
          echo ""

          ls -lh release/

          echo ""
          echo "APK SHA256:"
          sha256sum release/Saarthi-AI-v${{ github.run_number }}.apk


      # ============================================================
      # 14. BUILD SUMMARY
      # ============================================================
      - name: Create Build Summary
        shell: bash
        run: |
          APK_SIZE=$(du -h release/Saarthi-AI-v${{ github.run_number }}.apk | cut -f1)

          echo "# 📱 Saarthi AI Android" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **#${{ github.run_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: **${{ github.ref_name }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK Size: **$APK_SIZE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android Compile SDK: **34**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build Type: **Release**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK ko Artifacts section se download karein." >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 15. UPLOAD APK
      # ============================================================
      - name: Upload Saarthi AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Saarthi-AI-APK-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
