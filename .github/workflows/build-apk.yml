name: Build Saarthi AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"


      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 5. INSTALL ANDROID SDK 34
      # mobile_scanner + Agora ke liye
      # ============================================================
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"


      # ============================================================
      # 6. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show Build Environment
        run: |
          flutter --version
          dart --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"


      # ============================================================
      # 7. CONFIGURE ANDROID PROJECT
      #
      # Existing android project ko overwrite nahi karega.
      # Sirf android folder missing hua to generate karega.
      # ============================================================
      - name: Configure Android Project
        shell: bash
        run: |
          flutter config --enable-android

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android project missing. Creating..."
            flutter create \
              --platforms=android \
              --android-language=java \
              --no-pub \
              .
          else
            echo "Existing Android project found."
            echo "Existing Android configuration preserve kiya jayega."
          fi


      # ============================================================
      # 8. ENSURE CAMERA + INTERNET PERMISSIONS
      # Scanner ke liye CAMERA permission
      # Existing permissions ko delete/replace nahi karega
      # ============================================================
      - name: Ensure Android Permissions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml nahi mila")

          text = manifest.read_text(encoding="utf-8")

          additions = []

          if 'android.permission.INTERNET' not in text:
              additions.append(
                  '    <uses-permission android:name="android.permission.INTERNET" />'
              )

          if 'android.permission.CAMERA' not in text:
              additions.append(
                  '    <uses-permission android:name="android.permission.CAMERA" />'
              )

          if 'android.hardware.camera.any' not in text:
              additions.append(
                  '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />'
              )

          if additions:
              manifest_end = text.find('>')

              if manifest_end == -1:
                  raise SystemExit("Invalid AndroidManifest.xml")

              text = (
                  text[:manifest_end + 1]
                  + "\n"
                  + "\n".join(additions)
                  + "\n"
                  + text[manifest_end + 1:]
              )

              manifest.write_text(text, encoding="utf-8")

          print("===== ANDROID MANIFEST =====")
          print(manifest.read_text(encoding="utf-8"))
          PY


      # ============================================================
      # 9. CLEAN PROJECT
      # ============================================================
      - name: Clean Project
        run: flutter clean


      # ============================================================
      # 10. GET DEPENDENCIES
      # ============================================================
      - name: Install Flutter Dependencies
        run: flutter pub get


      # ============================================================
      # 11. VERIFY MOBILE SCANNER
      # pubspec me mobile_scanner missing hua to yahin fail karega
      # ============================================================
      - name: Verify Mobile Scanner
        shell: bash
        run: |
          echo "Checking mobile_scanner dependency..."

          flutter pub deps | grep "mobile_scanner"

          echo ""
          echo "mobile_scanner dependency found."


      # ============================================================
      # FIX AGORA + IRIS METHOD CHANNEL COMPILE SDK
      # ============================================================
      - name: Fix Agora And Iris Compile SDK
        shell: bash
        run: |
          echo "Fixing Agora related Android compileSdk..."

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          package_patterns = [
              "agora_rtc_engine-*",
              "iris_method_channel-*",
              "printing-*",
          ]

          found_packages = 0
          patched_files = 0

          for package_pattern in package_patterns:

              packages = list(
                  pub_cache.glob(package_pattern)
              )

              if not packages:
                  print(
                      f"WARNING: {package_pattern} nahi mila"
                  )
                  continue

              for package in packages:
                  found_packages += 1

                  print("")
                  print(
                      "===================================="
                  )
                  print("PACKAGE:", package)
                  print(
                      "===================================="
                  )

                  android_dir = package / "android"

                  if not android_dir.exists():
                      print("Android folder nahi hai - skip")
                      continue

                  gradle_files = list(
                      android_dir.rglob("*.gradle")
                  )

                  gradle_files += list(
                      android_dir.rglob("*.gradle.kts")
                  )

                  for file in gradle_files:

                      text = file.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      )

                      original = text

                      # Groovy:
                      # compileSdkVersion 31
                      text = re.sub(
                          r'(?m)^(\s*)compileSdkVersion\s+[0-9]+\s*$',
                          r'\1compileSdkVersion 34',
                          text,
                      )

                      # Groovy with expression:
                      # compileSdkVersion safeExtGet(...)
                      text = re.sub(
                          r'(?m)^(\s*)compileSdkVersion\s+.*$',
                          r'\1compileSdkVersion 34',
                          text,
                      )

                      # Groovy:
                      # compileSdk 31
                      text = re.sub(
                          r'(?m)^(\s*)compileSdk\s+[0-9]+\s*$',
                          r'\1compileSdk 34',
                          text,
                      )

                      # Groovy/KTS:
                      # compileSdk = 31
                      text = re.sub(
                          r'(?m)^(\s*)compileSdk\s*=\s*.*$',
                          r'\1compileSdk = 34',
                          text,
                      )

                      # compileSdkVersion = 31
                      text = re.sub(
                          r'(?m)^(\s*)compileSdkVersion\s*=\s*.*$',
                          r'\1compileSdkVersion 34',
                          text,
                      )

                      if text != original:

                          file.write_text(
                              text,
                              encoding="utf-8",
                          )

                          patched_files += 1

                          print(
                              "PATCHED:",
                              file,
                          )

          print("")
          print(
              "Found packages:",
              found_packages,
          )

          print(
              "Patched Gradle files:",
              patched_files,
          )

          if found_packages == 0:
              raise SystemExit(
                  "ERROR: Agora/Iris packages nahi mile"
              )
          PY

          echo ""
          echo "===== AGORA AFTER PATCH ====="

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "agora_rtc_engine-*" \
            -exec grep -R -n "compileSdk" {}/android \; \
            2>/dev/null || true

          echo ""
          echo "===== IRIS AFTER PATCH ====="

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "iris_method_channel-*" \
            -exec grep -R -n "compileSdk" {}/android \; \
            2>/dev/null || true

          echo ""
          echo "Agora + Iris SDK patch completed."
          
      # ============================================================
      # 13. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android Configuration
        shell: bash
        run: |
          echo "===== APP COMPILE SDK ====="
          grep -R -n "compileSdk" android/app 2>/dev/null || true

          echo ""
          echo "===== CAMERA PERMISSION ====="
          grep -R -n "android.permission.CAMERA" \
            android/app/src/main/AndroidManifest.xml

          echo ""
          echo "===== INTERNET PERMISSION ====="
          grep -R -n "android.permission.INTERNET" \
            android/app/src/main/AndroidManifest.xml


      # ============================================================
      # 14. FLUTTER DOCTOR
      # ============================================================
      - name: Flutter Doctor
        run: flutter doctor -v

            # ============================================================
      # ANDROID-ONLY TEMPORARY DART PATCH
      # Original GitHub Dart file bilkul unchanged rahega
      # ============================================================
      - name: Prepare Android Safe Dart Source
        shell: bash
        run: |
          echo "Preparing Android-only temporary source..."

          # Android me WhatsApp link open karne ke liye
          flutter pub add "url_launcher:^6.3.2"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/main_dashboard_screen.dart")

          if not path.exists():
              raise SystemExit(
                  "ERROR: lib/main_dashboard_screen.dart nahi mila"
              )

          text = path.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          # ========================================================
          # 1. REMOVE dart:html IMPORT
          # ========================================================
          text = re.sub(
              r"(?m)^\s*import\s+'dart:html'\s+as\s+html;\s*\n?",
              "",
              text,
          )

          # ========================================================
          # 2. ADD url_launcher IMPORT
          # ========================================================
          launcher_import = (
              "import 'package:url_launcher/url_launcher.dart';\n"
          )

          if launcher_import not in text:

              mobile_import = (
                  "import 'package:mobile_scanner/mobile_scanner.dart';\n"
              )

              qr_import = (
                  "import 'package:qr_flutter/qr_flutter.dart';\n"
              )

              if mobile_import in text:
                  text = text.replace(
                      mobile_import,
                      mobile_import + launcher_import,
                      1,
                  )

              elif qr_import in text:
                  text = text.replace(
                      qr_import,
                      qr_import + launcher_import,
                      1,
                  )

              else:
                  raise SystemExit(
                      "ERROR: url_launcher import add karne ki jagah nahi mili"
                  )

          # ========================================================
          # 3. SCANNER MOBILE DETECTION
          #
          # Android APK build hai, isliye agar old html user-agent
          # code present hai to usko simply android bana do.
          # Agar already screenWidth wala fix laga hai to kuch nahi
          # karega.
          # ========================================================
          old_user_agent = (
              "html.window.navigator.userAgent.toLowerCase()"
          )

          if old_user_agent in text:
              text = text.replace(
                  old_user_agent,
                  "'android'",
              )

              print(
                  "Scanner user-agent Android ke liye patched."
              )
          else:
              print(
                  "Scanner html user-agent code present nahi hai - skip."
              )

          # ========================================================
          # 4. WEB PDF DOWNLOAD -> ANDROID PDF SHARE
          # ========================================================
          pdf_start_marker = "final blob = html.Blob("
          pdf_end_marker = "html.Url.revokeObjectUrl(url);"

          pdf_start = text.find(pdf_start_marker)

          if pdf_start != -1:

              pdf_end = text.find(
                  pdf_end_marker,
                  pdf_start,
              )

              if pdf_end == -1:
                  raise SystemExit(
                      "ERROR: PDF html block ka end nahi mila"
                  )

              pdf_end += len(pdf_end_marker)

              pdf_replacement = """await Printing.sharePdf(
              bytes: pdfBytes,
              filename:
                  'SVN_ID_Card_${safeName}_Roll_$roll.pdf',
            );"""

              text = (
                  text[:pdf_start]
                  + pdf_replacement
                  + text[pdf_end:]
              )

              print(
                  "PDF download Android share me patched."
              )

          else:
              print(
                  "HTML PDF download block present nahi hai - skip."
              )

          # ========================================================
          # 5. WHATSAPP WEB OPEN -> ANDROID EXTERNAL APP
          # ========================================================
          whatsapp_pattern = re.compile(
              r"html\.window\.open\(\s*"
              r"'https://wa\.me/\$waNum'\s*,\s*"
              r"'_blank'\s*\);"
          )

          whatsapp_replacement = """launchUrl(
                                        Uri.parse(
                                          'https://wa.me/$waNum',
                                        ),
                                        mode: LaunchMode.externalApplication,
                                      );"""

          text, whatsapp_count = whatsapp_pattern.subn(
              whatsapp_replacement,
              text,
              count=1,
          )

          if whatsapp_count == 1:
              print(
                  "WhatsApp Android launcher patched."
              )
          else:
              print(
                  "WhatsApp html.window.open present nahi hai - skip."
              )

          # ========================================================
          # SAVE ONLY INSIDE GITHUB RUNNER
          # ========================================================
          path.write_text(
              text,
              encoding="utf-8",
          )

          print("")
          print(
              "Android temporary Dart source created successfully."
          )
          PY

          echo ""
          echo "========================================="
          echo "CHECKING ANDROID SOURCE"
          echo "========================================="

          echo ""
          echo "Checking dart:html / html.* ..."

          if grep -nE \
            "dart:html|html\." \
            lib/main_dashboard_screen.dart; then

            echo ""
            echo "::error::Android source me html code abhi bhi present hai!"
            exit 1

          else
            echo "OK - dart:html completely removed."
          fi

          echo ""
          echo "Checking mobile_scanner..."
          grep -n \
            "mobile_scanner" \
            lib/main_dashboard_screen.dart || true

          echo ""
          echo "Checking url_launcher..."
          grep -n \
            "url_launcher" \
            lib/main_dashboard_screen.dart

          echo ""
          echo "Checking Printing.sharePdf..."
          grep -n \
            "Printing.sharePdf" \
            lib/main_dashboard_screen.dart || true

          echo ""
          echo "Android temporary source READY."

      # ============================================================
      # 15. BUILD RELEASE APK
      # ============================================================
      - name: Build Saarthi AI Release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"


      # ============================================================
      # 16. VERIFY APK EXISTS
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "::error::app-release.apk nahi mila!"
            exit 1
          fi

          ls -lh build/app/outputs/flutter-apk/app-release.apk


      # ============================================================
      # 17. PREPARE FINAL APK
      # ============================================================
      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Saarthi-AI-v${{ github.run_number }}.apk

          echo ""
          echo "========================================="
          echo "       SAARTHI AI APK READY"
          echo "========================================="
          echo ""

          ls -lh release/

          echo ""
          echo "APK SHA256:"
          sha256sum \
            release/Saarthi-AI-v${{ github.run_number }}.apk


      # ============================================================
      # 18. BUILD SUMMARY
      # ============================================================
      - name: Create Build Summary
        shell: bash
        run: |
          APK_SIZE=$(du -h \
            release/Saarthi-AI-v${{ github.run_number }}.apk \
            | cut -f1)

          echo "# 📱 Saarthi AI Android" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **#${{ github.run_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: **${{ github.ref_name }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK Size: **$APK_SIZE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: **34+**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: **17**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Camera Scanner: **Enabled**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build Type: **Release**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "APK ko Artifacts section se download karein." \
            >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 19. UPLOAD APK
      # ============================================================
      - name: Upload Saarthi AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Saarthi-AI-APK-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
