name: Build Vidya Saarthi Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 5. INSTALL ANDROID SDK 34
      # ============================================================
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ============================================================
      # 6. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show Build Environment
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # ============================================================
      # 7. CONFIGURE ANDROID PROJECT
      # Existing project ko overwrite nahi karega
      # ============================================================
      - name: Configure Android Project
        shell: bash
        run: |
          flutter config --enable-android

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android project missing. Creating..."
            flutter create \
              --platforms=android \
              --android-language=java \
              --no-pub \
              .
          else
            echo "Existing Android project found."
            echo "Existing Android configuration preserve kiya jayega."
          fi

      # ============================================================
      # 8. FIREBASE + PERMANENT RELEASE SIGNING
      # Runner-only: repository source unchanged rahega
      # ============================================================
      - name: Configure Firebase and Permanent Signing
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENCRYPTED_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret missing."
            exit 1
          fi


          if [ -z "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_ENCRYPTED_BASE64 secret missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          echo "Restoring Firebase Android configuration..."
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > android/app/google-services.json

          echo "Restoring permanent encrypted signing key..."
          printf '%s' "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" \
            | base64 --decode \
            > android/app/saarthi-release.jks.enc

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -in android/app/saarthi-release.jks.enc \
            -out android/app/saarthi-release.jks \
            -pass env:ANDROID_KEYSTORE_PASSWORD

          rm -f android/app/saarthi-release.jks.enc
          chmod 600 android/app/saarthi-release.jks

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          expected_package = "com.example.saarthi_ai"

          google_json = Path("android/app/google-services.json")
          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          for path in (google_json, settings, app_gradle):
              if not path.exists():
                  raise SystemExit(f"ERROR: Required file missing: {path}")

          data = json.loads(google_json.read_text(encoding="utf-8"))

          clients = data.get("client", [])
          matched = [
              client for client in clients
              if client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name") == expected_package
          ]

          if not matched:
              raise SystemExit(
                  "ERROR: google-services.json package name "
                  f"{expected_package} se match nahi karta"
              )

          settings_text = settings.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          google_plugin_decl = (
              '    id("com.google.gms.google-services") '
              'version "4.5.0" apply false'
          )

          if 'id("com.google.gms.google-services")' not in settings_text:
              settings_text, count = re.subn(
                  r'(?m)^plugins\s*\{\s*$',
                  "plugins {\n" + google_plugin_decl,
                  settings_text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: settings.gradle.kts plugins block nahi mila"
                  )

              settings.write_text(
                  settings_text,
                  encoding="utf-8",
              )

          app_text = app_gradle.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          if 'id("com.google.gms.google-services")' not in app_text:
              android_plugin = '    id("com.android.application")'
              google_plugin = '    id("com.google.gms.google-services")'

              if android_plugin in app_text:
                  app_text = app_text.replace(
                      android_plugin,
                      android_plugin + "\n" + google_plugin,
                      1,
                  )
              else:
                  app_text, count = re.subn(
                      r'(?m)^plugins\s*\{\s*$',
                      'plugins {\n' + google_plugin,
                      app_text,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit(
                          "ERROR: app/build.gradle.kts plugins block nahi mila"
                      )

          if 'create("release")' not in app_text:
              signing_block = """    signingConfigs {
                  create("release") {
                      storeFile = file("saarthi-release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = "saarthi"
                      keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }

          """

              build_types_marker = "    buildTypes {\n"

              if build_types_marker not in app_text:
                  raise SystemExit(
                      "ERROR: app/build.gradle.kts buildTypes block nahi mila"
                  )

              app_text = app_text.replace(
                  build_types_marker,
                  signing_block + build_types_marker,
                  1,
              )

          release_signing = (
              'signingConfig = signingConfigs.getByName("release")'
          )

          if release_signing not in app_text:
              debug_signing = (
                  'signingConfig = signingConfigs.getByName("debug")'
              )

              if debug_signing in app_text:
                  app_text = app_text.replace(
                      debug_signing,
                      release_signing,
                      1,
                  )
              else:
                  app_text, count = re.subn(
                      r'(?m)^(\s*)release\s*\{\s*$',
                      lambda m: (
                          f'{m.group(1)}release {{\n'
                          f'{m.group(1)}    {release_signing}'
                      ),
                      app_text,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit(
                          "ERROR: release buildType patch nahi hua"
                      )

          app_gradle.write_text(
              app_text,
              encoding="utf-8",
          )

          print("Firebase package verified:", expected_package)
          print("Google Services Gradle plugin configured.")
          print("Permanent release signing configured.")
          PY

          EXPECTED_SHA1="76:24:14:31:E2:A8:21:D7:56:64:A6:12:24:46:EB:50:6F:CA:D0:1B"

          ACTUAL_SHA1="$(
            keytool -list -v \
              -keystore android/app/saarthi-release.jks \
              -alias saarthi \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              | sed -n 's/^[[:space:]]*SHA1: //p' \
              | head -n 1
          )"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing key SHA-1 mismatch."
            echo "Expected: $EXPECTED_SHA1"
            echo "Actual:   $ACTUAL_SHA1"
            exit 1
          fi

          echo "Permanent signing SHA-1 verified: $ACTUAL_SHA1"

          echo ""
          echo "===== FIREBASE / SIGNING CHECK ====="
          grep -n \
            'com.google.gms.google-services' \
            android/settings.gradle.kts \
            android/app/build.gradle.kts

          grep -n \
            'signingConfig = signingConfigs.getByName("release")' \
            android/app/build.gradle.kts

          test -s android/app/google-services.json
          test -s android/app/saarthi-release.jks

      # ============================================================
      # 8. ENSURE CAMERA + INTERNET PERMISSIONS
      # ============================================================
      - name: Ensure Android Permissions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml nahi mila")

          text = manifest.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          additions = []

          if 'android.permission.INTERNET' not in text:
              additions.append(
                  '    <uses-permission android:name="android.permission.INTERNET" />'
              )

          if 'android.permission.CAMERA' not in text:
              additions.append(
                  '    <uses-permission android:name="android.permission.CAMERA" />'
              )

          if 'android.hardware.camera.any' not in text:
              additions.append(
                  '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />'
              )

          if additions:
              manifest_end = text.find('>')

              if manifest_end == -1:
                  raise SystemExit("ERROR: Invalid AndroidManifest.xml")

              text = (
                  text[:manifest_end + 1]
                  + "\n"
                  + "\n".join(additions)
                  + "\n"
                  + text[manifest_end + 1:]
              )

          # mobile_scanner 5.1.1 + Android Impeller can show a
          # black/error camera preview on some Android devices.
          # Disable Impeller only for this Android APK build.
          impeller_meta = (
              '        <meta-data '
              'android:name="io.flutter.embedding.android.EnableImpeller" '
              'android:value="false" />'
          )

          if 'io.flutter.embedding.android.EnableImpeller' not in text:
              app_start = text.find('<application')

              if app_start == -1:
                  raise SystemExit(
                      "ERROR: AndroidManifest.xml me <application> tag nahi mila"
                  )

              app_tag_end = text.find('>', app_start)

              if app_tag_end == -1:
                  raise SystemExit(
                      "ERROR: AndroidManifest.xml ka <application> tag invalid hai"
                  )

              insert_at = app_tag_end + 1
              text = (
                  text[:insert_at]
                  + "\n"
                  + impeller_meta
                  + text[insert_at:]
              )

          manifest.write_text(
              text,
              encoding="utf-8",
          )

          print("===== ANDROID MANIFEST =====")
          final_manifest = manifest.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          print(final_manifest)

          if 'io.flutter.embedding.android.EnableImpeller' not in final_manifest:
              raise SystemExit("ERROR: Impeller disable flag missing")

          print("Android scanner fix: Impeller disabled.")
          PY

      # ============================================================
      # 9. CLEAN PROJECT
      # ============================================================
      - name: Clean Project
        run: flutter clean

      # ============================================================
      # 10. GET DEPENDENCIES
      # ============================================================
      - name: Install Flutter Dependencies
        run: flutter pub get

      # ============================================================
      # 11. ANDROID-ONLY MOBILE SCANNER UPGRADE
      # Repository/web pubspec unchanged rahega. Runner copy only.
      # v7.3.0 includes newer Android camera lifecycle/resource fixes.
      # Unbundled ML Kit uses Google Play Services and avoids bundling the
      # barcode model inside this APK.
      # ============================================================
      - name: Upgrade Android Mobile Scanner
        shell: bash
        run: |
          set -euo pipefail

          echo "Upgrading Android runner copy to mobile_scanner 7.3.0..."
          flutter pub add "mobile_scanner:7.3.0"
          flutter pub get

          # Use the Google Play Services ML Kit barcode model on Android.
          # This is an official mobile_scanner Android option.
          touch android/gradle.properties
          if grep -q '^dev\.steenbakker\.mobile_scanner\.useUnbundled=' android/gradle.properties; then
            sed -i \
              's/^dev\.steenbakker\.mobile_scanner\.useUnbundled=.*/dev.steenbakker.mobile_scanner.useUnbundled=true/' \
              android/gradle.properties
          else
            echo 'dev.steenbakker.mobile_scanner.useUnbundled=true' \
              >> android/gradle.properties
          fi

          echo ""
          echo "===== MOBILE SCANNER VERSION ====="

          flutter pub deps > /tmp/saarthi-pub-deps.txt
          grep "mobile_scanner" /tmp/saarthi-pub-deps.txt || true

          if ! grep -q "mobile_scanner 7.3.0" /tmp/saarthi-pub-deps.txt; then
            echo "::error::mobile_scanner 7.3.0 resolve nahi hua."
            exit 1
          fi

          echo ""
          echo "===== MOBILE SCANNER ANDROID MODE ====="
          grep "dev.steenbakker.mobile_scanner.useUnbundled" \
            android/gradle.properties

          echo "OK - Android mobile_scanner 7.3.0 active."

      # ============================================================
      # 12. FIX OLD PLUGIN COMPILE SDK
      # Agora + Iris + Printing runner-only patch
      # ============================================================
      - name: Fix Plugin Compile SDK
        shell: bash
        run: |
          echo "Fixing Android plugin compileSdk..."

          python3 <<'PY'
          from pathlib import Path
          import re

          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          package_patterns = [
              "agora_rtc_engine-*",
              "iris_method_channel-*",
              "printing-*",
          ]

          found_packages = 0
          patched_files = 0

          for package_pattern in package_patterns:
              packages = list(pub_cache.glob(package_pattern))

              if not packages:
                  print(f"WARNING: {package_pattern} nahi mila")
                  continue

              for package in packages:
                  found_packages += 1

                  print("")
                  print("====================================")
                  print("PACKAGE:", package)
                  print("====================================")

                  android_dir = package / "android"

                  if not android_dir.exists():
                      print("Android folder nahi hai - skip")
                      continue

                  gradle_files = list(android_dir.rglob("*.gradle"))
                  gradle_files += list(android_dir.rglob("*.gradle.kts"))

                  for file in gradle_files:
                      text = file.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      )

                      original = text

                      if file.name.endswith(".gradle.kts"):
                          text = re.sub(
                              r'(?m)^(\s*)compileSdk\s*=.*$',
                              r'\1compileSdk = 34',
                              text,
                          )
                          text = re.sub(
                              r'(?m)^(\s*)compileSdkVersion\s*=.*$',
                              r'\1compileSdk = 34',
                              text,
                          )
                      else:
                          text = re.sub(
                              r'(?m)^(\s*)compileSdkVersion\s+.*$',
                              r'\1compileSdkVersion 34',
                              text,
                          )
                          text = re.sub(
                              r'(?m)^(\s*)compileSdk\s*(?:=\s*)?.*$',
                              r'\1compileSdkVersion 34',
                              text,
                          )

                      if text != original:
                          file.write_text(
                              text,
                              encoding="utf-8",
                          )
                          patched_files += 1
                          print("PATCHED:", file)

          print("")
          print("Found packages:", found_packages)
          print("Patched Gradle files:", patched_files)

          if found_packages == 0:
              raise SystemExit(
                  "ERROR: Agora/Iris/Printing packages nahi mile"
              )
          PY

          echo ""
          echo "===== AGORA AFTER PATCH ====="
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "agora_rtc_engine-*" \
            -exec grep -R -n "compileSdk" {}/android \; \
            2>/dev/null || true

          echo ""
          echo "===== IRIS AFTER PATCH ====="
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "iris_method_channel-*" \
            -exec grep -R -n "compileSdk" {}/android \; \
            2>/dev/null || true

          echo ""
          echo "===== PRINTING AFTER PATCH ====="
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "printing-*" \
            -exec grep -R -n "compileSdk" {}/android \; \
            2>/dev/null || true

          echo ""
          echo "Plugin compileSdk patch completed."

      # ============================================================
      # 13. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android Configuration
        shell: bash
        run: |
          echo "===== APP COMPILE SDK ====="
          grep -R -n "compileSdk" android/app 2>/dev/null || true

          echo ""
          echo "===== CAMERA PERMISSION ====="
          grep -R -n "android.permission.CAMERA" \
            android/app/src/main/AndroidManifest.xml

          echo ""
          echo "===== INTERNET PERMISSION ====="
          grep -R -n "android.permission.INTERNET" \
            android/app/src/main/AndroidManifest.xml

      # ============================================================
      # 14. FLUTTER DOCTOR
      # ============================================================
      - name: Flutter Doctor
        run: flutter doctor -v

      # ============================================================
      # 15. ANDROID-ONLY TEMPORARY DART PATCH
      # Latest website source ko hi use karta hai.
      # Sirf runner copy me web-only APIs ko Android-compatible banata hai.
      # Repository source unchanged rahega.
      # ============================================================
      - name: Prepare Android Safe Dart Source
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing Android-only temporary source from latest repository files..."

          # Android-only helper packages. Repository pubspec commit nahi hota.
          flutter pub add "url_launcher:^6.3.2"
          flutter pub add "file_picker:11.0.3"
          flutter pub get

          # =========================================================
          # Android compatibility shim for the few web APIs that the
          # shared website source uses (localStorage, external URLs,
          # browser notification gates, etc.).
          # =========================================================
          cat > lib/android_html_shim.dart <<'DART'
          import 'dart:async';

          import 'package:url_launcher/url_launcher.dart';

          class Storage {
            final Map<String, String> _values = <String, String>{};

            String? operator [](Object? key) => _values[key];

            void operator []=(String key, String value) {
              _values[key] = value;
            }

            String? remove(Object? key) => _values.remove(key);
          }

          class NavigatorInfo {
            String get userAgent => 'android';
          }

          class Window {
            final Storage localStorage = Storage();
            final NavigatorInfo navigator = NavigatorInfo();

            void open(String url, String target) {
              final uri = Uri.tryParse(url);
              if (uri == null) return;

              unawaited(
                launchUrl(
                  uri,
                  mode: LaunchMode.externalApplication,
                ),
              );
            }
          }

          final Window window = Window();

          class MouseEvent {}

          class _Children {
            void add(Object value) {}
          }

          class _Body {
            final _Children children = _Children();
          }

          class Document {
            final _Body? body = _Body();

            Stream<MouseEvent> get onClick =>
                const Stream<MouseEvent>.empty();
          }

          final Document document = Document();

          class Notification {
            Notification(
              String title, {
              String? body,
              String? tag,
            });

            static bool get supported => true;

            static String? get permission => 'granted';

            static Future<String> requestPermission() async => 'granted';

            Stream<void> get onClick => const Stream<void>.empty();

            void close() {}
          }

          // Compile-time fallbacks. The real Android implementations for
          // PDF export and document picking are injected into the shared
          // source below, so these are not used at runtime.
          class Blob {
            Blob(List<Object?> parts, [String? type]);
          }

          class Url {
            static String createObjectUrlFromBlob(Blob blob) => '';

            static void revokeObjectUrl(String url) {}
          }

          class AnchorElement {
            AnchorElement({String? href});

            void setAttribute(String name, String value) {}

            void click() {}

            void remove() {}
          }

          class File {
            String name = '';
            int size = 0;
            String type = '';
          }

          class FileUploadInputElement {
            String accept = '';
            List<File>? files;

            Stream<void> get onChange => const Stream<void>.empty();

            void click() {}
          }

          class FileReader {
            Object? result;

            Stream<void> get onLoad => const Stream<void>.empty();

            void readAsDataUrl(File file) {}
          }
          DART

          python3 <<'PY'
          from pathlib import Path
          import re

          dashboard_path = Path("lib/main_dashboard_screen.dart")

          if not dashboard_path.exists():
              raise SystemExit(
                  "ERROR: lib/main_dashboard_screen.dart nahi mila"
              )

          text = dashboard_path.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          # ========================================================
          # 1. WEB dart:html IMPORT -> ANDROID COMPATIBILITY SHIM
          # ========================================================
          web_import_pattern = re.compile(
              r"(?m)^\s*import\s+'dart:html'\s+as\s+html;\s*$"
          )

          text, html_import_count = web_import_pattern.subn(
              "import 'android_html_shim.dart' as html;",
              text,
              count=1,
          )

          if html_import_count == 0:
              print(
                  "dart:html import source me nahi tha - "
                  "Android shim import replacement skip."
              )
          else:
              print("dart:html -> Android compatibility shim patched.")

          # ========================================================
          # 2. ADD ANDROID-ONLY IMPORTS
          # ========================================================
          imports_to_add = [
              "import 'package:file_picker/file_picker.dart';",
              "import 'package:permission_handler/permission_handler.dart';",
          ]

          mobile_import = (
              "import 'package:mobile_scanner/mobile_scanner.dart';"
          )

          for import_line in imports_to_add:
              if import_line in text:
                  continue

              if mobile_import in text:
                  text = text.replace(
                      mobile_import,
                      mobile_import + "\n" + import_line,
                      1,
                  )
              else:
                  raise SystemExit(
                      "ERROR: Android import add karne ke liye "
                      "mobile_scanner import nahi mila"
                  )

          # ========================================================
          # 3. ANDROID CAMERA DETECTION
          # ========================================================
          text = text.replace(
              "html.window.navigator.userAgent.toLowerCase()",
              "'android'",
          )

          # ========================================================
          # 4. SCANNER FIX
          #
          # Important:
          # - Camera permission pehle request hoti hai.
          # - MobileScanner ko manually start()/stop() nahi karte.
          # - Widget mount hone par plugin khud lifecycle ke saath start hota hai.
          # - Isse manual controller double-start/race avoid hota hai.
          # ========================================================
          start_markers = [
              "void _startInlineScanner() {",
              "Future<void> _startInlineScanner() async {",
          ]

          scanner_start = -1

          for marker in start_markers:
              scanner_start = text.find(marker)
              if scanner_start != -1:
                  break

          scanner_close = text.find(
              "void _closeInlineScanner()",
              scanner_start if scanner_start >= 0 else 0,
          )

          if scanner_start == -1 or scanner_close == -1:
              raise SystemExit(
                  "ERROR: Scanner start/close methods patch point nahi mila"
              )

          scanner_start_new = """Future<void> _startInlineScanner() async {
            if (_isAdminMode || _isLoggingIn) return;

            final cameraStatus = await Permission.camera.request();

            if (!mounted) return;

            if (!cameraStatus.isGranted) {
              setState(() {
                _showInlineScanner = false;
                _scanHandled = false;
                _isQrVerifying = false;
                _scanError = cameraStatus.isPermanentlyDenied
                    ? 'Camera permission permanently blocked hai. '
                        'Phone Settings > Apps > Vidya Saarthi > Permissions '
                        'me Camera Allow karein.'
                    : 'Student ID scan ke liye Camera permission Allow karein.';
              });

              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(
                  SnackBar(
                    duration: const Duration(seconds: 5),
                    backgroundColor: Colors.orangeAccent,
                    content: Text(_scanError!),
                    action: cameraStatus.isPermanentlyDenied
                        ? SnackBarAction(
                            label: 'SETTINGS',
                            textColor: Colors.black,
                            onPressed: openAppSettings,
                          )
                        : null,
                  ),
                );
              return;
            }

            setState(() {
              _showInlineScanner = true;
              _scanHandled = false;
              _isQrVerifying = false;
              _scanError = null;
              _scannedStudentData = null;
              _passwordController.clear();
            });
          }

          """

          text = (
              text[:scanner_start]
              + scanner_start_new
              + text[scanner_close:]
          )

          # Replace the scanner widget with a lifecycle-safe auto-starting
          # widget plus a useful retry/error screen.
          scanner_widget_start = text.find("MobileScanner(")

          if scanner_widget_start == -1:
              raise SystemExit(
                  "ERROR: MobileScanner widget patch point nahi mila"
              )

          # Current shared source has one scanner widget. Replace only the
          # widget whose onDetect callback is _onInlineQrDetected.
          scanner_detect = text.find(
              "onDetect: _onInlineQrDetected",
              scanner_widget_start,
          )

          if scanner_detect == -1:
              raise SystemExit(
                  "ERROR: Student QR scanner onDetect callback nahi mila"
              )

          scanner_widget_end = text.find(
              "\n                ),",
              scanner_detect,
          )

          if scanner_widget_end == -1:
              # Formatting may differ slightly after future UI edits.
              scanner_widget_end = text.find(
                  "\n              ),",
                  scanner_detect,
              )

          if scanner_widget_end == -1:
              raise SystemExit(
                  "ERROR: MobileScanner widget end nahi mila"
              )

          scanner_widget_end = text.find(
              "),",
              scanner_widget_end,
          ) + 2

          scanner_widget_new = "\n".join([
              "MobileScanner(",
              "                  fit: BoxFit.cover,",
              "                  onDetect: _onInlineQrDetected,",
              "                  errorBuilder: (context, error) {",
              "                    final detail =",
              "                        error.errorDetails?.message?.trim() ?? '';",
              "                    final code = error.errorCode.name;",
              "",
              "                    return Container(",
              "                      color: Colors.black,",
              "                      alignment: Alignment.center,",
              "                      padding: const EdgeInsets.all(20),",
              "                      child: Column(",
              "                        mainAxisSize: MainAxisSize.min,",
              "                        children: [",
              "                          const Icon(",
              "                            Icons.camera_alt_outlined,",
              "                            color: Colors.orangeAccent,",
              "                            size: 42,",
              "                          ),",
              "                          const SizedBox(height: 12),",
              "                          const Text(",
              "                            'Camera scanner start nahi hua',",
              "                            textAlign: TextAlign.center,",
              "                            style: TextStyle(",
              "                              color: Colors.white,",
              "                              fontSize: 14,",
              "                              fontWeight: FontWeight.w800,",
              "                            ),",
              "                          ),",
              "                          const SizedBox(height: 7),",
              "                          Text(",
              "                            detail.isEmpty",
              "                                ? 'Error: $code'",
              "                                : 'Error: $code\\n$detail',",
              "                            textAlign: TextAlign.center,",
              "                            style: const TextStyle(",
              "                              color: Colors.white54,",
              "                              fontSize: 10.5,",
              "                              height: 1.35,",
              "                            ),",
              "                          ),",
              "                          const SizedBox(height: 14),",
              "                          ElevatedButton.icon(",
              "                            style: ElevatedButton.styleFrom(",
              "                              backgroundColor:",
              "                                  const Color(0xFF00A884),",
              "                              foregroundColor: Colors.white,",
              "                            ),",
              "                            onPressed: () async {",
              "                              setState(() {",
              "                                _showInlineScanner = false;",
              "                                _scanError = null;",
              "                              });",
              "",
              "                              await Future<void>.delayed(",
              "                                const Duration(milliseconds: 250),",
              "                              );",
              "",
              "                              if (mounted) {",
              "                                await _startInlineScanner();",
              "                              }",
              "                            },",
              "                            icon: const Icon(",
              "                              Icons.refresh_rounded,",
              "                              size: 18,",
              "                            ),",
              "                            label: const Text('Retry Scanner'),",
              "                          ),",
              "                        ],",
              "                      ),",
              "                    );",
              "                  },",
              "                ),",
          ])

          text = (
              text[:scanner_widget_start]
              + scanner_widget_new
              + text[scanner_widget_end:]
          )

          print(
              "Android scanner patched: runtime permission + "
              "auto lifecycle + retry UI."
          )

          # ========================================================
          # 5. WEB PDF DOWNLOAD -> ANDROID PDF SHARE
          # ========================================================
          pdf_start_marker = "final blob = html.Blob("
          pdf_end_marker = "html.Url.revokeObjectUrl(url);"

          pdf_start = text.find(pdf_start_marker)

          if pdf_start != -1:
              pdf_end = text.find(
                  pdf_end_marker,
                  pdf_start,
              )

              if pdf_end == -1:
                  raise SystemExit(
                      "ERROR: PDF html block ka end nahi mila"
                  )

              pdf_end += len(pdf_end_marker)

              pdf_replacement = """await Printing.sharePdf(
              bytes: pdfBytes,
              filename:
                  'SVN_ID_Card_${safeName}_Roll_$roll.pdf',
            );"""

              text = (
                  text[:pdf_start]
                  + pdf_replacement
                  + text[pdf_end:]
              )

              print("ID Card PDF Android share me patched.")
          else:
              print(
                  "HTML PDF download block present nahi hai - skip."
              )

          # ========================================================
          # 6. STUDENT DOCUMENT UPLOAD -> NATIVE ANDROID FILE PICKER
          # Keeps PDF/JPG/JPEG and total 2 MB validation.
          # ========================================================
          file_picker_start = text.find(
              "    final input = html.FileUploadInputElement()"
          )

          file_reader_end_marker = (
              "      if (dataUrl.isEmpty) "
              "throw Exception('File read nahi ho paya.');"
          )

          if file_picker_start != -1:
              file_picker_end = text.find(
                  file_reader_end_marker,
                  file_picker_start,
              )

              if file_picker_end == -1:
                  raise SystemExit(
                      "ERROR: Student document web picker end marker nahi mila"
                  )

              file_picker_end += len(file_reader_end_marker)

              native_picker = """    final picked = await FilePicker.platform.pickFiles(
              type: FileType.custom,
              allowedExtensions: const ['pdf', 'jpg', 'jpeg'],
              allowMultiple: false,
              withData: true,
            );

            if (picked == null ||
                picked.files.isEmpty ||
                !mounted) {
              return;
            }

            final file = picked.files.single;
            final bytes = file.bytes;
            final lower = file.name.toLowerCase();

            String mime;

            if (lower.endsWith('.pdf')) {
              mime = 'application/pdf';
            } else if (lower.endsWith('.jpg') ||
                lower.endsWith('.jpeg')) {
              mime = 'image/jpeg';
            } else {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(
                  backgroundColor: Colors.redAccent,
                  content: Text(
                    'Sirf PDF/JPG/JPEG document allowed hai.',
                  ),
                ),
              );
              return;
            }

            if (bytes == null) {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(
                  backgroundColor: Colors.redAccent,
                  content: Text('Document read nahi ho paya.'),
                ),
              );
              return;
            }

            final oldSize =
                (replace?['sizeBytes'] as num?)?.toInt() ?? 0;

            if (_totalBytes - oldSize + file.size > _maxBytes) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  backgroundColor: Colors.redAccent,
                  content: Text(
                    '2 MB total limit exceed hoga. '
                    'Used ${_formatBytes(_totalBytes)}.',
                  ),
                ),
              );
              return;
            }

            setState(() => _uploading = true);

            try {
              final dataUrl =
                  'data:$mime;base64,${base64Encode(bytes)}';"""

              text = (
                  text[:file_picker_start]
                  + native_picker
                  + text[file_picker_end:]
              )

              print(
                  "Student Documents: Android native file picker patched."
              )
          else:
              print(
                  "Student document web picker source me nahi mila - skip."
              )

          # ========================================================
          # 7. NATIVE ANDROID FIREBASE CONFIG
          # Website FirebaseOptions stays in repository.
          # Android runner uses google-services.json.
          # ========================================================
          main_path = Path("lib/main.dart")

          if not main_path.exists():
              raise SystemExit(
                  "ERROR: lib/main.dart nahi mila"
              )

          main_text = main_path.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          firebase_init_pattern = re.compile(
              r"await\s+Firebase\.initializeApp\(\s*"
              r"options:\s*const\s+FirebaseOptions\("
              r".*?"
              r"\),\s*"
              r"\);",
              re.S,
          )

          main_text, firebase_init_count = (
              firebase_init_pattern.subn(
                  "await Firebase.initializeApp();",
                  main_text,
                  count=1,
              )
          )

          if firebase_init_count == 0:
              if "await Firebase.initializeApp();" in main_text:
                  print(
                      "Android Firebase init already native tha."
                  )
              else:
                  raise SystemExit(
                      "ERROR: Firebase.initializeApp Android patch "
                      "point nahi mila"
                  )
          else:
              print(
                  "Android Firebase google-services.json config active."
              )

          # ========================================================
          # 8. ANDROID APP VISIBLE NAME
          # Package id ko touch nahi karta.
          # ========================================================
          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest_text = manifest_path.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          application_match = re.search(
              r"<application\b[^>]*>",
              manifest_text,
              re.S,
          )

          if application_match:
              app_tag = application_match.group(0)

              if re.search(r'android:label="[^"]*"', app_tag):
                  new_app_tag = re.sub(
                      r'android:label="[^"]*"',
                      'android:label="Vidya Saarthi"',
                      app_tag,
                      count=1,
                  )
              else:
                  new_app_tag = app_tag[:-1] + (
                      ' android:label="Vidya Saarthi">'
                  )

              manifest_text = (
                  manifest_text[:application_match.start()]
                  + new_app_tag
                  + manifest_text[application_match.end():]
              )

              manifest_path.write_text(
                  manifest_text,
                  encoding="utf-8",
              )

          # ========================================================
          # SAVE RUNNER-ONLY DART FILES
          # ========================================================
          dashboard_path.write_text(
              text,
              encoding="utf-8",
          )

          main_path.write_text(
              main_text,
              encoding="utf-8",
          )

          print("")
          print(
              "Android temporary source created from latest website code."
          )
          PY

          echo ""
          echo "========================================="
          echo "CHECKING ANDROID TEMPORARY SOURCE"
          echo "========================================="

          echo ""
          echo "Repository commit used by APK:"
          git rev-parse HEAD

          echo ""
          echo "Checking native Android Firebase initialization..."

          if grep -n "FirebaseOptions(" lib/main.dart; then
            echo "::error::Android main.dart me web FirebaseOptions abhi bhi present hai!"
            exit 1
          fi

          grep -n "Firebase.initializeApp();" lib/main.dart

          echo ""
          echo "Checking Android compatibility shim..."

          if grep -n "import 'dart:html'" lib/main_dashboard_screen.dart; then
            echo "::error::Android source me direct dart:html import present hai!"
            exit 1
          fi

          grep -n \
            "android_html_shim.dart" \
            lib/main_dashboard_screen.dart || true

          test -s lib/android_html_shim.dart

          echo ""
          echo "Checking mobile scanner..."

          flutter pub deps > /tmp/android-pub-deps.txt
          grep "mobile_scanner" /tmp/android-pub-deps.txt
          grep -n "Permission.camera.request" \
            lib/main_dashboard_screen.dart
          grep -n "errorBuilder:" \
            lib/main_dashboard_screen.dart

          if grep -n "_qrScannerController" lib/main_dashboard_screen.dart; then
            echo "::error::Old manual scanner controller patch abhi bhi present hai!"
            exit 1
          else
            echo "OK - manual scanner start/stop controller absent."
          fi

          echo ""
          echo "Checking Student Documents native picker..."

          if grep -n "FileUploadInputElement" lib/main_dashboard_screen.dart; then
            echo "::error::Android source me web FileUploadInputElement abhi bhi present hai!"
            exit 1
          fi

          grep -n "FilePicker.platform.pickFiles" \
            lib/main_dashboard_screen.dart || true

          echo ""
          echo "Checking ID Card Android PDF share..."
          grep -n "Printing.sharePdf" \
            lib/main_dashboard_screen.dart || true

          echo ""
          echo "Checking Vidya Saarthi branding..."
          grep -n "Vidya Saarthi" \
            lib/main.dart \
            lib/main_dashboard_screen.dart \
            | head -n 10 || true

          echo ""
          echo "Android temporary source READY."

      # ============================================================
      # 17. BUILD RELEASE APK
      # Every run gets a higher Android versionCode so the newest APK
      # actually replaces the older installed build.
      # ============================================================
      - name: Build Vidya Saarthi Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk \
            --release \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --dart-define=GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      # ============================================================
      # 17. VERIFY APK EXISTS
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "::error::app-release.apk nahi mila!"
            exit 1
          fi

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ============================================================
      # 18. PREPARE FINAL APK
      # ============================================================
      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Vidya-Saarthi-v${{ github.run_number }}.apk

          echo ""
          echo "========================================="
          echo "       VIDYA SAARTHI APK READY"
          echo "========================================="
          echo ""

          ls -lh release/

          echo ""
          echo "APK SHA256:"
          sha256sum \
            release/Vidya-Saarthi-v${{ github.run_number }}.apk

      # ============================================================
      # 19. BUILD SUMMARY
      # ============================================================
      - name: Create Build Summary
        shell: bash
        run: |
          APK_SIZE=$(du -h \
            release/Vidya-Saarthi-v${{ github.run_number }}.apk \
            | cut -f1)

          echo "# 📱 Vidya Saarthi Android" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **#${{ github.run_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: **${{ github.ref_name }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK Size: **$APK_SIZE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: **34+**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: **17**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Camera Scanner: **Enabled**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build Type: **Release**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase Android: **Configured**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: **Permanent release key**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "APK ko Artifacts section se download karein." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 20. UPLOAD APK
      # ============================================================
      - name: Upload Saarthi AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidya-Saarthi-APK-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ============================================================
      # CLEANUP SENSITIVE RUNNER FILES
      # ============================================================
      - name: Cleanup Signing Files
        if: always()
        shell: bash
        run: |
          rm -f \
            android/app/saarthi-release.jks \
            android/app/saarthi-release.jks.enc \
            android/app/google-services.json
