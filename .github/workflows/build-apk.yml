      # ============================================================
      # 17. BUILD RELEASE APK
      # Every run gets a higher Android versionCode so the newest APK
      # actually replaces the older installed build.
      # ============================================================
      - name: Build Vidya Saarthi Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
        run: |
          flutter build apk \
            --release \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_PLATFORM="android" \
            --dart-define=APP_VERSION_CODE="${{ github.run_number }}" \
            --dart-define=APP_VERSION_NAME="1.0.${{ github.run_number }}" \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --dart-define=GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      # ============================================================
      # 17. VERIFY APK EXISTS
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "::error::app-release.apk nahi mila!"
            exit 1
          fi

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ============================================================
      # 18. PREPARE FINAL APK
