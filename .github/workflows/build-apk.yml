name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 3. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Show environment information
      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v
          
      # 4.1 Generate Android folder
      - name: Generate Android project files
        run: |
          flutter config --enable-android
          flutter create --platforms=android --android-language java .
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
         
      - name: Configure SDK 34 and Bypass Checks
        run: |
          mkdir -p android
          find android -name "build.gradle.kts" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} + || true
          find android -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} + || true
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "android.enableD8=true" >> android/gradle.properties

      # 5. Get Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Clean previous build
      - name: Clean Flutter build
        run: flutter clean

      # 7. Get dependencies again after clean
      - name: Get dependencies
        run: flutter pub get

      # 8. Build release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
