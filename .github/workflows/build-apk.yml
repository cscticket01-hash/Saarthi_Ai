          from pathlib import Path
          import re

          APP_SDK = "36"

          def patch_gradle_file(path: Path) -> bool:
              text = path.read_text(encoding="utf-8", errors="ignore")
              original = text

              if path.name.endswith(".gradle.kts"):
                  text = re.sub(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      rf'\1compileSdk = {APP_SDK}',
                      text,
                  )
                  text = re.sub(
                      r'(?m)^(\s*)compileSdkVersion\s*=.*$',
                      rf'\1compileSdk = {APP_SDK}',
                      text,
                  )
              else:
