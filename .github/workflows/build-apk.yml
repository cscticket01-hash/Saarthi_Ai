name: Build Saarthi AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"


      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 5. INSTALL ANDROID SDK 34
      # mobile_scanner + Agora ke liye
      # ============================================================
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"


      # ============================================================
      # 6. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show Build Environment
        run: |
          flutter --version
          dart --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"


      # ============================================================
      # 7. CONFIGURE ANDROID PROJECT
      #
      # Existing android project ko overwrite nahi karega.
      # Sirf android folder missing hua to generate karega.
      # ============================================================
      - name: Configure Android Project
        shell: bash
        run: |
          flutter config --enable-android

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android project missing. Creating..."
            flutter create \
              --platforms=android \
              --android-language=java \
              --no-pub \
              .
          else
            echo "Existing Android project found."
            echo "Existing Android configuration preserve kiya jayega."
          fi


      # ============================================================
      # 8. ENSURE CAMERA + INTERNET PERMISSIONS
      # Scanner ke liye CAMERA permission
      # Existing permissions ko delete/replace nahi karega
      # ============================================================
      - name: Ensure Android Permissions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml nahi mila")

          text = manifest.read_text(encoding="utf-8")

          additions = []

          if 'android.permission.INTERNET' not in text:
              additions.append(
                  '    <uses-permission android:name="android.permission.INTERNET" />'
              )

          if 'android.permission.CAMERA' not in text:
              additions.append(
                  '    <uses-permission android:name="android.permission.CAMERA" />'
              )

          if 'android.hardware.camera.any' not in text:
              additions.append(
                  '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />'
              )

          if additions:
              manifest_end = text.find('>')

              if manifest_end == -1:
                  raise SystemExit("Invalid AndroidManifest.xml")

              text = (
                  text[:manifest_end + 1]
                  + "\n"
                  + "\n".join(additions)
                  + "\n"
                  + text[manifest_end + 1:]
              )

              manifest.write_text(text, encoding="utf-8")

          print("===== ANDROID MANIFEST =====")
          print(manifest.read_text(encoding="utf-8"))
          PY


      # ============================================================
      # 9. CLEAN PROJECT
      # ============================================================
      - name: Clean Project
        run: flutter clean


      # ============================================================
      # 10. GET DEPENDENCIES
      # ============================================================
      - name: Install Flutter Dependencies
        run: flutter pub get


      # ============================================================
      # 11. VERIFY MOBILE SCANNER
      # pubspec me mobile_scanner missing hua to yahin fail karega
      # ============================================================
      - name: Verify Mobile Scanner
        shell: bash
        run: |
          echo "Checking mobile_scanner dependency..."

          flutter pub deps | grep "mobile_scanner"

          echo ""
          echo "mobile_scanner dependency found."


            # ============================================================
      # FIX AGORA RTC ENGINE COMPILE SDK
      # Agora kisi bhi syntax me SDK 31 use kare,
      # is step se compileSdk 34 force hoga.
      # ============================================================
      - name: Fix Agora Compile SDK
        shell: bash
        run: |
          echo "Searching Agora RTC Engine..."

          AGORA_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 \
            -type d \
            -name "agora_rtc_engine-*" \
            | sort -V \
            | tail -n 1)

          if [ -z "$AGORA_DIR" ]; then
            echo "::error::Agora RTC Engine package nahi mila!"
            exit 1
          fi

          echo "Agora package:"
          echo "$AGORA_DIR"

          echo ""
          echo "===== BEFORE PATCH ====="
          grep -R -n "compileSdk" "$AGORA_DIR/android" || true

          python3 - "$AGORA_DIR" <<'PY'
          import sys
          import re
          from pathlib import Path

          agora_dir = Path(sys.argv[1])
          android_dir = agora_dir / "android"

          files = list(android_dir.rglob("*.gradle"))
          files += list(android_dir.rglob("*.gradle.kts"))

          changed_total = 0

          for file in files:
              text = file.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              original = text

              if file.name.endswith(".gradle.kts"):
                  # Kotlin Gradle:
                  # compileSdk = 31
                  # compileSdk = flutter.compileSdkVersion
                  text, count1 = re.subn(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      r'\1compileSdk = 34',
                      text,
                  )

                  # Rare compileSdkVersion syntax
                  text, count2 = re.subn(
                      r'(?m)^(\s*)compileSdkVersion\s*=.*$',
                      r'\1compileSdk = 34',
                      text,
                  )

              else:
                  # Groovy Gradle:
                  # compileSdkVersion 31
                  # compileSdkVersion safeExtGet(...)
                  # compileSdkVersion flutter.compileSdkVersion
                  text, count1 = re.subn(
                      r'(?m)^(\s*)compileSdkVersion\s+.*$',
                      r'\1compileSdkVersion 34',
                      text,
                  )

                  # New Groovy syntax:
                  # compileSdk 31
                  # compileSdk = 31
                  text, count2 = re.subn(
                      r'(?m)^(\s*)compileSdk\s*(?:=\s*)?.*$',
                      r'\1compileSdkVersion 34',
                      text,
                  )

              if text != original:
                  file.write_text(
                      text,
                      encoding="utf-8",
                  )

                  changed_total += count1 + count2
                  print(f"PATCHED: {file}")

          print(
              f"Total compileSdk replacements: {changed_total}"
          )

          if changed_total == 0:
              print(
                  "ERROR: Agora compileSdk line patch nahi hui."
              )

              for file in files:
                  print(
                      "\n===== FILE:",
                      file,
                      "====="
                  )
                  print(
                      file.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      )
                  )

              raise SystemExit(1)
          PY

          echo ""
          echo "===== AFTER PATCH ====="
          grep -R -n "compileSdk" "$AGORA_DIR/android" || true

          echo ""
          echo "Agora compileSdk patch completed."
          
      # ============================================================
      # 13. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android Configuration
        shell: bash
        run: |
          echo "===== APP COMPILE SDK ====="
          grep -R -n "compileSdk" android/app 2>/dev/null || true

          echo ""
          echo "===== CAMERA PERMISSION ====="
          grep -R -n "android.permission.CAMERA" \
            android/app/src/main/AndroidManifest.xml

          echo ""
          echo "===== INTERNET PERMISSION ====="
          grep -R -n "android.permission.INTERNET" \
            android/app/src/main/AndroidManifest.xml


      # ============================================================
      # 14. FLUTTER DOCTOR
      # ============================================================
      - name: Flutter Doctor
        run: flutter doctor -v

      # ============================================================
      # ANDROID-ONLY TEMPORARY DART PATCH
      # Original GitHub Dart file ko change NAHI karta
      # ============================================================
      - name: Prepare Android Safe Dart Source
        shell: bash
        run: |
          echo "Preparing Android-only temporary source..."

          # WhatsApp link Android par open karne ke liye
          flutter pub add "url_launcher:^6.3.2"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/main_dashboard_screen.dart")

          if not path.exists():
              raise SystemExit(
                  "ERROR: lib/main_dashboard_screen.dart nahi mila"
              )

          text = path.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # 1. REMOVE dart:html IMPORT FOR ANDROID BUILD
          # --------------------------------------------------------
          text = text.replace(
              "import 'dart:html' as html;\n",
              ""
          )

          # --------------------------------------------------------
          # 2. ADD url_launcher IMPORT
          # --------------------------------------------------------
          launcher_import = (
              "import 'package:url_launcher/url_launcher.dart';\n"
          )

          if launcher_import not in text:

              mobile_scanner_import = (
                  "import 'package:mobile_scanner/mobile_scanner.dart';\n"
              )

              qr_import = (
                  "import 'package:qr_flutter/qr_flutter.dart';\n"
              )

              if mobile_scanner_import in text:
                  text = text.replace(
                      mobile_scanner_import,
                      mobile_scanner_import + launcher_import,
                      1,
                  )

              elif qr_import in text:
                  text = text.replace(
                      qr_import,
                      qr_import + launcher_import,
                      1,
                  )

              else:
                  raise SystemExit(
                      "ERROR: Import insertion location nahi mila"
                  )

          # --------------------------------------------------------
          # 3. MOBILE SCANNER DETECTION
          # APK khud Android hai, isliye true
          # --------------------------------------------------------
          scanner_pattern = re.compile(
              r"bool _isMobileScannerDevice\(\) \{"
              r".*?"
              r"\n  \}"
              r"\n\n  void _startInlineScanner",
              re.DOTALL,
          )

          scanner_replacement = """bool _isMobileScannerDevice() {
              return true;
            }

            void _startInlineScanner"""

          text, scanner_count = scanner_pattern.subn(
              scanner_replacement,
              text,
              count=1,
          )

          if scanner_count != 1:
              raise SystemExit(
                  "ERROR: Scanner device function patch nahi hui"
              )

          # --------------------------------------------------------
          # 4. WEB HTML PDF DOWNLOAD -> ANDROID SHARE PDF
          # --------------------------------------------------------
          pdf_pattern = re.compile(
              r"\n    final blob = html\.Blob\("
              r".*?"
              r"\n    html\.Url\.revokeObjectUrl\(url\);",
              re.DOTALL,
          )

          pdf_replacement = """
              await Printing.sharePdf(
                bytes: pdfBytes,
                filename:
                    'SVN_ID_Card_${safeName}_Roll_$roll.pdf',
              );"""

          text, pdf_count = pdf_pattern.subn(
              pdf_replacement,
              text,
              count=1,
          )

          if pdf_count != 1:
              raise SystemExit(
                  "ERROR: PDF Android patch nahi hui"
              )

          # --------------------------------------------------------
          # 5. WEB WHATSAPP OPEN -> ANDROID EXTERNAL APP
          # --------------------------------------------------------
          old_whatsapp = (
              "html.window.open("
              "'https://wa.me/$waNum', '_blank');"
          )

          new_whatsapp = """launchUrl(
                                        Uri.parse(
                                          'https://wa.me/$waNum',
                                        ),
                                        mode: LaunchMode.externalApplication,
                                      );"""

          if old_whatsapp not in text:
              raise SystemExit(
                  "ERROR: WhatsApp HTML code nahi mila"
              )

          text = text.replace(
              old_whatsapp,
              new_whatsapp,
              1,
          )

          # --------------------------------------------------------
          # SAVE TEMPORARY FILE
          # --------------------------------------------------------
          path.write_text(
              text,
              encoding="utf-8",
          )

          print("Scanner patch:", scanner_count)
          print("PDF patch:", pdf_count)
          print("Android temporary Dart patch successful.")
          PY

          echo ""
          echo "===== CHECK dart:html ====="

          if grep -R -nE \
            "dart:html|html\." \
            lib/main_dashboard_screen.dart; then

            echo "::error::HTML code abhi bhi Dart file me mila!"
            exit 1

          else
            echo "OK - Android source me dart:html nahi hai."
          fi

          echo ""
          echo "===== CHECK URL LAUNCHER ====="
          grep -n \
            "url_launcher" \
            lib/main_dashboard_screen.dart

          echo ""
          echo "Android temporary source ready."

      # ============================================================
      # 15. BUILD RELEASE APK
      # ============================================================
      - name: Build Saarthi AI Release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"


      # ============================================================
      # 16. VERIFY APK EXISTS
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "::error::app-release.apk nahi mila!"
            exit 1
          fi

          ls -lh build/app/outputs/flutter-apk/app-release.apk


      # ============================================================
      # 17. PREPARE FINAL APK
      # ============================================================
      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Saarthi-AI-v${{ github.run_number }}.apk

          echo ""
          echo "========================================="
          echo "       SAARTHI AI APK READY"
          echo "========================================="
          echo ""

          ls -lh release/

          echo ""
          echo "APK SHA256:"
          sha256sum \
            release/Saarthi-AI-v${{ github.run_number }}.apk


      # ============================================================
      # 18. BUILD SUMMARY
      # ============================================================
      - name: Create Build Summary
        shell: bash
        run: |
          APK_SIZE=$(du -h \
            release/Saarthi-AI-v${{ github.run_number }}.apk \
            | cut -f1)

          echo "# 📱 Saarthi AI Android" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **#${{ github.run_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: **${{ github.ref_name }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK Size: **$APK_SIZE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: **34+**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: **17**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Camera Scanner: **Enabled**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build Type: **Release**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "APK ko Artifacts section se download karein." \
            >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 19. UPLOAD APK
      # ============================================================
      - name: Upload Saarthi AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Saarthi-AI-APK-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
