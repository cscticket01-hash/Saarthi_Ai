name: Isolated TEST original notice proof mismatch audit
on:
  push:
    branches: [test/notice-proof-mismatch-evidence-20261114]
    paths:
      - '.github/workflows/test-notice-proof-mismatch-audit.yml'
      - '.github/scripts/test_notice_proof_mismatch_audit.cjs'
  pull_request:
    branches: [feature/smart-sync-3]
    paths:
      - '.github/workflows/test-notice-proof-mismatch-audit.yml'
      - '.github/scripts/test_notice_proof_mismatch_audit.cjs'
permissions:
  contents: read
concurrency:
  group: sync3-original-notice-mismatch-inspection
  cancel-in-progress: false
env:
  VS_EXPECTED_TEST_RUNTIME: 8625fd5444680f318dd9f266933b69ea569e6574
jobs:
  original-proofs:
    if: github.repository == 'cscticket01-hash/Saarthi_Ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backend sources EXACTLY match deployed isolated TEST broker
        run: |
          git diff --exit-code "$VS_EXPECTED_TEST_RUNTIME" HEAD -- functions oauth-broker staging-school-cloud cloudflare-sync school-backend package.json package-lock.json
          node --check .github/scripts/test_notice_proof_mismatch_audit.cjs
      - name: Inspect authenticated original operation proofs without writes
        env:
          VS_TEST_CONNECT_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/test_notice_proof_mismatch_audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-original-notice-mismatch-evidence
          path: build/cloud-prerequisites/edge-original-reconciliation.json
