name: Self-Healing removal review
'on':
  push:
    branches: [refactor/remove-self-healing]
  pull_request:
    branches: [main]
    paths: ['lib/**', 'test/**', 'functions/**', '.github/**', 'tool/**']
permissions:
  contents: read
concurrency:
  group: healing-removal-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: node --test .github/scripts/disaster_resume.test.cjs
      - name: Verify engine sources and integration hooks are absent
        run: python tool/check_self_healing_removed.py
  owners:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check retained feature owners
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main_windows.dart lib/main_android.dart lib/document_pipeline.dart lib/document_image_worker.dart lib/id_card_engine.dart lib/id_card_bulk_engine.dart lib/qr_authentication_engine.dart lib/windows_sync_control_center.dart lib/mobile/school_session.dart lib/windows_connect/managed_school_session.dart lib/managed_developer_panel.dart
      - name: Startup, Sync, documents, ID cards, QR and Android regressions
        env:
          APPDATA: ${{ runner.temp }}/self-healing-removal
        run: flutter test --concurrency=1 --timeout 90s test/document_image_worker_test.dart test/document_processing_engine_test.dart test/document_upload_flow_test.dart test/id_card_engine_test.dart test/id_card_bulk_engine_test.dart test/school_qr_login_test.dart test/windows_startup_test.dart test/android_startup_test.dart test/windows_sync_revision_test.dart test/windows_sync_durable_admission_test.dart test/windows_sync_control_cleanup_test.dart test/mobile_smart_sync_test.dart
