name: REAL TEST three person-photo Cloudflare Drive timings
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/real_person_photo_edge_speed.cjs'
      - '.github/workflows/real-person-photo-edge-speed.yml'
permissions:
  contents: read
concurrency:
  group: isolated-person-photo-speed-one-school
  cancel-in-progress: false
jobs:
  real-test-person-photo:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/live-sync-authority-v1-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact source syntax
        run: node --check .github/scripts/real_person_photo_edge_speed.cjs
      - name: Signed TEST school photo upload, persons add, CAS delete, Drive readback and Cloudflare timings
        env:
          VS_PERSON_PHOTO_TEST: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/real_person_photo_edge_speed.cjs
      - name: Publish sanitized performance and fixture cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-person-photo-edge-speed
          path: build/cloud-prerequisites/real-person-photo-edge-speed.json
          if-no-files-found: warn
          retention-days: 7
