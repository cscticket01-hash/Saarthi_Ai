name: Isolated TEST recycle acceptance
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: restore
        options: [restore, start-expiry, check-expiry]
      fixture_id:
        type: string
        description: "Expiry only: recycle-expiry-v1- followed by 8-61 lowercase letters/digits/hyphens"
      deleted_revision:
        type: string
        description: "Check only: retained start-expiry artifact deletion revision"
      deleted_at:
        type: string
        description: "Check only: retained artifact server deletion milliseconds"
      recover_until:
        type: string
        description: "Check only: retained artifact server deadline milliseconds"
  push:
    branches: [feature/smart-sync-3]
    paths:
      - .github/workflows/recycle-test.yml
      - .github/scripts/test_recycle_live.cjs
permissions:
  contents: read
concurrency:
  group: isolated-test-recycle-acceptance
  cancel-in-progress: false
jobs:
  recycle-live:
    if: github.ref == 'refs/heads/feature/smart-sync-3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify expiry harness scope and deadline-gated rejection probe
        run: node --test .github/scripts/test_recycle_live_modes.test.cjs
      # Push acceptance advances the retained artifact11688200206 fixture to
      # real expiry verification. Explicit dispatch retains restore/start modes.
      # The harness refuses restore probes before the actual server deadline.
      - name: Retained TEST real-day expiry or explicitly selected restore acceptance
        env:
          VS_TEST_RECYCLE_MODE: ${{ inputs.mode || 'check-expiry' }}
          VS_TEST_RECYCLE_FIXTURE_ID: ${{ inputs.fixture_id || 'recycle-expiry-v1-20261011-resume-acceptance' }}
          VS_TEST_RECYCLE_DELETED_REVISION: ${{ inputs.deleted_revision || '26d0800c-5f42-4022-bfc2-a959bc5c3c9a' }}
          VS_TEST_RECYCLE_DELETED_AT: ${{ inputs.deleted_at || '1791680719426' }}
          VS_TEST_RECYCLE_RECOVER_UNTIL: ${{ inputs.recover_until || '1791767119426' }}
          VS_TEST_CONNECT_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/test_recycle_live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-recycle-readback
          path: build/cloud-prerequisites/recycle-live.json
