name: Sheet recovery and student lifecycle review
on:
  pull_request:
    branches: [main]
    paths: ['lib/**', 'test/**', 'school-backend/**', 'functions/**', '.github/workflows/sheet-lifecycle-review.yml']
permissions:
  contents: read
concurrency:
  group: sheet-lifecycle-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix functions install
      - run: npm --prefix functions test
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/windows_verified_update.dart lib/windows_update_manager.dart lib/windows_update_service.dart lib/windows_sheet_recovery.dart lib/student_lifecycle_policy.dart lib/windows_local_firestore.dart lib/windows_firebase_sync.dart lib/windows_sync_engine.dart lib/windows_school_identity.dart lib/windows_connect/managed_record_media.dart lib/main_dashboard_screen_windows.dart
      - name: Lifecycle, verified installer and retained owner regressions
        env:
          APPDATA: ${{ runner.temp }}/sheet-lifecycle-review
        run: flutter test --concurrency=1 --timeout 90s test/windows_verified_update_test.dart test/student_lifecycle_policy_test.dart test/windows_sheet_recovery_test.dart test/windows_student_lifecycle_test.dart test/windows_local_first_save_test.dart test/windows_sync_revision_test.dart test/windows_sync_durable_admission_test.dart test/windows_document_review_owner_test.dart test/windows_local_restore_sync_test.dart test/qr_card_authorization_test.dart test/school_qr_login_test.dart test/release_download_test.dart test/github_update_test.dart
      - name: Real SQLite lifecycle durability
        env:
          APPDATA: ${{ runner.temp }}/sheet-lifecycle-sqlite-review
        run: flutter test --dart-define=SAARTHI_WINDOWS_SQLITE=true --concurrency=1 --timeout 90s test/windows_student_lifecycle_test.dart test/windows_sheet_recovery_test.dart test/windows_document_queue_test.dart
