name: Universal Self-Healing 2 draft review
'on':
  pull_request:
    branches: [main]
    paths: ['lib/**','test/**','functions/**','tool/health_benchmark.dart','.github/workflows/universal-health-review.yml']
  push:
    branches: [feature/universal-self-healing-2]
permissions:
  contents: read
concurrency:
  group: universal-health-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  guardian-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Guardian source safety
        run: flutter analyze lib/health lib/document_pipeline.dart lib/qr_authentication_engine.dart
      - name: Actual guardian and existing owner regression tests
        run: flutter test test/universal_health_test.dart test/document_processing_engine_test.dart test/document_upload_flow_test.dart test/id_card_engine_test.dart test/school_qr_login_test.dart test/sync_recovery_policy_test.dart test/mobile_attendance_outbox_test.dart test/windows_sync_pause_test.dart test/windows_sync_revision_test.dart
      - name: Bounded flood benchmark
        run: dart tool/health_benchmark.dart
      - name: Backend authorization and telemetry regressions
        working-directory: functions
        run: |
          npm install --ignore-scripts
          node --test test/*.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-health-measured-evidence
          path: build/universal-health
          retention-days: 14
