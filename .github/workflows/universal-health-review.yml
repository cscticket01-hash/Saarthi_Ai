name: Universal Self-Healing 2 draft review
'on':
  pull_request:
    branches: [main]
    paths: ['lib/**','test/**','functions/**','tool/health_benchmark.dart','tool/*health_knowledge*','tool/health_knowledge_benchmark.dart','.github/workflows/universal-health-review.yml']
  push:
    branches: [feature/universal-self-healing-2]
permissions:
  contents: read
concurrency:
  group: universal-health-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  guardian-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Declarative knowledge validation
        run: |
          python tool/build_health_knowledge.py --check
          python -m unittest discover -s tool -p test_health_knowledge.py
      - name: Guardian source safety
        run: flutter analyze lib/health lib/document_pipeline.dart lib/qr_authentication_engine.dart
      - name: Actual guardian and existing owner regression tests
        env:
          APPDATA: ${{ runner.temp }}/universal-health-tests
        run: flutter test --concurrency=1 --timeout 90s test/school_profile_policy_test.dart test/windows_school_profile_cache_test.dart test/windows_sync_comparison_test.dart test/windows_healing_monitor_test.dart test/universal_health_test.dart test/health_knowledge_test.dart test/health_lifecycle_safety_test.dart test/health_transport_test.dart test/document_processing_engine_test.dart test/document_upload_flow_test.dart test/id_card_engine_test.dart test/school_qr_login_test.dart test/sync_recovery_policy_test.dart test/mobile_attendance_outbox_test.dart test/windows_sync_pause_test.dart test/windows_sync_revision_test.dart
      - name: Flutter-rendered monitor previews (test fixture)
        env:
          HEALTH_PREVIEWS: '1'
        run: flutter test test/windows_healing_monitor_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healing-monitor-flutter-previews
          path: build/healing-monitor
          retention-days: 14
      - name: Bounded flood benchmark
        run: dart tool/health_benchmark.dart
      - name: Indexed knowledge benchmark
        run: dart tool/health_knowledge_benchmark.dart
      - name: Backend authorization and telemetry regressions
        working-directory: functions
        run: |
          npm install --ignore-scripts
          node --test test/*.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-health-measured-evidence
          path: build/universal-health
          retention-days: 14
