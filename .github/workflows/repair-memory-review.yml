name: Verified repair memory review
on:
  pull_request:
    paths: ['lib/**', 'test/**', '.github/workflows/repair-memory-review.yml']
permissions:
  contents: read
concurrency:
  group: repair-memory-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  repair-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/windows_repair_memory.dart lib/windows_id_card_reviews.dart lib/windows_pending_school_sync.dart lib/windows_sync_engine.dart lib/windows_sync_control_center.dart test/windows_repair_memory_test.dart
      - name: Verified memory, durable cooldown, record and UI regressions
        env:
          APPDATA: ${{ runner.temp }}/verified-repair-memory
        run: flutter test --concurrency=1 test/windows_repair_memory_test.dart test/windows_pending_auto_repair_test.dart test/windows_document_review_owner_test.dart test/windows_sync_modern_ui_test.dart test/windows_smart_recovery_test.dart
      - name: SQLite restart and CAS regression
        env:
          APPDATA: ${{ runner.temp }}/verified-repair-memory-sqlite
        run: flutter test --dart-define=SAARTHI_WINDOWS_SQLITE=true --concurrency=1 test/windows_pending_auto_repair_test.dart test/windows_document_review_owner_test.dart test/windows_smart_recovery_test.dart
