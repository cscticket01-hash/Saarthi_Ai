# R2 TEST Worker verified source: c90c105891b7f34a658b94d658aee813c4fa6b0a / d29b315b-a580-41aa-89e7-fa8fbb7e7bfb
name: Cloudflare delivery isolated synthetic acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/cloudflare_delivery_acceptance*'
      - '.github/workflows/cloudflare-delivery-acceptance.yml'
  push:
    branches: [verify/cloudflare-delivery-live, feature/smart-sync-3, test/r2-offline-provider-20261114]
    paths:
      - '.github/scripts/cloudflare_delivery_acceptance.cjs'
      - '.github/scripts/cloudflare_delivery_acceptance.test.cjs'
      - '.github/workflows/cloudflare-delivery-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-delivery-isolated-acceptance
  cancel-in-progress: false
jobs:
  harness-safeguards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/cloudflare_delivery_acceptance.test.cjs
  isolated-live-delivery:
    if: github.event_name == 'push' && github.repository == 'cscticket01-hash/Saarthi_Ai' && github.ref == 'refs/heads/verify/cloudflare-delivery-live'
    needs: harness-safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact reviewed deployment pin
        run: node -e "const r=require('./.github/acceptance/cloudflare-delivery-runtime.json'); if(!/^[a-f0-9]{40}$/.test(r.commit)||!/^dep-[a-z0-9]+$/.test(r.deployment))process.exit(1);require('node:fs').appendFileSync(process.env.GITHUB_ENV,'VS_EXPECTED_RUNTIME='+r.commit+'\nVS_VERIFIED_RENDER_COMMIT='+r.commit+'\nVS_VERIFIED_RENDER_DEPLOYMENT='+r.deployment+'\n');"
      - name: Verify only retained synthetic TEST-school records and document bytes
        env:
          VS_CF_DELIVERY_ACCEPTANCE: '1'
          VS_CF_DELIVERY_RUN_ID: cf-delivery-20261028-v1
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/cloudflare_delivery_acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-delivery-isolated-acceptance
          path: build/cloud-prerequisites/cloudflare-delivery.json
          if-no-files-found: warn
          retention-days: 7

  isolated-test-drive-ack-readback:
    # A TEST branch-only, explicit source-pinned real-provider acceptance.
    # Existing production and other schools are never admitted.
    if: github.repository == 'cscticket01-hash/Saarthi_Ai' && github.ref == 'refs/heads/feature/smart-sync-3' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: harness-safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VS_EXPECTED_RUNTIME: b6ad70852cbfdf67cfe9e585d56562e15a7c13ba
      VS_VERIFIED_RENDER_COMMIT: b6ad70852cbfdf67cfe9e585d56562e15a7c13ba
      VS_VERIFIED_RENDER_DEPLOYMENT: dep-dbmmvlgm7kps73br03k0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the deployed TEST backend business tree is unchanged
        run: |
          git diff --exit-code "$VS_EXPECTED_RUNTIME" HEAD -- functions oauth-broker staging-school-cloud cloudflare-sync school-backend package.json package-lock.json
          node --check .github/scripts/cloudflare_delivery_acceptance.cjs
      - name: Real isolated TEST Cloudflare accepted → Drive ACK → independent PDF readbacks
        env:
          VS_CF_DELIVERY_ACCEPTANCE: '1'
          VS_CF_DELIVERY_RUN_ID: cf-drive-${{ github.run_id }}
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
        run: node .github/scripts/cloudflare_delivery_acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-cloudflare-drive-ack-readback
          path: build/cloud-prerequisites/cloudflare-delivery.json
          if-no-files-found: warn
          retention-days: 14

  isolated-client-offline-file:
    if: github.event_name == 'push' && github.repository == 'cscticket01-hash/Saarthi_Ai' && github.ref == 'refs/heads/test/r2-offline-provider-20261114'
    needs: harness-safeguards
    concurrency:
      group: sync3-verified-test-school-mutations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VS_EXPECTED_RUNTIME: 0b8d38ad8c6614990dccf75b90c6a6acb2e6d932
      VS_CF_DELIVERY_ACCEPTANCE: '1'
      VS_CF_DELIVERY_RUN_ID: offline-${{ github.run_id }}-${{ github.run_attempt }}
      VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
      VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve the deployed TEST business tree
        run: git diff --exit-code "$VS_EXPECTED_RUNTIME" HEAD -- functions oauth-broker staging-school-cloud cloudflare-sync school-backend package.json package-lock.json
      - name: Accept synthetic file and terminate upload process
        env:
          VS_CF_OFFLINE_PHASE: accept
        run: |
          node .github/scripts/cloudflare_delivery_acceptance.cjs
          cp build/cloud-prerequisites/cloudflare-delivery.json build/cloud-prerequisites/offline-uploader-exit.json
      - name: No uploader process or client API traffic for three minutes
        run: sleep 180
      - name: New process verifies Google receipt and exact bytes without triggering drain
        env:
          VS_CF_OFFLINE_PHASE: verify
        run: node .github/scripts/cloudflare_delivery_acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-client-offline-google-evidence
          path: build/cloud-prerequisites/*.json
          retention-days: 14
