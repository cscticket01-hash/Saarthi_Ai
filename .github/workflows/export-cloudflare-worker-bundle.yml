# Candidate-only CI. Does not call the Cloudflare production API or change Worker bindings.
name: Export verified Cloudflare Worker bundle for controlled rollout
on:
  push:
    branches: [release/cloudflare-worker-bundle-20261103]
    paths:
      - '.github/workflows/export-cloudflare-worker-bundle.yml'
      - 'cloudflare-sync/src/**'
      - 'cloudflare-sync/package.json'
      - 'cloudflare-sync/package-lock.json'
      - 'cloudflare-sync/wrangler.jsonc'
permissions:
  contents: write
jobs:
  worker-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Cloudflare build dependencies
        working-directory: cloudflare-sync
        run: npm ci --ignore-scripts
      - name: Verify and bundle the exact reviewed Worker (dry run; no deploy)
        working-directory: cloudflare-sync
        run: |
          cp .dev.vars.example .dev.vars
          npm run types
          npm run check
          npm run build
          npm test
      - name: Save a content-hashed review bundle to this isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          test -s cloudflare-sync/dist/worker.js
          mkdir -p build/cloudflare-candidate
          cp cloudflare-sync/dist/worker.js build/cloudflare-candidate/worker.js
          size=$(wc -c < build/cloudflare-candidate/worker.js)
          test "$size" -gt 1000
          test "$size" -lt 900000
          digest=$(sha256sum build/cloudflare-candidate/worker.js | awk '{print $1}')
          printf '{"sourceSha":"%s","bundleSha256":"%s","script":"vidya-saarthi-sync","deployed":false}\n' "$GITHUB_SHA" "$digest" > build/cloudflare-candidate/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build/cloudflare-candidate/worker.js build/cloudflare-candidate/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save verified compiled Cloudflare Worker candidate [ci-only]'
            git push origin HEAD:refs/heads/release/cloudflare-worker-bundle-20261103
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-verified-candidate
          path: build/cloudflare-candidate/
          if-no-files-found: warn
