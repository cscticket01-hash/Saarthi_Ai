name: Remove approved one-time staging transfer artifact
on:
  push:
    branches: [windows/easy-connect-draft]
    paths: [.github/workflows/central-staging-rules.yml]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Delete only the approved encrypted transfer artifact
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        node <<'NODE'
        (async()=>{
          const url='https://api.github.com/repos/cscticket01-hash/Saarthi_Ai/actions/artifacts/11267840958';
          const headers={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const r=await fetch(url,{method:'DELETE',headers});
          if(![204,404].includes(r.status))throw Error('Transfer cleanup HTTP '+r.status);
          const check=await fetch(url,{headers});
          if(check.status!==404)throw Error('Encrypted artifact deletion was not verified');
          console.log('Only the approved encrypted staging transfer artifact was deleted and verified absent');
        })().catch(e=>{console.error(e.message);process.exit(1)});
        NODE
