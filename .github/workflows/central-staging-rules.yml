name: Verify and deploy authorized central Firestore rules
on:
  push:
    branches: [windows/easy-connect-draft]
    paths: [.github/workflows/central-staging-rules.yml]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - run: npm --prefix functions install --ignore-scripts
    - run: npm --prefix functions test
    - run: npm --prefix security-tests install --ignore-scripts
    - name: Verify all school isolation rules before deployment
      working-directory: security-tests
      run: npm test
    - name: Deploy reviewed rules without exporting credentials or changing data
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: node .github/scripts/deploy_central_staging_rules.cjs
    - uses: actions/upload-artifact@v4
      with:
        name: central-staging-rules-deployment
        path: staging-rules
        retention-days: 30
    - name: Seal explicitly approved existing credential for Render staging
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        GOOGLE_CLIENT_ID: ${{ vars.SAARTHI_GOOGLE_DESKTOP_CLIENT_ID }}
      run: node .github/scripts/seal_central_staging.cjs
    - uses: actions/upload-artifact@v4
      with:
        name: central-staging-encrypted-transfer
        path: staging-transfer/sealed.json
        retention-days: 1
