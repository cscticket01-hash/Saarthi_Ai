name: Isolated TEST disaster recovery acceptance
on:
  workflow_dispatch:
  push:
    branches: [feature/smart-sync-3]
    paths:
      - .github/workflows/disaster-test.yml
      - .github/workflows/test-cloud-prerequisites.yml
      - .github/workflows/sync3-isolated-readiness.yml
      - lib/testing/isolated_admin_fixture.dart
      - .github/tests/isolated_engine_live_test.dart
      - .github/tests/isolated_admin_fixture_test.dart
      - integration_test/sync_v2_android_live_test.dart
      - .github/scripts/test_disaster_live.cjs
      - .github/scripts/disaster_resume.cjs
      - .github/scripts/await_test_gate.test.cjs
      - .github/scripts/await_test_gate.cjs
      - .github/scripts/disaster_fixture_resume.test.cjs
      - .github/scripts/disaster_fixture_resume.cjs
      - .github/scripts/test_runtime_identity.cjs
      - .github/scripts/settle_test_delta.cjs
      - .github/scripts/settle_test_delta.test.cjs
      - .github/scripts/isolated_live_sync.cjs
      - .github/scripts/test_sync_review_web.cjs
      - .github/scripts/review_response_match.cjs
      - .github/scripts/review_response_body.cjs
      - lib/windows_local_firestore.dart
      - lib/windows_sync_engine.dart
      - functions/**
      - staging-school-cloud/**
      - school-backend/managed/**
permissions:
  contents: read
  actions: read
jobs:
  wait-for-readiness:
    if: github.ref == 'refs/heads/feature/smart-sync-3'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact-source cloud readiness before taking the writer lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VS_TEST_GATE_KIND: readiness
          VS_TEST_GATE_SHA: ${{ github.sha }}
        run: node .github/scripts/await_test_gate.cjs
  disaster-live:
    needs: wait-for-readiness
    # The existing school writer lock protects only the actual snapshot and
    # restore, after the prerequisite workflows have finished using it.
    concurrency:
      group: sync3-verified-test-school-mutations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VS_EXPECTED_TEST_RUNTIME: 177009bad2db0a416ec540a7b90d9b54d5d25053
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove running TEST business tree matches reviewed deployment
        run: git diff --exit-code "$VS_EXPECTED_TEST_RUNTIME" HEAD -- functions oauth-broker staging-school-cloud cloudflare-sync school-backend package.json package-lock.json ':(exclude)oauth-broker/test/**'
      - name: TEST-only bounded backup and separate Sheets/Drive restore readback
        env:
          VS_TEST_CONNECT_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          # Continue the already acknowledged isolated TEST fixture/checkpoints.
          # Recovered monitoring requires fresh cloud proof for changed runtime.
          # Runtime provenance is verified against this successful cloud run;
          # changed backend/engine code cannot reuse its evidence.
          VS_TEST_CLOUD_EVIDENCE_RUN_ID: '38189627964'
          VS_TEST_DISASTER_FIXTURE_RUN_ID: '38020985989'
          VS_TEST_DISASTER_FIXTURE_ATTEMPT: '2'
        run: |
          node --test .github/scripts/disaster_resume.test.cjs .github/scripts/disaster_fixture_resume.test.cjs .github/scripts/await_test_gate.test.cjs
          node .github/scripts/test_disaster_live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-disaster-readback
          path: build/cloud-prerequisites/disaster-live.json
