name: Isolated TEST disaster recovery acceptance
on:
  workflow_dispatch:
  push:
    branches: [feature/smart-sync-3]
    paths:
      - .github/workflows/disaster-test.yml
      - .github/scripts/test_disaster_live.cjs
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-test-disaster-acceptance
  cancel-in-progress: false
jobs:
  disaster-live:
    if: github.ref == 'refs/heads/feature/smart-sync-3'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TEST-only bounded backup and separate Sheets/Drive restore readback
        env:
          VS_TEST_CONNECT_CONFIRM: vs-db8afb01a3be46a983c8284714d06e5d
          VS_TEST_LOGIN_EMAIL: ${{ secrets.VS_TEST_LOGIN_EMAIL }}
          VS_TEST_LOGIN_PASSWORD: ${{ secrets.VS_TEST_LOGIN_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/test_disaster_live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-disaster-readback
          path: build/cloud-prerequisites/disaster-live.json
