name: Native ID record preview - no PDF

on:
  pull_request:
    paths:
      - 'lib/windows_manifest_record_id_preview.dart'
      - 'lib/windows_record_only_id_preview.dart'
      - 'lib/windows_document_templates.dart'
      - 'test/windows_manifest_record_id_preview_test.dart'
      - 'test/windows_id_card_preview_test.dart'
      - '.github/workflows/windows-record-id-preview.yml'

permissions:
  contents: read

jobs:
  native-record-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze native ID preview, selected school template and data-only image loading
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/windows_manifest_record_id_preview.dart lib/windows_record_only_id_preview.dart lib/windows_document_templates.dart test/windows_manifest_record_id_preview_test.dart
      - name: Verify selected front/back artwork layout without PDF generation (Linux-safe)
        run: flutter test test/windows_manifest_record_id_preview_test.dart

  windows-id-compat:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify native selected-template and historical Windows ID regressions
        env:
          APPDATA: ${{ runner.temp }}/saarthi-native-id-proof
          LOCALAPPDATA: ${{ runner.temp }}/saarthi-native-id-proof
        run: flutter test --concurrency=1 test/windows_manifest_record_id_preview_test.dart test/windows_id_card_preview_test.dart
