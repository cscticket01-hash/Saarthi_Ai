name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project files
        run: |
          flutter config --enable-android
          flutter create --platforms=android .
          ls -la android/app/
      - name: Force SDK 34 & Disable AAR Check
        run: |
          # Agar Groovy build file hai toh replace karein
          find android -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} + || true
          find android -name "build.gradle" -exec sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' {} + || true

          # Agar Kotlin DSL (.kts) build file hai toh replace karein
          find android -name "build.gradle.kts" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} + || true
          find android -name "build.gradle.kts" -exec sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' {} + || true

          # Disable checkReleaseAarMetadata via gradle.properties taaki evaluate cycle break na ho
          mkdir -p android
          echo "android.enableD8=true" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties

      - name: Add Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
