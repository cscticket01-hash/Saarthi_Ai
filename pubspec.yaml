name: saarthi_ai
description: "Saarthi AI School Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  crypto: ^3.0.6
  http: ^1.2.0
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  flutter_secure_storage: ^9.2.2
  google_generative_ai: ^0.4.0
  image_picker: ^1.1.2

  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  firebase_messaging: 14.9.4
  flutter_local_notifications: 19.5.0
  geolocator: 11.1.0
  open_filex: 4.7.0
  path_provider: 2.1.4
  cloud_firestore: ^4.17.5

  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  shared_preferences: ^2.2.2

  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.0
  flutter_contacts: ^1.1.9+2

  pdf: ^3.10.8
  printing: 5.13.1
  qr_flutter: ^4.1.0
  mobile_scanner: 5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
